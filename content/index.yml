title: 'CWA - Components Web App'
description: 'Open-source Symfony + Nuxt platform for bespoke websites. Developers build the components; clients edit, draft, schedule and publish on the live page.'
navigation: false
hero:
  title: 'Bespoke websites your clients can <span class="text-primary-400 font-semibold">edit on the page</span>'
  description: 'Components Web App (CWA) is open-source Symfony + Nuxt for agencies and development teams. **Your developers build the components. Your clients draft, schedule and publish on the live site**, with no SaaS bill, no separate CMS, and the production stack included.'
  orientation: vertical
  headline:
    label: '2.0 alpha: try it, build with it, give feedback'
    icon: i-heroicons-arrow-right-20-solid
    to: '/why-cwa#project-status'
  links:
    - label: Open the playground
      icon: i-heroicons-play-circle
      to: 'https://preview.cwa.rocks/login'
      target: _blank
      size: xl
    - label: Get started
      icon: i-ph-rocket-launch-duotone
      to: '/getting-started'
      size: xl
      color: neutral
      variant: subtle
    - label: GitHub
      icon: i-simple-icons-github
      to: 'https://github.com/components-web-app'
      target: _blank
      size: xl
      color: neutral
      variant: ghost
  code: |
    ```bash [Terminal]
    pnpm create cwa my-project
    ```
features:
  title: 'What your clients get<br><span class="text-primary-400">and what you no longer build</span>'
  links:
    - label: 'Why CWA, and when not to choose it'
      trailingIcon: 'i-heroicons-arrow-right-20-solid'
      color: 'primary'
      to: '/why-cwa'
      size: xl
    - label: 'More about the CWA'
      trailingIcon: 'i-heroicons-eye-20-solid'
      color: 'neutral'
      variant: 'subtle'
      to: '/about'
      size: xl
  items:
    - title: 'Edit on the page'
      description: 'Editors switch to edit mode on the live site and change the page they are looking at. There is no separate CMS to learn, and no preview to keep in step.'
      icon: 'i-heroicons-cursor-arrow-rays-20-solid'
      to: '/core-concepts/admin-panel'
      spotlight: true
    - title: 'Change the live site without breaking it'
      description: 'An edit becomes a private draft. Publish it now, or schedule it for a date and time. Visitors keep seeing the live version until then.'
      icon: 'i-heroicons-newspaper-20-solid'
      to: '/core-concepts/draft-and-publish'
      spotlight: true
    - title: 'Clients edit content, not your design'
      description: 'You decide which components each area of a page accepts, and which preset styles editors can pick. The site stays on brand, whoever updates it.'
      icon: 'i-heroicons-paint-brush-20-solid'
      to: '/core-concepts/components'
      spotlight: true
    - title: 'Fast pages, instant updates'
      description: 'Pages are cached and purged by tag when content changes. Every open browser hears about a publish straight away, and readers update with one click.'
      icon: 'i-heroicons-bolt-20-solid'
      to: '/nuxt-module/component-helpers/real-time-updates'
      spotlight: true

benefits:
  sections:
    - title: 'Built for<br><span class="text-primary-400">the people who build websites</span>'
      description: 'CWA is for teams that write code for their clients. A developer or agency builds the site; the client runs it day to day.'
      id: audiences
      align: right
      image: '/images/home/home-supercharge.svg'
      features:
        - name: Agencies and freelancers
          description: Build one component library and reuse it across clients. Self-hosted and MIT licensed, so there are no per-seat CMS fees to pass on.
          icon: i-heroicons-presentation-chart-line
        - name: Symfony and API Platform teams
          description: Your API stays Symfony. Add a Nuxt front end with page building, editing on the page and draft/publish.
          icon: i-heroicons-code-bracket
        - name: Teams that must self-host
          description: Run it on your own servers or Kubernetes cluster. Your content stays in your own database.
          icon: i-heroicons-server-stack
      links:
        - label: Built for business
          to: /built-for-business
          color: neutral
          variant: subtle
          icon: i-heroicons-arrow-right-20-solid
          trailing: true
          size: xl
          class: ml-0
    - title: 'Clients edit content,<br><span class="text-primary-400">not your design</span>'
      description: Many website builders hand every design decision to the person editing. CWA keeps those decisions with your designers and developers.
      id: professionals
      align: left
      image: '/images/home/home-builders.svg'
      features:
        - name: Build the website you want
          description: Components are written by your developers in Vue and PHP, to your design. CWA doesn't impose HTML or a CSS framework.
          icon: i-heroicons-computer-desktop
        - name: Preset styles, not endless choices
          description: Designers define the styles an editor can choose for each component, so updates stay on brand.
          icon: i-heroicons-paint-brush
        - name: New pages fit in
          description: Page templates and allowed components mean a new page uses the same building blocks as the rest of the site.
          icon: i-heroicons-puzzle-piece
      links:
        - label: More about the CWA
          to: /about
          color: neutral
          variant: subtle
          icon: i-heroicons-arrow-right-20-solid
          trailing: true
          size: xl
          class: ml-0
  # Shown after the code example, lower on the page.
  afterCode:
    - title: 'Built on the<br><span class="text-primary-400">shoulders of giants</span>'
      description: |
        The CWA is built on well-known frameworks, so your developers keep the tools and extensions they already use.
      id: shoulders
      align: right
      image: '/images/home/home-giants.svg'
      features:
        - name: Symfony bundle with API Platform
          description: An incredibly powerful and well maintained framework. Extend API Platform and Symfony functionality for services such as SAML authentication protocols or API proxies.
          icon: i-custom-api-platform
        - name: Front-end Nuxt module
          description: Nuxt and VueJS are one of the most enjoyable front-end frameworks to use. Our CWA Nuxt module provides easy to use composables along with a full management system.
          icon: i-simple-icons-nuxtdotjs
        - name: The production stack included
          description: The template ships Docker, a Helm chart for Kubernetes, GitLab and GitHub CI, a tag-purged page cache with optional Cloudflare purges, and Mercure for real-time updates.
          icon: i-heroicons-server-stack-20-solid
      links:
        - label: Deployment
          to: /deployment
          color: neutral
          variant: subtle
          icon: i-heroicons-arrow-right-20-solid
          trailing: true
          size: xl
          class: ml-0

code:
  tabs:
    - key: back-end
      label: '1. Back End'
    - key: front-end
      label: '2. Front End'
  backEnd:
    description: |
      With our API built on top of API Platform and Symfony, it is incredibly simple to setup a component.
      <br><br>
      We provide helpful traits and attributes to quickly add advanced functionality such as draft/live components or handling file uploads.
    code: |
      ```php [api/src/Entity/Title.php]
      <?php

      namespace App\Entity;

      use ApiPlatform\Metadata\ApiResource;
      use Doctrine\ORM\Mapping as ORM;
      use Silverback\ApiComponentsBundle\Annotation as Silverback;
      use Silverback\ApiComponentsBundle\Entity\Core\AbstractComponent;
      use Silverback\ApiComponentsBundle\Entity\Utility\PublishableTrait;
      use Symfony\Component\Validator\Constraints as Assert;

      #[Silverback\Publishable]
      #[ApiResource(mercure: true)]
      #[ORM\Entity]
      class Title extends AbstractComponent
      {
        use PublishableTrait;

        #[Assert\NotBlank(groups: ['Title:published'])]
        #[ORM\Column(type: 'text', nullable: true)]
        public ?string $title = null;
      }

      ```
  frontEnd:
    tabs:
      - key: page
        label: 'Page'
        description: |
          The CWA Nuxt module means you have nearly all the functionality you need right from the start.
          <br><br>
          You'll quickly setup layouts and pages, using our `<CwaComponentGroup />`{class="mx-0.5 px-1 py-0.5 rounded font-bold text-nowrap text-base bg-primary-100 dark:bg-primary-800"} Vue component to define where your CWA components will appear.
        code: |
          ```vue [app/cwa/pages/PrimaryPageTemplate.vue]
          <template>
            <div>
              <CwaComponentGroup
                reference="primary"
                :location="props.iri"
              />
            </div>
          </template>

          <script setup lang="ts">
          import type { IriProp } from '#cwa/composables/cwa-resource'

          const props = defineProps<IriProp>()
          </script>
          ```
      - key: component
        label: 'Component'
        description: |
          With a few composables and very little code you can quickly create your CWA components.
          <br><br>
          Load the data provided by the API and add any functionality you need just like any other Vue component.
        code: |
          ```vue [app/cwa/components/Title/Title.vue]
          <template>
            <h1 class="text-primary text-4xl font-extrabold">
              {{ resource?.data?.title || 'No Title' }}
            </h1>
          </template>

          <script setup lang="ts">
          import type { IriProp } from '#cwa/composables/cwa-resource'
          import { useCwaComponent } from '#imports'

          const props = defineProps<IriProp>()
          const { resource, exposeMeta } = useCwaComponent(props)
          defineExpose(exposeMeta)
          </script>
          ```

      - key: admin
        label: 'Admin'
        description: |
          Once you have your data and component setup, all that’s left is to add your own custom tabs into our Components Manager Toolbar.
          <br><br>
          With very little code (using our composables and pre-built Vue components) the end-user will be able to manage this new component using the component manager toolbar.
        code: |
          ```vue [app/cwa/components/Title/admin/Title.vue]
          <template>
            <CwaUiFormLabelWrapper label="Title">
              <CwaUiFormInput
                v-model="titleModel.model.value"
              />
            </CwaUiFormLabelWrapper>
          </template>

          <script setup lang="ts">
          import {
            useCwaResourceManagerTab,
            useCwaResourceModel
          } from '#imports'

          const { exposeMeta, iri } =
            useCwaResourceManagerTab({ name: 'Title' })

          const titleModel =
            useCwaResourceModel<string>(iri, 'title')

          defineExpose(exposeMeta)
          </script>
          ```



