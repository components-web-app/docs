title: 'Built for Business'
description: 'Who CWA is for, how your team and your clients work with it, what it costs and the project''s status.'
navigation: false
hero:
  title: 'Built for <span class="text-primary-400 font-semibold">Business</span>'
  description: 'For agencies, Symfony teams and organisations that self-host. Your developers build the site once; your clients and editors run it on the page.'
  align: left
  ui:
    base: 'order-last lg:order-first'
  links:
    - label: How CWA compares
      icon: i-heroicons-scale
      to: '/compare'
      size: xl
      color: neutral
      variant: subtle
    - label: Open the playground
      icon: i-ph-play-duotone
      to: 'https://preview.cwa.rocks/login'
      target: _blank
      size: xl
pageCards:
  items:
    - title: 'Free and MIT licensed'
      description: 'The API bundle and the Nuxt module are MIT licensed. There are no per-seat or per-site fees, so there is nothing to pass on to your clients.'
      icon: 'i-simple-icons-opensourceinitiative'
    - title: 'Your servers, your data'
      description: 'You host it: on your own servers or your own Kubernetes cluster. Your content stays in your own database, with no vendor lock-in.'
      icon: 'i-heroicons-server-stack'
    - title: 'Editing on the page'
      description: 'Editors change the page they are looking at, on the live site. There is no separate CMS to learn, and they can only use the components and styles your developers provide.'
      icon: 'i-heroicons-cursor-arrow-rays'
businessSizes:
  title: Who CWA <span class="text-primary-400 font-semibold">is for</span>
  description: CWA is for teams that write code for a website and hand it to the people who run it. Editors need no code knowledge, but a developer or agency builds each site.
  cards:
    - title: 'Agencies and freelancers'
      description: 'Build one component library and reuse it across clients. Each client edits their own site on the page, and there are no per-seat CMS fees to pass on.'
      icon: 'i-heroicons-building-office-2'
    - title: 'Symfony and API Platform teams'
      description: 'Your API stays Symfony. Get a Nuxt front end with page building, editing on the page, draft and publish, and real-time updates.'
      icon: 'i-heroicons-code-bracket'
    - title: 'Teams that must self-host'
      description: 'Data residency, no lock-in, MIT licensed. Run the whole stack on infrastructure you control.'
      icon: 'i-heroicons-lock-closed'
teamwork:
  title: Built with <br><span class="text-primary-400 font-semibold">teamwork</span> in mind
  align: center
  description: |
    The CWA has been built with first-hand knowledge of the agile web development workflow, from concept and discovery to delivery, monitoring and maintenance.
    <br><br>
    Streamline your team's scrum workflow from building company branding and UI kits, to how the website and product managers interact with the developers and clients. The CWA gives a clear structure for building individual UI components, and lets the right people in the right teams work in their areas of expertise.
timeline:
  - title: Built for <span class="text-primary-400 font-semibold">structured planning</span>
    description: |
      During the discovery phase, a manager will work with a client to build an understanding of requirements. Usually a plan is drawn up in the form of wireframes (also known as website blueprints) as user flows. <span class="text-primary-400 font-semibold">Each section within the blueprint can be considered a component that will need to be created.</span> Each has its own specific purpose and requirements.
  - title: Built for <span class="text-primary-400 font-semibold">clarity in design</span>
    description: |
      Once you have a blueprint, <span class="text-primary-400 font-semibold">the choice of style frameworks and UI kits is flexible and a business decision for you to make with your UI designer.</span> Each component can be designed with the branding and UI kit to the specification provided which can then be passed to the developer.
  - title: Built for <span class="text-primary-400 font-semibold">happy developers</span>
    description: |
       Being able to communicate requirements clearly to developers and providing them with concise jobs leads to great unity between teams. The developer just needs to focus on creating individual components to specifications. Then content and website structure can be populated by other team members to improve efficiency.
    features:
      - title: DX first
        description: Happy developers are productive developers. It is easy for developers to build in advanced functionality and to get up and running.
        icon: i-heroicons-face-smile
      - title: CSS framework agnostic
        description: While we ship with Tailwind configured by default, you can use whichever framework is best for your needs.
        icon: i-ph-file-css
      - title: Feeling familiar
        description: We have built the CWA on top of very well documented and supported frameworks. You'll find developers are quick to learn how the CWA sits on top and the talent is available in the job seekers market.
        icon: i-ph-eye
      - title: Extensible
        description: Extend functionality as you would with any other application built on these frameworks. Documentation on functionality is abundant.
        icon: i-ph-puzzle-piece
      - title: Devops configured
        description: No need to spend endless hours working out how to deploy. The template has working GitLab and GitHub pipelines that build, test and deploy to Kubernetes with Helm.
        icon: i-ph-dev-to-logo
      - title: Building for the admin
        description: We created an advanced in-line content management toolbar for resources, instead of a separate CMS. Our system is intuitive for both users and developers.
        icon: i-ph-crane
  - title: Built for <span class="text-primary-400 font-semibold">easy assembly</span>
    description: |
      Managers or clients will find it easy and intuitive to begin working with the website once the developers have the components ready. Simply add the pages required using the website builder, knowing exactly where they need to go to create and update their custom website.
    features:
      - title: Stand-alone pages
        description: Your website can include standalone pages or even mini websites for targeted PPC landing pages or promotional marketing.
        icon: i-ph-file
      - title: Search Engine Optimisation
        description: Built-in management of your page titles and meta descriptions while leaving you in control of on-page SEO.
        icon: i-ph-binoculars
      - title: Route management
        description: Search, sort and manage routes so you can easily audit your public web pages and manage any redirects.
        icon: i-ph-signpost
      - title: Schedule a page
        description: A route can be live, not live, or scheduled to go live at a date and time. Until then, visitors get a 404 and the page stays out of the sitemap, while admins can still preview and edit it.
        icon: i-ph-calendar-check
      - title: Page management
        description: Easily search, sort, filter and edit settings on your pages reducing workload on page management.
        icon: i-heroicons-document-duplicate
  - title: Built for <span class="text-primary-400 font-semibold">writing content</span>
    description: |
      Writing content is not an easy or simple task. It requires development, review from other team members and collaboration. The CWA has features which helps to streamline this workflow.
    features:
      - title: Drafting changes
        description: Write on the site itself. Changes to a component become a private draft until you publish it.
        icon: i-ph-pencil-ruler
      - title: Scheduled publishing
        description: Publish a draft now, or pick a date and time. Visitors keep seeing the live version until then.
        icon: i-ph-clock
      - title: Real-time collaboration
        description: Work on content together. When someone saves or publishes a change, other signed-in editors are told straight away.
        icon: i-ph-arrows-in-cardinal
      - title: Live editing
        description: If you are in the middle of drafting changes, but you notice the live version needs an update, no problem - switch to edit the live version and continue with your draft when you are done.
        icon: i-ph-lightning
      - title: Template pages
        description: For repetitive content structures, such as articles, news or blogs, the CWA has you covered. Create your dynamic page for structure and add content for each entry.
        icon: i-ph-file-dashed
      - title: Content from other services
        description: Content lives behind a REST API. Another service, signed in with an admin account, can create draft components through the API, and editors review and publish them on the page.
        icon: i-ph-robot
  - title: Built for <span class="text-primary-400 font-semibold">the future</span>
    description: |
      Websites evolve and grow, and we aim to make the process of keeping up to date with changes easy. As your business grows requirements will change, so you can easily create new components which can fit the needs of ever evolving business.
