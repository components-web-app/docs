faq:
  title: Business FAQs
  description: Common questions about cost, skills, support and the project's status
  items:
    - label: How much does it cost?
      content: |
        The software is free and open source, under the MIT licence. There are no per-seat or per-site fees.
        <br><br>
        You pay for hosting, and for the developers who build and maintain your components. A small business normally gets a CWA site through a developer or an agency.
    - label: What skills does it need?
      content: |
        A CWA site needs <strong>PHP</strong> (Symfony and API Platform) for the API, <strong>Vue</strong> (Nuxt) for the front end, and <strong>Docker</strong> and <strong>Kubernetes</strong> to run it in production.
        <br><br>
        You don't start from nothing. <code>pnpm create cwa</code> generates a project from the template, which already has the Docker setup, a Helm chart for Kubernetes, and GitLab or GitHub pipelines that build, test and deploy. See <a href="/getting-started/installation">Installation</a> and <a href="/deployment">Deployment</a>.
        <br><br>
        Editors need no code knowledge. They work on the page, once your developers have built the components.
    - label: What is the project's status?
      content: |
        CWA 2 is a prerelease (2.0.0-alpha), heading for a beta. It runs production sites; configuration can still change between releases, always with upgrade notes.
        <br><br>
        The core model (layouts, pages, component groups, components, routes, draft and publish) is in place. Read each release's upgrade notes on the <a href="/getting-started/releases">Releases</a> page before you update, and see <a href="/getting-started/releases#versions-and-support">Releases › Versions and support</a> for how versions and support work.
        <br><br>
        Release notes: <a href="https://github.com/components-web-app/api-components-bundle/blob/main/CHANGELOG.md">API bundle</a>, <a href="https://github.com/components-web-app/cwa-nuxt-module/blob/main/CHANGELOG.md">Nuxt module</a>, <a href="https://github.com/components-web-app/components-web-app/blob/main/CHANGELOG.md">template</a>.
    - label: What guarantees are given?
      content: |
        The code is MIT licensed and provided as is, with no warranty and no guaranteed response time. Until 2.0.0, plan for upgrade work between releases. Only the latest 2.0.0 prerelease gets security fixes.
        <br><br>
        Report a security problem privately, as each repository's security policy describes: the <a href="https://github.com/components-web-app/components-web-app/blob/main/SECURITY.md">template</a>, the <a href="https://github.com/components-web-app/api-components-bundle/blob/main/SECURITY.md">API bundle</a> and the <a href="https://github.com/components-web-app/cwa-nuxt-module/blob/main/SECURITY.md">Nuxt module</a>. See <a href="/getting-started#licence-security-and-contributing">Introduction › Licence, security and contributing</a>.
    - label: What developers do I need?
      content: Most developers with some experience will be able to pick up the basic concepts from both the API and front-end quickly. Developers with experience with Symfony, API Platform or just PHP will gravitate more to the back-end. Those with experience and interest with VueJS and Nuxt will gravitate to the front-end.
    - label: Who can build a CWA site for us?
      content: Any developer or agency that knows Symfony and Nuxt; the docs and the template are public. <a href="https://silverbackwebapps.com/">Silverback Web Apps</a>, who created CWA and maintain it, also build CWA sites for clients.
    - label: Can CWA scale?
      content: |
        Yes, on Kubernetes. The template's Helm chart autoscales the Nuxt front end, up to 6 pods by default.
        <br><br>
        The API runs as one pod by default. Turn on scaled mode and it runs on two or more pods: the page cache moves to a shared Redis store and real-time updates go through one shared Mercure hub, so losing a pod isn't an outage. See <a href="/deployment/scaled-mode">Scaled Mode</a>.
        <br><br>
        The template includes a k6 load-testing harness so you can measure your own site. See <a href="/deployment/load-testing">Load Testing</a>.
    - label: Where do we get help?
      content: Ask questions and report bugs in the <a href="https://github.com/components-web-app">GitHub repositories</a>, where the core project is developed. For help with your own site, ask the developer or agency that built it.
