<?xml version="1.0" encoding="UTF-8"?>
<svg width="303px" height="303px" viewBox="0 0 303 303" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>A real editorial workflow</title>
    <g fill="none" fill-rule="evenodd">
        <circle fill="#2C2C35" cx="151.5" cy="151.5" r="151.5"/>

        <!-- The page being edited -->
        <rect fill="#FFFFFF" x="101" y="111" width="101" height="81" rx="3"/>
        <rect fill="#00FDDD" x="101" y="111" width="101" height="15" rx="3"/>
        <rect fill="#00FDDD" x="101" y="120" width="101" height="6"/>
        <circle fill="#2C2C35" cx="109" cy="118.5" r="2.5"/>
        <circle fill="#2C2C35" cx="117" cy="118.5" r="2.5"/>
        <rect fill="#2C2C35" x="111" y="136" width="58" height="7" rx="1.5"/>
        <rect fill="#2C2C35" opacity="0.35" x="111" y="150" width="81" height="4" rx="1"/>
        <rect fill="#2C2C35" opacity="0.35" x="111" y="159" width="74" height="4" rx="1"/>
        <rect fill="#2C2C35" opacity="0.35" x="111" y="168" width="78" height="4" rx="1"/>
        <rect stroke="#00FDDD" stroke-width="2.5" stroke-dasharray="5 4" x="107" y="131" width="68" height="17" rx="2"/>

        <!-- Connectors -->
        <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
            <line x1="92" y1="100" x2="82" y2="90"/>
            <line x1="211" y1="100" x2="221" y2="90"/>
            <line x1="92" y1="203" x2="82" y2="213"/>
            <line x1="211" y1="203" x2="221" y2="213"/>
        </g>

        <!-- Draft: a pencil -->
        <g transform="translate(52 52)">
            <path d="M8 30 L28 10 L34 16 L14 36 L6 38 Z" fill="#00FDDD"/>
            <path d="M28 10 L32 6 L38 12 L34 16 Z" fill="#FFFFFF"/>
        </g>

        <!-- Schedule: a calendar -->
        <g transform="translate(222 52)">
            <rect fill="#FFFFFF" x="0" y="6" width="34" height="30" rx="3"/>
            <rect fill="#00FDDD" x="0" y="6" width="34" height="9" rx="3"/>
            <rect fill="#00FDDD" x="0" y="11" width="34" height="4"/>
            <rect fill="#FFFFFF" x="7" y="1" width="4" height="9" rx="2"/>
            <rect fill="#FFFFFF" x="23" y="1" width="4" height="9" rx="2"/>
            <rect fill="#2C2C35" x="6" y="20" width="6" height="5" rx="1"/>
            <rect fill="#2C2C35" x="14" y="20" width="6" height="5" rx="1"/>
            <rect fill="#00FDDD" x="22" y="20" width="6" height="5" rx="1"/>
            <rect fill="#2C2C35" x="6" y="28" width="6" height="5" rx="1"/>
        </g>

        <!-- Edit once, update everywhere: one block on several pages -->
        <g transform="translate(46 214)">
            <rect stroke="#FFFFFF" stroke-width="3" x="12" y="0" width="28" height="24" rx="2"/>
            <rect fill="#2C2C35" stroke="#FFFFFF" stroke-width="3" x="6" y="6" width="28" height="24" rx="2"/>
            <rect fill="#2C2C35" stroke="#FFFFFF" stroke-width="3" x="0" y="12" width="28" height="24" rx="2"/>
            <rect fill="#00FDDD" x="6" y="20" width="16" height="8" rx="1"/>
        </g>

        <!-- Live: two arrows chasing each other -->
        <g transform="translate(224 216)" stroke="#00FDDD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30 14 A14 14 0 0 0 6 8"/>
            <path d="M6 1 L6 9 L14 9"/>
            <path d="M4 22 A14 14 0 0 0 28 28"/>
            <path d="M28 35 L28 27 L20 27"/>
        </g>
    </g>
</svg>
