# Quiz settings. Validated by QuizConfigSchema in quiz/schema.ts.
# Pass marks are shown in v1. A future exam's placement uses them.

quizLength: 10

# The start page offers a topic only when it has this many families (distinct facts) at the level.
minTopicFamilies: 8

levels:
  - id: beginner
    title: Beginner
    blurb: What CWA is. Layouts, pages, components, draft and publish.
    passMark: 0.7
    ranks:
      - { min: 0, title: Fresh install }
      - { min: 0.5, title: First layout }
      - { min: 0.7, title: Page builder }
      - { min: 0.9, title: Component wrangler }
  - id: intermediate
    title: Intermediate
    blurb: Building with the module and the bundle. Composables, fixtures, dynamic pages, the admin.
    passMark: 0.7
    ranks:
      - { min: 0, title: Reading the docs }
      - { min: 0.5, title: Fixture loader }
      - { min: 0.7, title: Site builder }
      - { min: 0.9, title: Admin power user }
  - id: advanced
    title: Advanced
    blurb: Caching, deployment, security, real-time updates and uploads.
    passMark: 0.7
    ranks:
      - { min: 0, title: Cache miss }
      - { min: 0.5, title: Cache warm }
      - { min: 0.7, title: Edge cached }
      - { min: 0.9, title: Production ready }
  - id: expert
    title: Expert
    blurb: How it works inside. Questions come from the source of the bundle, the Nuxt module and the template, and some cover behaviour the docs don't describe.
    # Shorter while the expert bank is small, so two quizzes share fewer questions. Back to 10 at 40+ families.
    quizLength: 8
    passMark: 0.6
    ranks:
      - { min: 0, title: Curious reader }
      - { min: 0.5, title: Source diver }
      - { min: 0.6, title: Core contributor material }
      - { min: 0.9, title: "You wrote it, didn't you?" }

areas:
  - { id: core-concepts, label: Core concepts }
  - { id: api, label: API }
  - { id: nuxt-module, label: Nuxt module }
  - { id: deployment, label: Deployment }

# Tags drive "read next" on the result screen. Add one here before using it on a question.
tags:
