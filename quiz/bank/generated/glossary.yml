    type: multiple-choice
    family: page-template-vs-template-page
    prompt: "Which term does this describe? “A page record with `isTemplate: true`.”"
    options:
      - id: a
        text: Component group
      - id: b
        text: "`uiComponent`"
      - id: c
        text: Template page
      - id: d
        text: Page template
    answer:
      correct: c
      explanation: "A page record with `isTemplate: true`. It has no route of its own: every [page
        data](/core-concepts/glossary#page-data) record of one type renders through it. In the admin it's a
        **Dynamic** page. Not the same as a [page template](/core-concepts/glossary#page-template). See
        [Layouts & Pages → Template Pages](/core-concepts/layouts-and-pages#template-pages-istemplate-true)."
    sources:
