    type: multiple-choice
    family: page-template-vs-template-page
    prompt: Which term does this describe? “A page that is the shared design for one type of page data, such as
      every blog article.”
    options:
      - id: a
        text: Component group
      - id: b
        text: "`uiComponent`"
      - id: c
        text: Template page
      - id: d
        text: Page template
    answer:
      correct: c
      explanation: "A page that is the shared design for one type of page data, such as every blog article. It has
        `isTemplate: true` and no route of its own: each [page data](/core-concepts/glossary#page-data) item
        of that type is shown through it. In the admin it's a **Dynamic** page. Not the same as a [page
        template](/core-concepts/glossary#page-template). See [Layouts & Pages › Template
        Pages](/core-concepts/layouts-and-pages#template-pages-istemplate-true)."
