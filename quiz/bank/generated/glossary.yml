    type: multiple-choice
    family: page-template-vs-template-page
    prompt: Which term does this describe? “The Vue file a page renders through, in `app/app/cwa/pages/`.”
    options:
      - id: a
        text: Template page
      - id: b
        text: "`uiComponent`"
      - id: c
        text: Component group
      - id: d
        text: Page template
    answer:
      correct: d
      explanation: The Vue file a page renders through, in `app/app/cwa/pages/`. It places the page's component
        groups. In the admin it's the **Page UI**. Not the same as a [template
        page](/core-concepts/glossary#template-page).
    sources:
