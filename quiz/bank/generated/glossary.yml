    type: multiple-choice
    family: term:27zzqu
    prompt: Which term does this describe? “A record for one item of repeating content, such as one blog article.”
    options:
      - id: a
        text: Component
      - id: b
        text: Layout
      - id: c
        text: "`uiComponent`"
      - id: d
        text: Page data
    answer:
      correct: d
      explanation: A record for one item of repeating content, such as one blog article. It extends
        `AbstractPageData`, has its own route and fields, and renders through a template page. See [Dynamic
        Pages](/core-concepts/dynamic-pages).
    sources:
      - kind: docs
