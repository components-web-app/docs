      - id: c
        text: Component group
      - id: d
        text: Page template
    answer:
      correct: c
      explanation: A named, ordered list of components, such as `main` or `banner`, that belongs to a layout, page
        or component. Each component in it sits in a [component
        position](/core-concepts/glossary#component-position). A Vue file declares the group with
        `<CwaComponentGroup reference="main">`, and editors add components to it in [edit
        mode](/core-concepts/glossary#edit-mode). Also called a group. See [`<CwaComponentGroup
        />`](/nuxt-module/cwa-components/cwa-component-group).
