    type: pick-the-line
    family: target:mercure-flag
    prompt: An editor changes this resource, and visitors who have the page open are told the content is outdated,
      without reloading. Which line makes that happen?
    why: If published changes never reach visitors who already have the page open, check the resource's
      `#[ApiResource]` for this.
    code:
      lang: php
      text: |-
        // api/src/Entity/BlogArticleData.php
        #[ORM\Entity]
        #[ApiResource(mercure: true)]
        class BlogArticleData extends AbstractPageData
        {
            #[ORM\ManyToOne(targetEntity: HtmlContent::class)]
            #[ORM\JoinColumn(nullable: true, onDelete: 'SET NULL')]
            public ?HtmlContent $htmlContent = null;
        }
    answer:
      lines:
        - 3
      explanation: "`mercure: true` on `#[ApiResource]` makes the API publish each change to the Mercure hub. Every
        browser that loaded the resource receives it; the module stages it behind a \"content is outdated\"
        notice, and the reader's Update click applies it."
    sources:
      - kind: docs
        page: /api/components/annotations/publishable
        anchor: interaction-with-mercure
        sectionHash: sha256:2117062c85a6c4a1
        title: Publishable › Interaction with Mercure
