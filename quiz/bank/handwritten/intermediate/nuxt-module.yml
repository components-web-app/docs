# Hand-written intermediate questions about the Nuxt module.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: nuxt.setup.extends-layer
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [module-setup]
    type: pick-the-line
    difficulty: 1
    prompt: In this `nuxt.config.ts`, which line gives the app the CWA sign-in pages, the `/_cwa` admin panel and the root layout?
    why: >-
      If `/login` or `/_cwa` gives a 404 in a new app, check that the config extends the layer rather than
      listing the module.
    code:
      lang: ts
      text: |-
        // app/nuxt.config.ts
        export default defineNuxtConfig({
            extends: ['@cwa/nuxt/layer'],
            modules: [
                '@nuxt/ui',   // optional — for your own components; CWA doesn't require it
                '@nuxt/image' // optional — only if you use <NuxtImg>
            ]
        })
    answer:
      lines: [3]
      explanation: >-
        CWA ships as a Nuxt layer. Extending `@cwa/nuxt/layer` registers the module and adds the auth pages,
        the admin panel and `cwa-root-layout`. Adding the module to `modules` instead skips the layer.
    sources:
      - kind: docs
        page: /nuxt-module/module-setup
        anchor: install
        sectionHash: sha256:be07d232ea5ebdc5
        title: 'Module Setup › Install'
        block: 1
        blockHash: sha256:4452d03e14874b65

  - id: nuxt.admin.add-page-data-link
    version: 3
    status: live
    level: intermediate
    area: nuxt-module
    tags: [admin, dynamic-pages]
    type: spot-the-mistake
    difficulty: 3
    prompt: >-
      Courses and training modules are both page data (repeating content, one entry each), and each training
      module sits under a course. This "Add a training module" link should open the admin's add form with the
      course as the parent and the training module template page already chosen. One line is wrong. Click it.
    why: >-
      The form still opens, so the mistake is easy to miss: editors just have to pick the template themselves.
    code:
      lang: vue
      text: |-
        <template>
            <NuxtLink
                :to="{
                    path: '/_cwa/data/trainingModuleData/add',
                    query: { parentPageData: courseIri, page: moduleTemplateIri },
                }"
            >
                Add a training module
            </NuxtLink>
        </template>
    answer:
      line: 5
      fix: "            query: { parentPageData: courseIri, template: moduleTemplateIri },"
      explanation: >-
        The template's query parameter is `template`. `?page=` is the page number of the list behind the form,
        so the template is never filled in.
    since: [{ repo: cwa-nuxt-module, version: '2.0.0-alpha.15' }]
    sources:
      - { kind: docs, page: /nuxt-module/cwa-layer/admin-panel, anchor: linking-to-the-add-page-data-form, sectionHash: 'sha256:1ac8260e0abef39d', title: 'Admin Panel Reference › Linking to the add page data form', block: 0, blockHash: 'sha256:cbd5be71df6d7a72' }
    author: llm-draft

  - id: nuxt.page-data.read-in-computed
    version: 3
    status: live
    level: intermediate
    area: nuxt-module
    tags: [cwa-api, dynamic-pages]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A page template's `<script setup>` reads the blog article the visitor is viewing (the current page data)
      from `cwa.resources.pageData.value`. Why read it inside a `computed`?
    why: >-
      This bites on client-side navigation: move from one article to another and a setup-time read still shows
      the first article's data.
    options:
      - { id: a, text: '`useCwa()` only works when it''s called inside a `computed`' }
      - { id: b, text: 'A direct read sends a second request for the page data on every render' }
      - { id: c, text: 'It changes after setup, and a setup-time read keeps the first value' }
      - { id: d, text: 'Values read outside a `computed` can''t be edited in the admin' }
    answer:
      correct: c
      explanation: >-
        `pageData` is empty until the page data fetch resolves, and it changes on client-side navigation between
        articles that share the template page, which reuses the component. A setup-time read keeps the first
        value; a `computed` follows it.
    sources:
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: reading-pagedata-in-your-vue-component, sectionHash: 'sha256:76c2ecae76dda115', title: 'Dynamic Pages › Reading PageData in Your Vue Component' }
    author: llm-draft

  - id: nuxt.auth.ssr-safe-state
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [auth]
    type: multiple-choice
    difficulty: 3
    prompt: A layout's header changes when someone signs in. Which `cwa.auth` values can the layout render on the server, without `<ClientOnly>`?
    why: >-
      This decides which parts of a header can be in the first HTML a visitor gets, and which must wait for
      the browser.
    options:
      - { id: a, text: '`signedIn` and `status`' }
      - { id: b, text: '`isAdmin` and `user`' }
      - { id: c, text: '`roles` and `isAdmin`' }
      - { id: d, text: '`signedIn` and `isAdmin`' }
    answer:
      correct: a
      explanation: >-
        `signedIn` and `status` come from a cookie, so the server can render them. `isAdmin`, `user` and `roles`
        need the user loaded from `/me`, so wrap UI that reads them in `<ClientOnly>`.
    sources:
      - { kind: docs, page: /nuxt-module/building-your-ui/creating-layouts, anchor: auth-conditional-ui, sectionHash: 'sha256:d00d8d10438fee63', title: 'Layouts › Auth-Conditional UI' }
    author: llm-draft

  - id: nuxt.auth.roles-access
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [auth, cwa-api]
    type: multiple-choice
    difficulty: 3
    prompt: In a component's `<script setup>`, with `const cwa = useCwa()`, how do you read the signed-in user's roles?
    why: >-
      Add `.value` and a role check fails for a signed-in user and throws when nobody is signed in, so the UI
      it guards never appears.
    options:
      - { id: a, text: '`cwa.auth.roles.value`' }
      - { id: b, text: '`cwa.auth.roles`' }
      - { id: c, text: '`await cwa.auth.roles()`' }
      - { id: d, text: '`cwa.auth.user.value.roles`' }
    answer:
      correct: b
      explanation: >-
        `user` and `roles` are plain reactive getters, not refs, so `.value` on them gives `undefined`.
        `roles` is `undefined` when nobody is signed in.
    sources:
      - { kind: docs, page: /nuxt-module/cwa-api/auth, anchor: state, sectionHash: 'sha256:8e7fd8e732d171f5', title: 'cwa.auth › State' }
    author: llm-draft

  - id: nuxt.config.layout-classes
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [layouts-and-pages, module-setup]
    type: multiple-choice
    difficulty: 3
    prompt: Editors should be able to pick a style for a layout, such as a dark theme. How do you declare the styles they can pick?
    why: >-
      Don't add a "Default" entry yourself. One is already there, so editors would see two.
    options:
      - { id: a, text: 'A list of `{ value, label }` objects under `cwa.resources`' }
      - { id: b, text: A `styles` prop on the layout's `<CwaComponentGroup>` }
      - { id: c, text: A `uiClassNames` default in the Layout PHP entity }
      - { id: d, text: A label → class map under `cwa.layouts` in `nuxt.config` }
    answer:
      correct: d
      explanation: >-
        `cwa.layouts.<Name>.classes` maps the label the admin sees to a class string. A "Default" option with no
        classes is added for you.
    sources:
      - { kind: docs, page: /nuxt-module/building-your-ui/creating-layouts, anchor: registering-layout-options, sectionHash: 'sha256:260fe9e4c1275e6b', title: 'Layouts › Registering Layout Options' }
    author: llm-draft

  - id: nuxt.component.style-variants-where
    version: 2
    status: live
    family: component-style-variants
    level: intermediate
    area: nuxt-module
    tags: [components]
    type: multiple-choice
    difficulty: 3
    prompt: Editors should be able to pick a style variant for a component type, such as a highlighted Quote. Where do you declare the variants?
    why: >-
      Styles declared for a component in `nuxt.config` are never offered to editors, so when a style picker is
      missing, look in the Vue file.
    options:
      - { id: a, text: 'In its Vue file, with `useCwaComponent`''s `styles` option' }
      - { id: b, text: Under `cwa.resources.<Name>.classes` in your `nuxt.config.ts` }
      - { id: c, text: 'In the component''s PHP entity, with an attribute' }
      - { id: d, text: 'In an admin tab, with `useCwaResourceModel`' }
    answer:
      correct: a
      explanation: >-
        Component styles live in the Vue file: `useCwaComponent(props, [], { styles: { classes } })`. `classes`
        in `nuxt.config` exists on `layouts` and `pages` only.
      optionNotes:
        b: '`cwa.resources` has no `classes` key.'
    sources:
      - { kind: docs, page: /nuxt-module/configuration/nuxt-config, anchor: full-cwa-reference, sectionHash: 'sha256:1049a372b928f1f9', title: 'Nuxt Config › Full cwa: Reference' }
      - { kind: docs, page: /nuxt-module/composables/component/use-cwa-component, anchor: style-variants, sectionHash: 'sha256:73b5fa696d55a19d', title: 'useCwaComponent › Style Variants' }
    author: llm-draft

  - id: nuxt.component.nested-group-location
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [components]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A component's Vue file declares a component group of its own (a named list of components, such as
      `main`) with `<CwaComponentGroup>`. What do you pass as the group's `location` prop?
    why: >-
      Each component then gets a group of its own, so two components of the same type on one page can hold
      different content.
    options:
      - { id: a, text: The page's IRI from `$cwa.resources` }
      - { id: b, text: The component's own `iri` prop }
      - { id: c, text: The layout's IRI from `$cwa.resources` }
      - { id: d, text: The group's `reference` string }
    answer:
      correct: b
      explanation: >-
        Pass the component's `iri`. A nested group resolves its `location` to the component's published IRI
        itself, so you rarely need `publishedIri`.
    sources:
      - { kind: docs, page: /nuxt-module/composables/component/use-cwa-component, anchor: return-values, sectionHash: 'sha256:db39379ae980b37e', title: 'useCwaComponent › Return Values' }
    author: llm-draft

  - id: nuxt.component.resource-states
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [composables]
    type: multiple-choice
    difficulty: 3
    prompt: In a component's Vue file, `useCwaComponent(props)` returns `resource`. `resource.value` is an object, but it has no `data`. What does that tell you?
    why: >-
      This is the state your loading placeholder and error message handle. Treat it as not ready, not as an
      empty component.
    options:
      - { id: a, text: The store has no entry for this IRI yet }
      - { id: b, text: The component is a draft nobody published }
      - { id: c, text: The component was deleted in the admin }
      - { id: d, text: 'The fetch is still running, or it failed' }
    answer:
      correct: d
      explanation: >-
        `undefined` means the store has no entry. An object without `data` means the fetch is in progress or
        failed; `apiState.status` says which. With `data`, it's ready.
    sources:
      - { kind: docs, page: /nuxt-module/composables/component/use-cwa-component, anchor: example, sectionHash: 'sha256:df121ccdabd91158', title: 'useCwaComponent › Example' }
    author: llm-draft

  - id: nuxt.admin.instant-add
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [admin, module-setup]
    type: multiple-choice
    difficulty: 2
    prompt: 'A component type has `instantAdd: true` in `nuxt.config`. What does that change for editors?'
    why: >-
      Use it for components with nothing to set up, such as a divider or spacer. Anything editors must fill in
      is better added through the panel.
    options:
      - { id: a, text: 'It''s added at once, with no config panel first' }
      - { id: b, text: 'It can go in any component group, whatever its allowed list' }
      - { id: c, text: It's added to every new page automatically }
      - { id: d, text: The component is published as soon as it's added }
    answer:
      correct: a
      explanation: >-
        In the Add Component dialog, a type with `instantAdd: true` is added straight away. Otherwise a config
        panel appears first.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: adding-a-component, sectionHash: 'sha256:a7be3b997ea7de32', title: 'The Admin Panel › Adding a Component' }
    author: llm-draft

  - id: nuxt.real-time.visitor-notice
    version: 2
    status: live
    level: intermediate
    area: nuxt-module
    tags: [real-time]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A visitor has a page open when an editor publishes a change to a component on it, and the component's
      PHP class has `mercure: true` in its `#[ApiResource]`. What does the visitor see?
    why: >-
      If you expect live updates to re-render the page by themselves, you'll think Mercure isn't working: the
      visitor has to click Update.
    options:
      - { id: a, text: 'The component re-renders with the new content at once' }
      - { id: b, text: 'A notice that the content is outdated, with an Update button' }
      - { id: c, text: 'Nothing changes until they reload the page themselves' }
      - { id: d, text: 'The page reloads itself, and keeps their scroll position' }
    answer:
      correct: b
      explanation: >-
        The module stages the update and shows *The content on this page is outdated*. Nothing on the page changes
        until the reader clicks **Update**, which applies the staged resources.
      optionNotes:
        a: Updates are staged on purpose, so content never changes under someone mid-read.
        c: Mercure tells the open page about the change; no reload is needed to apply it.
    sources:
      - { kind: docs, page: /nuxt-module/component-helpers/real-time-updates, anchor: the-visitor-notification, sectionHash: 'sha256:10fd30b86ef2648c', title: 'Real-Time Updates in Components › The Visitor Notification' }
      - { kind: docs, page: /nuxt-module/component-helpers/real-time-updates, anchor: how-it-works, sectionHash: 'sha256:e47cf24048190bf8', title: 'Real-Time Updates in Components › How It Works' }
    author: llm-draft
