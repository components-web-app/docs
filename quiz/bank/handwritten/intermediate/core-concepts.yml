# Hand-written intermediate questions on CWA's core concepts.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: core.dynamic.page-data-title
    version: 3
    status: live
    level: intermediate
    area: core-concepts
    tags: [dynamic-pages]
    type: multiple-choice
    difficulty: 2
    prompt: 'Each blog article is stored as page data: one entry of repeating content, with its own route and a `title`. A visitor opens an article. Where does the page''s HTML `<title>` come from?'
    why: >-
      Leave `title` empty on seeded or imported articles and they fall back to the template page's title, so
      search results show one title for every article.
    options:
      - { id: a, text: The page template's `uiComponent` name }
      - { id: b, text: The layout's `siteName` alone }
      - { id: c, text: The last segment of its route }
      - { id: d, text: The article's own `title` }
    answer:
      correct: d
      explanation: >-
        Page data has `title` and `metaDescription` from `AbstractPageData`. The module uses them for `<title>`
        and `<meta name="description">` with no extra code. An article with no title can fall back to its
        template page's title.
    sources:
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: seo, sectionHash: 'sha256:e9a9218d4322da12', title: 'Dynamic Pages › SEO' }
    author: llm-draft

  - id: core.public.what-is-public
    version: 3
    status: live
    level: intermediate
    area: core-concepts
    tags: [security, routes]
    type: multiple-choice
    difficulty: 3
    prompt: When can a signed-out visitor see a page and the components on it?
    why: >-
      Publishing every component isn't enough. When content you published doesn't show for visitors, check its
      route's visibility first.
    options:
      - { id: a, text: When a live route leads to it }
      - { id: b, text: When all its components are published }
      - { id: c, text: When it has a title and a layout }
      - { id: d, text: When its layout is published }
    answer:
      correct: a
      explanation: >-
        A page is public when a live route leads to it: its own, or one on a page nested beneath it. A page
        nothing routes to is visible only to admins, unless an admin marks it **Public without a route**. Layouts
        aren't published or drafted.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: what-the-public-can-see, sectionHash: 'sha256:fe546c126aad6e0f', title: 'Layouts & Pages › What the Public Can See' }
    author: llm-draft

  - id: core.admin.delete-one-version
    version: 3
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin, draft-and-publish]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A component has a published version and a draft. An editor selects the draft, clicks **Delete** on its
      Info tab and chooses **Delete draft**. What is removed?
    why: >-
      Delete draft is how to throw away unpublished changes without taking the component off the site.
    options:
      - { id: a, text: The draft and the live version together }
      - { id: b, text: Only the draft; the live version stays }
      - { id: c, text: The component and its position }
      - { id: d, text: Nothing until the editor publishes }
    answer:
      correct: b
      explanation: >-
        **Delete draft** discards the unpublished changes, and the live version stays. To remove both, the
        same dialog offers **Delete entire component**.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: deleting-a-component, sectionHash: 'sha256:054c823de925dbab', title: 'The Admin Panel › Deleting a component' }
    author: llm-draft

  - id: core.admin.rename-child-routes
    version: 4
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin, routes]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      In the admin, an editor changes a route's path from `/events` to `/happenings`, ticks **Also change the 3
      child routes that start with /events/** and saves. What happens to child routes such as `/events/2024`?
    why: >-
      Tick it when you restructure a section, so old links and search results for its child pages keep
      landing.
    options:
      - { id: a, text: 'They keep their old paths, and the old URLs stop working' }
      - { id: b, text: 'They are set to **Not live** until an editor reviews each one' }
      - { id: c, text: 'They are deleted, and must be created again by hand' }
      - { id: d, text: 'They move under the new path, with redirects from the old' }
    answer:
      correct: d
      explanation: >-
        Ticking it renames every child path to stay under the new path and creates redirects from the old
        paths. Left unticked, only the parent is renamed.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: editing-a-path, sectionHash: 'sha256:31287e077f84af8e', title: 'The Admin Panel › Editing a path' }
    author: llm-draft

  - id: core.admin.reorder-where
    version: 3
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      An editor wants to drag the components of a component group (a named list of components, such as
      `main`) into a new order on the page. What do they turn on first, and where?
    why: >-
      If an editor asks how to drag components into place, point them to the group's own tab: a component's
      Order tab only moves it one place at a time.
    options:
      - { id: a, text: '**Enable reordering**, in the selected group''s **Group** tab' }
      - { id: b, text: '**Enable reordering**, in the selected component''s **Order** tab' }
      - { id: c, text: 'Nothing: components can be dragged whenever edit mode is on' }
      - { id: d, text: 'A **Reorder** setting on the page in `/_cwa/pages`' }
    answer:
      correct: a
      explanation: >-
        Select the group itself, for example by right-clicking a component in it and choosing the group, and turn
        on **Enable reordering** in its **Group** tab. A component's **Order** tab has a **Position** field with
        **Move up** and **Move down** instead.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: reordering, sectionHash: 'sha256:bedf46c74e5e3c43', title: 'The Admin Panel › Reordering' }
    author: llm-draft

  - id: core.caching.save-refreshes-pages
    version: 2
    status: live
    family: page-tag-purge
    level: intermediate
    area: core-concepts
    tags: [http-caching, page-caching]
    type: multiple-choice
    difficulty: 2
    prompt: An editor saves a component. How do the cached pages that show it get refreshed?
    why: >-
      It's why you don't purge by hand after an edit, and why anything a page renders that isn't CWA data (a
      third-party fetch, the date) needs `pageCache.sharedMaxAge` instead.
    options:
      - { id: a, text: 'Nothing: they wait until their `s-maxage` runs out' }
      - { id: b, text: The next deploy clears every page }
      - { id: c, text: The API purges the cache tag for its IRI }
      - { id: d, text: The browser reloads them every minute }
    answer:
      correct: c
      explanation: >-
        Every cached response and page is tagged with the IRIs (API paths) of the resources in it. Saving a
        resource purges its IRI, so everything that used it is dropped.
    sources:
      - { kind: docs, page: /core-concepts/caching, anchor: purges, sectionHash: 'sha256:e9f0223d0fda49b2', title: 'Caching › Purges' }
    author: llm-draft

  - id: core.caching.editors-get-fresh-pages
    version: 1
    status: live
    level: intermediate
    area: core-concepts
    tags: [http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Why does a signed-in editor never get a cached page?
    why: >-
      When a page looks stale to visitors but fine to you, check it signed out: as an editor you never see
      what the cache holds.
    options:
      - { id: a, text: They browse the site on a separate admin hostname }
      - { id: b, text: Their browser adds `?nocache` to every request }
      - { id: c, text: The whole cache is switched off for everyone while any editor is signed in }
      - { id: d, text: 'Their responses can hold drafts, so they''re marked `private, no-store`' }
    answer:
      correct: d
      explanation: >-
        Drafts and published content share the same URLs, and the API tells them apart by the auth cookie. So
        an editor's responses are never stored, and a cache only holds what anonymous visitors see.
    sources:
      - { kind: docs, page: /core-concepts/caching, anchor: signed-in-editors-never-get-a-cached-page, sectionHash: 'sha256:77665ddad4825fb4', title: 'Caching › Signed-in editors never get a cached page' }
    author: llm-draft

  - id: core.identity.layout-ui-component
    version: 3
    status: live
    level: intermediate
    area: core-concepts
    tags: [layouts-and-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A layout's Vue file is `app/app/cwa/layouts/Landing.vue`. In the API, each layout has a `uiComponent`
      value that says which Vue component displays it. What should that value be for this layout?
    why: >-
      A layout whose `uiComponent` is the short name, such as `Landing`, doesn't resolve, so the page falls
      back to the default layout.
    options:
      - { id: a, text: '`CwaLayoutLanding`' }
      - { id: b, text: '`Landing`' }
      - { id: c, text: '`landing.vue`' }
      - { id: d, text: '`CwaLayoutsLanding`' }
    answer:
      correct: a
      explanation: >-
        The module registers layouts with the `CwaLayout` prefix, and a layout's `uiComponent` holds that full
        name. It is rendered as stored, so `Landing` wouldn't resolve.
    sources:
      - { kind: docs, page: /nuxt-module/building-your-ui/creating-layouts, anchor: how-uicomponent-names-resolve, sectionHash: 'sha256:7cfcf6390a43aa12', title: 'Layouts › How uiComponent Names Resolve' }
    author: llm-draft
