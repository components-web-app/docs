# Hand-written intermediate questions on CWA's core concepts.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: core.dynamic.page-data-title
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [dynamic-pages]
    type: multiple-choice
    difficulty: 2
    prompt: 'A blog article is a page data record: one item of repeating content, with its own route. The record has a `title`. Where does the HTML `<title>` at the article''s route come from?'
    why: >-
      Leave `title` empty on seeded or imported records and they fall back to the template page's title, so
      search results show one title for every article.
    options:
      - { id: a, text: The page template's `uiComponent` name }
      - { id: b, text: The layout's `siteName` alone }
      - { id: c, text: The last segment of its route }
      - { id: d, text: The record's `title` field }
    answer:
      correct: d
      explanation: >-
        Page data has `title` and `metaDescription` from `AbstractPageData`. The module uses them for `<title>`
        and `<meta name="description">` with no extra code. A record with no title can fall back to its
        template page's title.
    sources:
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: seo, sectionHash: 'sha256:e9a9218d4322da12' }
    author: llm-draft

  - id: core.public.what-is-public
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [security, routes]
    type: multiple-choice
    difficulty: 3
    prompt: When can an anonymous visitor see a page record and the components on it?
    why: >-
      Publishing every component isn't enough. When content you published doesn't show for visitors, check its
      route's visibility first.
    options:
      - { id: a, text: When a live route leads to it }
      - { id: b, text: When all its components are published }
      - { id: c, text: When it has a title and a layout }
      - { id: d, text: When its layout is published }
    answer:
      correct: a
      explanation: >-
        A page is public when a live route leads to it: its own, or one on a page nested beneath it. A page
        nothing routes to is visible only to admins, unless an admin marks it **Public without a route**. Layouts
        aren't published or drafted.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: what-the-public-can-see, sectionHash: 'sha256:e97a5369b4be828a' }
    author: llm-draft

  - id: core.admin.delete-one-version
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin, draft-and-publish]
    type: multiple-choice
    difficulty: 3
    prompt: A component has a published version and a draft. An editor selects the draft and clicks **Delete Draft**. What is removed?
    why: >-
      Removing a component completely takes two deletes, so check the other version is gone too before you
      assume it has left the site.
    options:
      - { id: a, text: The draft and the live version together }
      - { id: b, text: Only the draft; the live version stays }
      - { id: c, text: The component and its position }
      - { id: d, text: Nothing until the editor publishes }
    answer:
      correct: b
      explanation: >-
        A delete removes only the selected version. To delete the other one, select it first with the Publish
        tab's **Edit live version** toggle.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: deleting-a-component, sectionHash: 'sha256:c0519cb70cf8ce3e' }
    author: llm-draft

  - id: core.admin.rename-child-routes
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin, routes]
    type: multiple-choice
    difficulty: 3
    prompt: In the admin, an editor changes a parent route's path and confirms **Update child routes?**. What happens to the child routes?
    why: >-
      Confirm it when you restructure a section, so old links and search results for its child pages keep
      landing.
    options:
      - { id: a, text: 'They keep their old paths, and the old URLs stop working' }
      - { id: b, text: 'They are set to **Not live** until an editor reviews each one' }
      - { id: c, text: 'They are deleted, and must be created again by hand' }
      - { id: d, text: 'They move under the new path, with redirects from the old' }
    answer:
      correct: d
      explanation: >-
        Confirming renames every child path to stay under the new parent prefix and creates redirects from the
        old paths. Without it, only the parent is renamed.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: editing-a-path, sectionHash: 'sha256:03e5ff2517176e16' }
    author: llm-draft
