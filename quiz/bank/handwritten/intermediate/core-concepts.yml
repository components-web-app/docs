# Hand-written intermediate questions on CWA's core concepts.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: core.dynamic.page-data-title
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [dynamic-pages]
    type: multiple-choice
    difficulty: 2
    prompt: 'A blog article is a page data record: one item of repeating content, with its own route. The record has a `title`. Where does the HTML `<title>` at the article''s route come from?'
    why: >-
      Leave `title` empty on seeded or imported records and they fall back to the template page's title, so
      search results show one title for every article.
    options:
      - { id: a, text: The page template's `uiComponent` name }
      - { id: b, text: The layout's `siteName` alone }
      - { id: c, text: The last segment of its route }
      - { id: d, text: The record's `title` field }
    answer:
      correct: d
      explanation: >-
        Page data has `title` and `metaDescription` from `AbstractPageData`. The module uses them for `<title>`
        and `<meta name="description">` with no extra code. A record with no title can fall back to its
        template page's title.
    sources:
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: seo, sectionHash: 'sha256:e9a9218d4322da12', title: 'Dynamic Pages › SEO' }
    author: llm-draft

  - id: core.public.what-is-public
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [security, routes]
    type: multiple-choice
    difficulty: 3
    prompt: When can an anonymous visitor see a page record and the components on it?
    why: >-
      Publishing every component isn't enough. When content you published doesn't show for visitors, check its
      route's visibility first.
    options:
      - { id: a, text: When a live route leads to it }
      - { id: b, text: When all its components are published }
      - { id: c, text: When it has a title and a layout }
      - { id: d, text: When its layout is published }
    answer:
      correct: a
      explanation: >-
        A page is public when a live route leads to it: its own, or one on a page nested beneath it. A page
        nothing routes to is visible only to admins, unless an admin marks it **Public without a route**. Layouts
        aren't published or drafted.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: what-the-public-can-see, sectionHash: 'sha256:ea71aea0e2941373', title: 'Layouts & Pages › What the Public Can See' }
    author: llm-draft

  - id: core.admin.delete-one-version
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin, draft-and-publish]
    type: multiple-choice
    difficulty: 3
    prompt: A component has a published version and a draft. An editor selects the draft and clicks **Delete Draft**. What is removed?
    why: >-
      Removing a component completely takes two deletes, so check the other version is gone too before you
      assume it has left the site.
    options:
      - { id: a, text: The draft and the live version together }
      - { id: b, text: Only the draft; the live version stays }
      - { id: c, text: The component and its position }
      - { id: d, text: Nothing until the editor publishes }
    answer:
      correct: b
      explanation: >-
        A delete removes only the selected version. To delete the other one, select it first with the Publish
        tab's **Edit live version** toggle.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: deleting-a-component, sectionHash: 'sha256:34cf8e997729d977', title: 'The Admin Panel › Deleting a component' }
    author: llm-draft

  - id: core.admin.rename-child-routes
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin, routes]
    type: multiple-choice
    difficulty: 3
    prompt: In the admin, an editor changes a parent route's path and confirms **Update child routes?**. What happens to the child routes?
    why: >-
      Confirm it when you restructure a section, so old links and search results for its child pages keep
      landing.
    options:
      - { id: a, text: 'They keep their old paths, and the old URLs stop working' }
      - { id: b, text: 'They are set to **Not live** until an editor reviews each one' }
      - { id: c, text: 'They are deleted, and must be created again by hand' }
      - { id: d, text: 'They move under the new path, with redirects from the old' }
    answer:
      correct: d
      explanation: >-
        Confirming renames every child path to stay under the new parent prefix and creates redirects from the
        old paths. Without it, only the parent is renamed.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: editing-a-path, sectionHash: 'sha256:03e5ff2517176e16', title: 'The Admin Panel › Editing a path' }
    author: llm-draft

  - id: core.admin.reorder-where
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [admin]
    type: multiple-choice
    difficulty: 1
    prompt: >-
      Where does an editor reorder the components in a component group (a named list of components, such as
      `main`)?
    why: >-
      If an editor asks how to drag components into place, point them to the Order tab: there's no drag
      reordering on the page.
    options:
      - { id: a, text: The Order tab in the manager panel }
      - { id: b, text: By dragging the component on the page }
      - { id: c, text: The `/_cwa/pages` admin page }
      - { id: d, text: The page's route settings }
    answer:
      correct: a
      explanation: >-
        Select a component, open the manager panel's **Order** tab and turn on **Enable reordering**. Then use
        **Move Up**, **Move Down** or a position number.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: reordering, sectionHash: 'sha256:fd0ebb9fa7076f40', title: 'The Admin Panel › Reordering' }
    author: llm-draft

  - id: core.caching.save-refreshes-pages
    version: 1
    status: live
    family: page-tag-purge
    level: intermediate
    area: core-concepts
    tags: [http-caching, page-caching]
    type: multiple-choice
    difficulty: 2
    prompt: An editor saves a component. How do the cached pages that show it get refreshed?
    why: >-
      It's why you don't purge by hand after an edit, and why anything a page renders that isn't CWA data (a
      third-party fetch, the date) needs `pageCache.sharedMaxAge` instead.
    options:
      - { id: a, text: 'Nothing: they wait until their `s-maxage` runs out' }
      - { id: b, text: The next deploy clears every page }
      - { id: c, text: The API purges the cache tag for its IRI }
      - { id: d, text: The browser reloads them every minute }
    answer:
      correct: c
      explanation: >-
        Every cached response and page is tagged with the IRIs of the resources in it. Saving a resource
        purges its IRI, so everything that used it is dropped.
    sources:
      - { kind: docs, page: /core-concepts/caching, anchor: purges, sectionHash: 'sha256:c37d1bc5ca595f58', title: 'Caching › Purges' }
    author: llm-draft

  - id: core.caching.editors-get-fresh-pages
    version: 1
    status: live
    level: intermediate
    area: core-concepts
    tags: [http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Why does a signed-in editor never get a cached page?
    why: >-
      When a page looks stale to visitors but fine to you, check it signed out: as an editor you never see
      what the cache holds.
    options:
      - { id: a, text: They browse the site on a separate admin hostname }
      - { id: b, text: Their browser adds `?nocache` to every request }
      - { id: c, text: The whole cache is switched off for everyone while any editor is signed in }
      - { id: d, text: 'Their responses can hold drafts, so they''re marked `private, no-store`' }
    answer:
      correct: d
      explanation: >-
        Drafts and published content share the same URLs, and the API tells them apart by the auth cookie. So
        an editor's responses are never stored, and a cache only holds what anonymous visitors see.
    sources:
      - { kind: docs, page: /core-concepts/caching, anchor: signed-in-editors-never-get-a-cached-page, sectionHash: 'sha256:77665ddad4825fb4', title: 'Caching › Signed-in editors never get a cached page' }
    author: llm-draft

  - id: core.identity.layout-ui-component
    version: 2
    status: live
    level: intermediate
    area: core-concepts
    tags: [layouts-and-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A layout's Vue file is `app/app/cwa/layouts/Landing.vue`. What does the layout record's `uiComponent`
      (the field that names the Vue file a record renders through) hold?
    why: >-
      A layout record that stores the short name, such as `Landing`, doesn't resolve, so the page falls back
      to the default layout.
    options:
      - { id: a, text: '`CwaLayoutLanding`' }
      - { id: b, text: '`Landing`' }
      - { id: c, text: '`landing.vue`' }
      - { id: d, text: '`CwaLayoutsLanding`' }
    answer:
      correct: a
      explanation: >-
        The module registers layouts with the `CwaLayout` prefix, and a layout's `uiComponent` holds that full
        name. It is rendered as stored, so `Landing` wouldn't resolve.
    sources:
      - { kind: docs, page: /nuxt-module/building-your-ui/creating-layouts, anchor: how-uicomponent-names-resolve, sectionHash: 'sha256:5dc45450ae61e9df', title: 'Layouts › How uiComponent Names Resolve' }
    author: llm-draft
