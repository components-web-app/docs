# Hand-written intermediate questions on installing and running the template.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: deploy.install.fixtures-append
    version: 3
    status: live
    level: intermediate
    area: deployment
    tags: [fixtures]
    type: multiple-choice
    difficulty: 2
    family: fixtures-load-append
    prompt: >-
      `bin/up` loads the fixtures (the code that seeds the admin account and sample content) with
      `doctrine:fixtures:load --append`. What does `--append` do?
    why: >-
      It's what makes rerunning the load safe on a database you've been editing, though it still resets the
      admin's password to `admin`.
    options:
      - { id: a, text: It keeps existing data and creates what's missing }
      - { id: b, text: It adds the admin pages to the Nuxt app }
      - { id: c, text: It skips the admin account if one exists }
      - { id: d, text: 'It loads the fixtures in parallel, so it''s faster' }
    answer:
      correct: a
      explanation: >-
        Without `--append`, `doctrine:fixtures:load` empties the database first. With it, the load is safe to
        run again. It still resets the admin's password and email to `ADMIN_PASSWORD` and `ADMIN_EMAIL`.
      optionNotes:
        c: It creates the admin account, and resets its password each time it runs.
    sources:
      - { kind: docs, page: /getting-started/installation, anchor: _2-let-binup-start-the-site, sectionHash: 'sha256:3eba2ff39071bf66', title: 'Installation › 2. Let bin/up start the site' }
      - { kind: docs, page: /api/data-fixtures/getting-started, anchor: setup, sectionHash: 'sha256:d72eb07e3bf318e2', title: 'Getting Started with Fixtures › Setup' }
    author: llm-draft

  - id: deploy.install.certificate-warning
    version: 2
    status: live
    level: intermediate
    area: deployment
    tags: [architecture]
    type: multiple-choice
    difficulty: 2
    prompt: Your browser warns about the certificate when you open `https://localhost`. Why?
    why: >-
      The warning is expected on a local stack, so you can proceed past it rather than hunt for a fault.
    options:
      - { id: a, text: 'The stack makes its own self-signed certificate' }
      - { id: b, text: 'Let''s Encrypt can''t issue one for `localhost`' }
      - { id: c, text: 'The certificate is for `php.local`, not `localhost`' }
      - { id: d, text: 'The `app` container serves plain HTTP on port 443' }
    answer:
      correct: a
      explanation: >-
        Caddy signs `https://localhost` with its own local certificate, so the browser warns. Proceed past it.
        The certificate is kept in the `caddy_data` volume: `docker compose down -v` makes a new one, and the
        browser asks again.
    sources:
      - { kind: docs, page: /getting-started/installation, anchor: _3-open-the-site, sectionHash: 'sha256:31450e46c7106927', title: 'Installation › 3. Open the site' }
    author: llm-draft
