  - id: core.dynamic.three-records
    version: 1
    status: live
    family: dynamic-pages-records-needed
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, data-model]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      You're building news articles. Each has its own path and its own content, and a change to the structure
      should reach every article at once. Which records does CWA use for that?
    options:
      - { id: a, text: 'One page per article, each with its own route and its own components' }
      - { id: b, text: 'One page with one route, and a query parameter that picks the article' }
      - { id: c, text: 'One layout per article, and one page with a route for the whole list' }
      - { id: d, text: 'A template page, a page data record for each article, and a route for each' }
    answer:
      correct: d
      explanation: >-
        A template page (a page record many articles share) holds the structure. Each article is a page data
        record that names the template page, and each has its own route.
    sources:
      - { kind: docs, page: /guides/your-first-dynamic-page, anchor: create-in-the-api, sectionHash: 'sha256:baa52a543c4cb510' }
    author: llm-draft

  - id: core.dynamic.position-shows
    version: 1
    status: live
    # The glossary question on "dynamic component position" tests the same fact.
    family: term:2a7460
    level: beginner
    area: core-concepts
    tags: [dynamic-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      The news template page's `main` component group has a component position (the record that places a
      component in a group) bound to the articles' `quote` field. A visitor opens one article. What does that
      position show?
    options:
      - { id: a, text: The component held in this article's `quote` field }
      - { id: b, text: 'The newest article''s quote, on every article' }
      - { id: c, text: The quote an editor placed on the template page }
      - { id: d, text: 'Every article''s quote, as a list' }
    answer:
      correct: a
      explanation: >-
        It's a dynamic component position. Instead of holding one component, it shows whatever component the
        current article holds in its `quote` field.
    sources:
      - { kind: docs, page: /guides/your-first-dynamic-page, anchor: create-in-the-api, sectionHash: 'sha256:baa52a543c4cb510' }
    author: llm-draft

  - id: core.dynamic.new-file
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      You add news articles that render through the `TwoColumnPageTemplate.vue` page template you already
      built. Which new file do you write?
    options:
      - { id: a, text: 'A new page template Vue file for articles' }
      - { id: b, text: 'A PHP entity for the articles'' data' }
      - { id: c, text: 'A new layout Vue file for articles' }
      - { id: d, text: 'A Nuxt route file at `app/app/pages/news/[slug].vue`' }
    answer:
      correct: b
      explanation: >-
        The Vue file already exists: articles render through `TwoColumnPageTemplate.vue`. The new file is the PHP
        entity, `NewsArticleData`, that holds each article's data.
    sources:
      - { kind: docs, page: /guides/your-first-dynamic-page, anchor: the-file, sectionHash: 'sha256:933d9dcc30d23d71' }
    author: llm-draft

  - id: core.dynamic.component-field-type
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, components]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      Each news article's page data entity has a `quote` field, shown by the template page. How must that field
      be typed?
    options:
      - { id: a, text: 'As a string holding the quote''s text' }
      - { id: b, text: 'As the IRI of a component position' }
      - { id: c, text: 'As a component class, such as `Quote`' }
      - { id: d, text: 'As JSON copied from a component' }
    answer:
      correct: c
      explanation: >-
        The field holds the component each article shows, so it must be typed as a component class. In the guide
        it's a `ManyToOne` to `Quote`.
    sources:
      - { kind: docs, page: /guides/your-first-dynamic-page, anchor: the-file, sectionHash: 'sha256:933d9dcc30d23d71' }
    author: llm-draft

  - id: core.dynamic.quote-per-article
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, admin]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      On `/news/first-article`, an editor selects the dynamic position and adds a Quote from its **Data
      Placeholder** tab. Which articles show that Quote?
    options:
      - { id: a, text: 'Every article that uses the same template page' }
      - { id: b, text: 'Only this article; the next article gets its own' }
      - { id: c, text: 'Every article, until each is given its own Quote' }
      - { id: d, text: 'None until the template page is published' }
    answer:
      correct: b
      explanation: >-
        The Quote is stored in this article's `quote` field, so it belongs to this article. The next article you
        create gets its own.
    sources:
      - { kind: docs, page: /guides/your-first-dynamic-page, anchor: via-the-admin, sectionHash: 'sha256:c41dcc6bcd14fe43' }
    author: llm-draft

  - id: core.dynamic.page-data-fixture
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, fixtures]
    type: pick-the-line
    difficulty: 2
    prompt: Which line saves the article with its own route and names the template page it renders through?
    code:
      lang: php
      text: |-
        public function build(CwaFixtureBuilder $cwa, ScaffoldState $state): void
        {
            // ... the landing layout and page from the earlier guides

            $cwa->page('news-template', 'TwoColumnPageTemplate', layout: 'landing', isTemplate: true)
                ->group('main')->pageDataPosition(NewsArticleData::class, 'quote');

            $quote = new Quote();
            $quote->text = 'News is what somebody does not want you to print.';
            $cwa->publish($quote);

            $article = new NewsArticleData();
            $article->setTitle('First article')
                ->setMetaDescription('The first news article.');
            $article->quote = $quote;

            $cwa->pageData($article, template: 'news-template', route: '/news/first-article');
        }
    answer:
      lines: [17]
      explanation: >-
        `pageData()` saves the page data record with its route, and `template:` takes the template page's
        reference, `news-template`.
    sources:
      - { kind: docs, page: /guides/your-first-dynamic-page, anchor: via-fixtures, sectionHash: 'sha256:15ec0a7f9e44973c', block: 0, blockHash: 'sha256:63ed8fac2fd9414d' }
    author: llm-draft

  - id: deploy.install.not-automatic
    version: 1
    status: live
    level: beginner
    area: deployment
    tags: [fixtures, architecture]
    type: multiple-choice
    difficulty: 2
    prompt: The template's containers do several setup steps each time they start. Which step do you always run yourself?
    options:
      - { id: a, text: Running pending database migrations }
      - { id: b, text: Installing the Nuxt dependencies }
      - { id: c, text: Starting the Nuxt dev server }
      - { id: d, text: Loading the fixtures }
    answer:
      correct: d
      explanation: >-
        The `php` container runs migrations, and the `app` container installs the Nuxt dependencies and starts
        the dev server. Fixtures are the exception: they're never loaded automatically.
    sources:
      - { kind: docs, page: /getting-started/installation, anchor: what-docker-handles-automatically, sectionHash: 'sha256:fbbab0c06ccfb985' }
    author: llm-draft

  - id: nuxt.page.choose-page-ui
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [layouts-and-pages, admin]
    type: multiple-choice
    difficulty: 1
    prompt: >-
      An editor creates a page in `/_cwa/pages` and picks **Two Column Page** as its **Page UI**. What have they
      chosen?
    options:
      - { id: a, text: 'The layout that wraps the page, with its header' }
      - { id: b, text: The page template the page renders through }
      - { id: c, text: The first component in the page's `main` group }
      - { id: d, text: The template page whose components it shares }
    answer:
      correct: b
      explanation: >-
        The Page UI is the page template, such as `TwoColumnPageTemplate.vue`. The page record stores it as
        `uiComponent: CwaPageTwoColumnPageTemplate`. The layout is a separate choice on the same form.
    sources:
      - { kind: docs, page: /guides/your-first-page-template, anchor: via-the-admin, sectionHash: 'sha256:7a86817c667e2a07' }
    author: llm-draft
