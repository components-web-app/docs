  - id: nuxt.component.ui-vs-styles
    version: 1
    status: live
    level: beginner
    area: nuxt-module
    tags: [components]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A component needs two looks. One is the same HTML with a different background colour. Which approach
      fits that look?
    options:
      - { id: a, text: 'A `ui/` template with a copy of the markup' }
      - { id: b, text: 'A style in the component''s `styles.classes`' }
      - { id: c, text: 'A second component type with the same fields' }
      - { id: d, text: 'A `v-if` on a field editors type the colour into' }
    answer:
      correct: b
      explanation: >-
        Use `styles.classes` when it's the same HTML with different classes. A `ui/` template is for a variant
        that needs different HTML structure.
    sources:
      - { kind: docs, page: /guides/alternative-ui-variants, anchor: when-to-use-ui-vs-stylesclasses, sectionHash: 'sha256:c387c50693891cdd' }
    author: llm-draft

  - id: nuxt.component.ui-registration
    version: 1
    status: live
    level: beginner
    area: nuxt-module
    tags: [components, module-setup]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      You've written `app/app/cwa/components/NavigationLink/ui/YouTube.vue`. What else must you do before
      editors can pick it?
    options:
      - { id: a, text: 'Add it under the component in `nuxt.config`' }
      - { id: b, text: 'Add a `YouTube` option to the PHP entity' }
      - { id: c, text: 'Nothing: the module finds it by its location' }
      - { id: d, text: 'Run `npx cwa make:component` for the variant' }
    answer:
      correct: c
      explanation: >-
        The module discovers `ui/YouTube.vue` from where it is and registers it as the `YouTube` variant. When an
        editor selects it, it renders instead of `NavigationLink.vue`.
    sources:
      - { kind: docs, page: /guides/alternative-ui-variants, anchor: the-ui-file, sectionHash: 'sha256:97d0c4346cea8201' }
    author: llm-draft

