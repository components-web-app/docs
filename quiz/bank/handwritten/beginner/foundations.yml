# Hand-written beginner questions on CWA's foundations: the API-first architecture, the data model chain,
# layouts and pages, dynamic pages, components, and draft and publish.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: core.routes.new-page-url
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [architecture, routes]
    type: multiple-choice
    difficulty: 1
    prompt: An editor wants a new page at `/contact`. What gives the site that URL?
    why: >-
      Because the API owns the routes, editors add and move pages without a developer or a deploy.
    options:
      - { id: a, text: A route record in the API that points to the page }
      - { id: b, text: A `contact.vue` file in the Nuxt app's pages folder }
      - { id: c, text: A new entry in the Nuxt router config }
      - { id: d, text: A redirect rule in the web server }
    answer:
      correct: a
      explanation: >-
        Routes are owned by the API, not defined in Vue files. A route record maps the path `/contact` to a
        page, and the module looks it up when a visitor opens that path.
      optionNotes:
        b: CWA's Vue files are layouts, page templates and components. None of them sets a URL.
    sources:
      - { kind: docs, page: /core-concepts/architecture, anchor: what-you-never-write, sectionHash: 'sha256:1b43f41f0f1125b5', title: 'How It All Works › What You Never Write' }
      - { kind: docs, page: /core-concepts/the-data-model, anchor: route, sectionHash: 'sha256:48c85cc1328f40b5', title: 'The Data Model › Route' }
    author: llm-draft

  - id: core.architecture.renders-api-structure
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [architecture]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      Your site already has a Quote component type. An editor adds a Quote to the About page in the admin.
      What must a developer change in the Nuxt app for it to show?
    why: >-
      This is the core of CWA's API-first design: the API describes each page's structure, and the front end
      renders whatever it is given.
    options:
      - { id: a, text: Import the Quote component in the About page's Vue file }
      - { id: b, text: Add the Quote to a list of components for that URL }
      - { id: c, text: Nothing; the front end renders what the API describes }
      - { id: d, text: Rebuild and redeploy the Nuxt app }
    answer:
      correct: c
      explanation: >-
        The content structure is managed through the API, and the front end renders whatever structure the
        API describes. The module fetches the page's components and renders each one with its Vue file.
    sources:
      - { kind: docs, page: /core-concepts/architecture, anchor: the-request-lifecycle, sectionHash: 'sha256:733ab70568b630bf', title: 'How It All Works › The Request Lifecycle' }
    author: llm-draft

  - id: core.architecture.three-layers
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [architecture]
    type: multiple-choice
    difficulty: 1
    prompt: Which three parts make up CWA?
    options:
      - { id: a, text: 'A WordPress plugin, a theme and a page builder' }
      - { id: b, text: 'A Symfony API bundle, a Nuxt module and a template app' }
      - { id: c, text: 'A Nuxt module, a hosted CMS and a CDN' }
      - { id: d, text: 'A Laravel package, a React app and a database' }
    answer:
      correct: b
      explanation: >-
        The API bundle (Symfony and API Platform) stores the content, the Nuxt module renders it and
        provides the admin, and the template app wires the two together as a starter project.
    sources:
      - { kind: docs, page: /core-concepts/architecture, anchor: the-three-layers, sectionHash: 'sha256:dca53d81c9b29087', title: 'How It All Works › The Three Layers' }
    author: llm-draft

  - id: core.architecture.api-you-write
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [architecture, data-model]
    type: multiple-choice
    difficulty: 2
    prompt: On the API side of a CWA project, which PHP classes do you write yourself?
    options:
      - { id: a, text: The route and layout classes }
      - { id: b, text: The page and component group classes }
      - { id: c, text: The REST controllers for each type }
      - { id: d, text: Your component and page data classes }
    answer:
      correct: d
      explanation: >-
        The bundle comes with the content data model, the REST endpoints, auth and a user system. You write
        the classes for your own components and your page data (the content behind dynamic pages, such as
        one blog article each).
    sources:
      - { kind: docs, page: /core-concepts/architecture, anchor: the-api-bundle, sectionHash: 'sha256:809b38805c40261f', title: 'How It All Works › The API Bundle' }
    author: llm-draft

  - id: core.request.page-names
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [architecture, layouts-and-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A visitor opens a URL, and its route points to a page. The page names two things that decide which Vue
      files display it. What are they?
    options:
      - { id: a, text: Its layout and its page template }
      - { id: b, text: Its route and its component positions }
      - { id: c, text: Its layout and its first component }
      - { id: d, text: Its parent page and its template page }
    answer:
      correct: a
      explanation: >-
        The page names its layout (such as `CwaLayoutPrimary`) and its page template (such as
        `CwaPagePrimaryPageTemplate`). The layout renders first, and the page template renders inside it.
    sources:
      - { kind: docs, page: /core-concepts/architecture, anchor: the-request-lifecycle, sectionHash: 'sha256:733ab70568b630bf', title: 'How It All Works › The Request Lifecycle' }
    author: llm-draft

  - id: core.request.concurrent-fetch
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [architecture]
    type: multiple-choice
    difficulty: 3
    prompt: How does the module load a page's layout, page and components from the API?
    options:
      - { id: a, text: 'One at a time, each waiting for the one before it' }
      - { id: b, text: 'In one request that returns the whole page as HTML' }
      - { id: c, text: 'Concurrently, updating its store as each one arrives' }
      - { id: d, text: 'Only the page on the server; the rest in the browser' }
    answer:
      correct: c
      explanation: >-
        Everything is fetched at the same time, helped by a manifest from the API that lists everything the
        page needs. The module's Pinia store updates reactively as the data arrives.
    sources:
      - { kind: docs, page: /core-concepts/architecture, anchor: the-request-lifecycle, sectionHash: 'sha256:733ab70568b630bf', title: 'How It All Works › The Request Lifecycle' }
    author: llm-draft

  - id: core.data-model.chain-order
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [data-model]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      On a static page, the API links the URL to each piece of content through a chain. What is the order?
      (A component group is a named list of components, such as `main`. A component position places one
      component in it.)
    options:
      - { id: a, text: 'Route → component group → page → component → component position' }
      - { id: b, text: 'Page → route → component position → component group → component' }
      - { id: c, text: 'Route → page → component group → component position → component' }
      - { id: d, text: 'Layout → route → component → component position → component group' }
    answer:
      correct: c
      explanation: >-
        The route points to the page, the page has component groups, each group holds component positions,
        and each position holds one component. The page also names its layout, which has groups of its own.
    sources:
      - { kind: docs, page: /core-concepts/the-data-model, anchor: the-resource-chain, sectionHash: 'sha256:023f6eb636d90d06', title: 'The Data Model › The Resource Chain' }
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: pages, sectionHash: 'sha256:9301abbda6ad87a7', title: 'Layouts & Pages › Pages' }
    author: llm-draft

  - id: core.data-model.position-holds
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [data-model]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A component position places a component in a component group (a named list of components, such as
      `main`). What can one position hold?
    options:
      - { id: a, text: 'Any number of components, in their order' }
      - { id: b, text: 'One component, or a binding to a page data field' }
      - { id: c, text: One component group and all its components }
      - { id: d, text: A route and the page that it points to }
    answer:
      correct: b
      explanation: >-
        A position holds exactly one component, or a binding to a property of page data, such as an
        article's `htmlContent`. The group's order comes from its positions.
      optionNotes:
        a: A group holds many components, through one position each.
    sources:
      - { kind: docs, page: /core-concepts/the-data-model, anchor: componentposition, sectionHash: 'sha256:63c138701ce85700', title: 'The Data Model › ComponentPosition' }
    author: llm-draft

  - id: core.layouts.shared-navigation
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [layouts-and-pages, data-model]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      Every page that uses the Primary layout should show the same navigation links, edited in one place.
      What should the component group (the named list of components) that holds them belong to?
    options:
      - { id: a, text: Each page that uses the layout }
      - { id: b, text: The home page's route }
      - { id: c, text: A template page shared by every page }
      - { id: d, text: The layout }
    answer:
      correct: d
      explanation: >-
        A layout can own component groups, and the most common is one for the navigation bar. Every page
        rendered in that layout shows the same group.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: componentgroups-in-layouts, sectionHash: 'sha256:b111d5044c5c0739', title: 'Layouts & Pages › ComponentGroups in Layouts' }
    author: llm-draft

  - id: core.components.child-group
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [components, data-model]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      An Accordion component should hold its own list of child components that editors add to. How do you
      build that?
    options:
      - { id: a, text: Add a list of child component IDs to the Accordion's PHP class }
      - { id: b, text: Give the Accordion its own page and route }
      - { id: c, text: Declare a `<CwaComponentGroup>` in the Accordion's Vue file }
      - { id: d, text: 'Put the children in the page''s group, straight after the Accordion' }
    answer:
      correct: c
      explanation: >-
        A component group can belong to a layout, a page or a component. For a parent with children, the
        parent component's Vue file declares a `<CwaComponentGroup>`, and editors add the children to it.
    sources:
      - { kind: docs, page: /core-concepts/components, anchor: component-patterns, sectionHash: 'sha256:d7524195850c0529', title: 'Components › Component Patterns' }
      - { kind: docs, page: /core-concepts/the-data-model, anchor: componentgroup, sectionHash: 'sha256:2d82038914cdd316', title: 'The Data Model › ComponentGroup' }
    author: llm-draft

  - id: core.dynamic.page-data-fields
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, data-model]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      Each blog article is saved as page data: one item of repeating content, with its own URL. Every
      article needs its own headline. Where do you add the `headline` property?
    options:
      - { id: a, text: On the page data class }
      - { id: b, text: On the template page that every article shares }
      - { id: c, text: On each article's route }
      - { id: d, text: On the article's layout }
    answer:
      correct: a
      explanation: >-
        A page data class extends `AbstractPageData`, and your custom fields, such as a headline, body or
        image, live there. The template page holds the shared structure.
    sources:
      - { kind: docs, page: /core-concepts/the-data-model, anchor: pagedata, sectionHash: 'sha256:25ea3618f08187fa', title: 'The Data Model › PageData' }
    author: llm-draft

  - id: core.dynamic.page-field
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, data-model]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A visitor opens a blog article. Its route points to the article's page data (one item of repeating
      content). How does CWA know which template page to display it with?
    options:
      - { id: a, text: From the first part of the route's path }
      - { id: b, text: From the page data's `page` property }
      - { id: c, text: From the page data's `title` property }
      - { id: d, text: From a setting on the layout }
    answer:
      correct: b
      explanation: >-
        Page data has a `page` property that names the template page to use, such as
        `blog-template`. Every article that names it shares that one page structure.
    sources:
      - { kind: docs, page: /core-concepts/the-data-model, anchor: pagedata, sectionHash: 'sha256:25ea3618f08187fa', title: 'The Data Model › PageData' }
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: how-it-works, sectionHash: 'sha256:84e223903937ce11', title: 'Dynamic Pages › How It Works' }
    author: llm-draft

  - id: core.layouts.second-layout
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [layouts-and-pages]
    type: multiple-choice
    difficulty: 1
    prompt: >-
      Your landing pages need a stripped-down look, without the full header and footer. The rest of the site
      keeps the Primary layout. What do you do?
    options:
      - { id: a, text: Hide the header with CSS on each landing page }
      - { id: b, text: Build the landing pages outside CWA }
      - { id: c, text: 'Write a second layout, and pick it for those pages' }
      - { id: d, text: Add an `if` for landing page paths to the Primary layout }
    answer:
      correct: c
      explanation: >-
        A site can have several layouts, each a Vue file in `app/app/cwa/layouts/`. Each page uses one, and
        editors choose it in the admin.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: multiple-layouts, sectionHash: 'sha256:99897e1f7424c1e0', title: 'Layouts & Pages › Multiple Layouts' }
    author: llm-draft

  - id: core.pages.static-page
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [layouts-and-pages]
    type: multiple-choice
    difficulty: 1
    prompt: >-
      A Contact page has a fixed URL, and editors manage its content by hand. What kind of page is it in CWA?
    options:
      - { id: a, text: A static page }
      - { id: b, text: A template page }
      - { id: c, text: A page data item }
      - { id: d, text: A layout }
    answer:
      correct: a
      explanation: >-
        A static page is one URL mapped to one page, with its own component groups. It suits a home, about or
        contact page. Template pages and page data are for repeating content, such as blog articles.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: static-pages, sectionHash: 'sha256:ba9f9423b9af7075', title: 'Layouts & Pages › Static Pages' }
    author: llm-draft

  - id: core.dynamic.article-routes
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, routes]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      Blog articles are saved as page data, one per article, and they share one template page. Visitors
      open each article at its own path, such as `/blog/my-first-post`. What has a route?
    options:
      - { id: a, text: 'Only the template page; the articles share its route' }
      - { id: b, text: 'Each article''s page data, not the template page' }
      - { id: c, text: 'The template page and the layout, one each' }
      - { id: d, text: 'Each component on the article' }
    answer:
      correct: b
      explanation: >-
        A template page has no URL of its own. Each article's page data has its own route, and is displayed
        with the shared template page.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: template-pages-istemplate-true, sectionHash: 'sha256:aa5e8d6598a23a66', title: 'Layouts & Pages › Template Pages (isTemplate: true)' }
    author: llm-draft

  - id: core.dynamic.blog-records
    version: 2
    status: live
    family: dynamic-pages-records-needed
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, data-model]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      An editor wants 50 blog articles. Each should have its own URL and content, and every article should
      share one layout and one page structure. What do you create?
    why: >-
      Without page data you would build and maintain 50 separate pages; with it, a change to the template
      page changes every article at once.
    options:
      - { id: a, text: '50 static pages, each copied from the first one' }
      - { id: b, text: '50 layouts, each with one component group in it' }
      - { id: c, text: 'One template page, and page data for each article' }
      - { id: d, text: 'One page with 50 components, one per article' }
    answer:
      correct: c
      explanation: >-
        One template page (a page saved with `isTemplate: true`) names the layout and page template and holds
        the component groups. Each article is saved as page data, with its own route and properties.
    sources:
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: the-problem, sectionHash: 'sha256:f0023694490ba751', title: 'Dynamic Pages › The Problem' }
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: template-pages-istemplate-true, sectionHash: 'sha256:aa5e8d6598a23a66', title: 'Layouts & Pages › Template Pages (isTemplate: true)' }
    author: llm-draft

  - id: core.pages.shared-page-template
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [layouts-and-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      The About and Team pages should share one two-column structure, but each shows its own components.
      How does CWA expect you to set that up?
    options:
      - { id: a, text: 'Two page template Vue files, one for each page' }
      - { id: b, text: 'One page template Vue file, used by both pages' }
      - { id: c, text: 'One page, with two routes pointing to it' }
      - { id: d, text: 'One layout that contains both pages'' components' }
    answer:
      correct: b
      explanation: >-
        A page template is the Vue file that displays a page, and many pages can use the same one. Each page
        keeps its own components in the groups the page template places.
    sources:
      - { kind: docs, page: /getting-started/key-ideas, anchor: what-a-page-is-made-of, sectionHash: 'sha256:a44954d296b13c59', title: 'Key Ideas › What a page is made of' }
    author: llm-draft

  - id: core.dynamic.bound-position
    version: 2
    status: live
    family: term:2a7460
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, data-model]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      On the blog's template page, one component position is bound to the page data property `htmlContent`.
      (A position places one component in a group.) What does that position show on each article?
    options:
      - { id: a, text: 'The `HtmlContent` component saved on that article' }
      - { id: b, text: 'The same `HtmlContent` component on every article' }
      - { id: c, text: 'The article''s `htmlContent` text, without a component' }
      - { id: d, text: 'Nothing until an editor adds a component to it' }
    answer:
      correct: a
      explanation: >-
        A bound position shows the component saved in that property of the article being viewed, so each
        article shows its own `HtmlContent` component in that position.
    sources:
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: linking-a-page-data-field-to-a-component-position, sectionHash: 'sha256:f256699eb9c03426', title: 'Dynamic Pages › Linking a Page Data Field to a Component Position' }
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: how-it-works, sectionHash: 'sha256:84e223903937ce11', title: 'Dynamic Pages › How It Works' }
    author: llm-draft

  - id: core.draft.why-drafts
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [draft-and-publish]
    type: multiple-choice
    difficulty: 1
    prompt: What problem do draft and published versions of a component solve?
    options:
      - { id: a, text: They keep a history of every past version }
      - { id: b, text: Visitors never see an edit that is half done }
      - { id: c, text: Two editors can't change one component at once }
      - { id: d, text: Pages load faster for anonymous visitors }
    answer:
      correct: b
      explanation: >-
        Without drafts, every edit would show to visitors at once, so a half-rewritten section would go out in
        a broken state. Editors change the draft, and nothing goes live until they publish.
    sources:
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: the-problem-it-solves, sectionHash: 'sha256:a51fdd62f291c06f', title: 'Draft & Publish Workflow › The Problem It Solves' }
    author: llm-draft

  - id: core.draft.edit-mode-off
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [draft-and-publish, admin]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      An editor is signed in with publish rights, but hasn't turned on edit mode. Which version of a
      publishable component does the API give them?
    options:
      - { id: a, text: 'The published version, until they click **Edit**' }
      - { id: b, text: 'Both versions, for the page to pick from' }
      - { id: c, text: 'The draft, as on every page view' }
      - { id: d, text: 'The published version, unless they add `?draft=true`' }
    answer:
      correct: c
      explanation: >-
        The API decides from the auth cookie and the user's role, not from edit mode, so an editor sees drafts
        on every page view. Adding `?published=true` to a request forces the published version.
    sources:
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: how-it-works, sectionHash: 'sha256:6c755a839217faca', title: 'Draft & Publish Workflow › How It Works' }
    author: llm-draft

  - id: core.draft.new-component
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [draft-and-publish]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      An editor adds a new publishable component to a component group (a named list of components, such as
      `main`) and hasn't published it yet. What do anonymous visitors see?
    options:
      - { id: a, text: 'An empty placeholder where the component will go' }
      - { id: b, text: 'The new component, because adding it is immediate' }
      - { id: c, text: 'The new component, empty until it is filled in' }
      - { id: d, text: 'Nothing new: the component is a draft until published' }
    answer:
      correct: d
      explanation: >-
        Adding a component creates its component position at once, but the component starts as a draft, so
        visitors don't see it. Publishing the component makes it visible.
    sources:
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: adding-removing-and-reordering-are-immediate, sectionHash: 'sha256:177d97708ef53e97', title: 'Draft & Publish Workflow › Adding, Removing and Reordering Are Immediate' }
    author: llm-draft

  - id: core.draft.whole-page
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [draft-and-publish, routes]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      An editor is building a whole new page that should stay hidden until launch day. What holds the page
      back?
    options:
      - { id: a, text: 'Leaving every component on it as a draft' }
      - { id: b, text: 'Leaving the page itself unpublished' }
      - { id: c, text: 'Its route''s go-live date, set to the launch' }
      - { id: d, text: 'Leaving the page out of the navigation group' }
    answer:
      correct: c
      explanation: >-
        Draft and publish work per component. A whole page is held back by its route, which can be Live,
        Scheduled or Not live. Until it's live, visitors get a 404 while admins can still preview and edit it.
    sources:
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: scheduling-a-whole-page, sectionHash: 'sha256:9f24518865adfd32', title: 'Draft & Publish Workflow › Scheduling a Whole Page' }
    author: llm-draft

  - id: core.draft.scheduled-component
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [draft-and-publish, admin]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      An editor has changed the draft of one component. The change should go live on Monday at 9am, without
      anyone in the admin at that time. What do they do?
    options:
      - { id: a, text: 'Schedule the draft from its **Publish** tab' }
      - { id: b, text: 'Set a go-live date on the page''s route' }
      - { id: c, text: 'Click **Publish** on Monday at 9am' }
      - { id: d, text: 'Copy the component and delete the old one then' }
    answer:
      correct: a
      explanation: >-
        The draft's `publishedAt` is set to a future time from the **Publish** tab, and the draft replaces the
        live version at that time.
      optionNotes:
        b: A route's go-live date holds back the whole page, not one component's change.
    sources:
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: how-it-works, sectionHash: 'sha256:6c755a839217faca', title: 'Draft & Publish Workflow › How It Works' }
      - { kind: docs, page: /core-concepts/admin-panel, anchor: scheduling-a-publish, sectionHash: 'sha256:79ac25c3cf21d520', title: 'The Admin Panel › Scheduling a Publish' }
    author: llm-draft

  - id: core.draft.publish-promotes
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [draft-and-publish]
    type: multiple-choice
    difficulty: 2
    prompt: An editor clicks **Publish** on a component's draft. What happens to the two versions?
    options:
      - { id: a, text: 'The draft is deleted, and the published version stays' }
      - { id: b, text: 'The draft becomes the published version visitors see' }
      - { id: c, text: 'Both are kept, and visitors pick one' }
      - { id: d, text: 'The published version is copied over the draft' }
    answer:
      correct: b
      explanation: >-
        Publishing promotes the draft to the published version, which the live site shows. Mercure then tells
        open browsers about the change.
    sources:
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: how-it-works, sectionHash: 'sha256:6c755a839217faca', title: 'Draft & Publish Workflow › How It Works' }
    author: llm-draft

  - id: core.admin.manager-panel
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [admin, components]
    type: multiple-choice
    difficulty: 1
    prompt: In edit mode, an editor clicks a component on the page. Where do the forms for its fields appear?
    options:
      - { id: a, text: 'On a separate admin page under `/_cwa`' }
      - { id: b, text: 'In a pop-up window over the component' }
      - { id: c, text: 'In the admin bar at the top of the page' }
      - { id: d, text: 'In the manager panel at the bottom' }
    answer:
      correct: d
      explanation: >-
        Clicking a component selects it and opens the manager panel. Its tabs are the component type's admin
        tabs, so content is edited on the page itself.
    sources:
      - { kind: docs, page: /core-concepts/admin-panel, anchor: edit-mode, sectionHash: 'sha256:059f18d921a3de8a', title: 'The Admin Panel › Edit Mode' }
      - { kind: docs, page: /getting-started/key-ideas, anchor: editing, sectionHash: 'sha256:56ff4c5739a87e28', title: 'Key Ideas › Editing' }
    author: llm-draft

  - id: core.data-model.positions-created
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [data-model, admin]
    type: multiple-choice
    difficulty: 1
    prompt: >-
      A component position places one component in a component group. Who usually creates positions?
    options:
      - { id: a, text: 'You, in each page template''s Vue file' }
      - { id: b, text: 'The admin, when an editor adds a component' }
      - { id: c, text: 'You, in a PHP class for each position' }
      - { id: d, text: 'The module, on every page view' }
    answer:
      correct: b
      explanation: >-
        You rarely deal with positions directly. The admin creates one when an editor adds a component to a
        group.
    sources:
      - { kind: docs, page: /getting-started/key-ideas, anchor: what-a-page-is-made-of, sectionHash: 'sha256:a44954d296b13c59', title: 'Key Ideas › What a page is made of' }
    author: llm-draft

  - id: core.pages.template-page-renders
    version: 2
    status: live
    family: page-template-vs-template-page
    level: beginner
    area: core-concepts
    tags: [layouts-and-pages, dynamic-pages]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A template page is a page saved with `isTemplate: true`, which many blog articles share. Where does
      its HTML come from?
    options:
      - { id: a, text: 'From a page template Vue file, like any other page' }
      - { id: b, text: 'From the page data class, which renders its own HTML' }
      - { id: c, text: 'From the layout alone; template pages have no Vue file' }
      - { id: d, text: 'From a special Vue file for template pages only' }
    answer:
      correct: a
      explanation: >-
        A template page is displayed by a page template like any other page, such as
        `PrimaryPageTemplate.vue`. What makes it a template page is that many page data items share it.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: template-pages-istemplate-true, sectionHash: 'sha256:aa5e8d6598a23a66', title: 'Layouts & Pages › Template Pages (isTemplate: true)' }
    author: llm-draft

  - id: core.data-model.group-reference
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [data-model, layouts-and-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A page template (the Vue file that displays a page) declares
      `<CwaComponentGroup reference="hero" :location="iri" />`. What is `hero`?
    why: >-
      The reference is how code and stored content meet, so renaming it in code leaves the old group, and its
      components, attached to the page but no longer shown.
    options:
      - { id: a, text: 'The CSS class the group renders with' }
      - { id: b, text: 'The component type allowed in the group' }
      - { id: c, text: 'The route the group''s components link to' }
      - { id: d, text: 'The group''s name on the page that owns it' }
    answer:
      correct: d
      explanation: >-
        The `reference` is a stable name for the component group. The `location` says what owns it, here the
        page, by its IRI (its address in the API).
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: componentgroups-in-layouts, sectionHash: 'sha256:b111d5044c5c0739', title: 'Layouts & Pages › ComponentGroups in Layouts' }
      - { kind: docs, page: /core-concepts/glossary, anchor: stranded-component-group, sectionHash: 'sha256:0a9ca1562a31e9df', title: 'Glossary › Stranded component group' }
    author: llm-draft

  - id: core.dynamic.template-page-component
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages, layouts-and-pages]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      Every blog article is displayed with the same template page. An editor adds a newsletter
      sign-up component straight into a component group on that template page, and publishes it. Which pages
      show it?
    options:
      - { id: a, text: 'Only the article the editor was viewing' }
      - { id: b, text: 'None, until each article is published again' }
      - { id: c, text: 'Only articles created after the change' }
      - { id: d, text: 'Every article that uses that template page' }
    answer:
      correct: d
      explanation: >-
        The template page holds the shared structure, its component groups, for every article that uses it.
        Only a position bound to a page data property shows each article's own component.
    sources:
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: template-pages-istemplate-true, sectionHash: 'sha256:aa5e8d6598a23a66', title: 'Layouts & Pages › Template Pages (isTemplate: true)' }
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: how-it-works, sectionHash: 'sha256:84e223903937ce11', title: 'Dynamic Pages › How It Works' }
    author: llm-draft

  - id: core.architecture.module-routing
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [architecture]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      Which part of CWA takes a visitor's URL, asks the API what is there, and renders the layout, page and
      components?
    options:
      - { id: a, text: The template app's web server }
      - { id: b, text: The database's views }
      - { id: c, text: 'Your own router, written in `app.vue`' }
      - { id: d, text: The Nuxt module }
    answer:
      correct: d
      explanation: >-
        The Nuxt module handles routing (URL → API → page → layout → components) and server-side rendering. You
        write the Vue files it renders.
    sources:
      - { kind: docs, page: /core-concepts/architecture, anchor: the-nuxt-module, sectionHash: 'sha256:8c01b275fd349b30', title: 'How It All Works › The Nuxt Module' }
    author: llm-draft

  - id: core.pages.places-groups
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [layouts-and-pages]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A page's component groups (its named lists of components, such as `main`) need to appear in two
      columns. Which Vue file decides where they go?
    options:
      - { id: a, text: The layout the page uses }
      - { id: b, text: Each component's display file }
      - { id: c, text: The site's `app.vue` }
      - { id: d, text: The page's page template }
    answer:
      correct: d
      explanation: >-
        The page template is the Vue file that displays a page, and it places the page's component groups.
        It renders inside the layout's `<slot />`.
    sources:
      - { kind: docs, page: /getting-started/key-ideas, anchor: what-a-page-is-made-of, sectionHash: 'sha256:a44954d296b13c59', title: 'Key Ideas › What a page is made of' }
    author: llm-draft

  - id: core.dynamic.when-to-use
    version: 2
    status: live
    level: beginner
    area: core-concepts
    tags: [dynamic-pages]
    type: multiple-choice
    difficulty: 1
    prompt: Which content suits dynamic pages, built from page data and a shared template page?
    options:
      - { id: a, text: 'A single home page with hand-placed content' }
      - { id: b, text: 'Repeating items, each with its own URL' }
      - { id: c, text: 'The header and footer on every page' }
      - { id: d, text: 'One page that lists every user account' }
    answer:
      correct: b
      explanation: >-
        Dynamic pages are the pattern for repeating content, such as blog articles, events, team members or
        products: one page structure, many URLs.
    sources:
      - { kind: docs, page: /core-concepts/dynamic-pages, anchor: the-problem, sectionHash: 'sha256:f0023694490ba751', title: 'Dynamic Pages › The Problem' }
      - { kind: docs, page: /core-concepts/layouts-and-pages, anchor: template-pages-istemplate-true, sectionHash: 'sha256:aa5e8d6598a23a66', title: 'Layouts & Pages › Template Pages (isTemplate: true)' }
    author: llm-draft

  - id: core.draft.publish-one
    version: 1
    status: live
    level: beginner
    area: core-concepts
    tags: [draft-and-publish]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      An editor changes three publishable components on one page, then publishes only one of them. What do
      visitors see?
    options:
      - { id: a, text: 'All three changes, because they share a page' }
      - { id: b, text: 'None of them, until all three are published' }
      - { id: c, text: 'Only the newest of the three changes' }
      - { id: d, text: 'The published change; the others stay drafts' }
    answer:
      correct: d
      explanation: >-
        The draft and published versions live on each component, so each one is published on its own. The
        other two keep their published versions until an editor publishes their drafts.
    sources:
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: adding-removing-and-reordering-are-immediate, sectionHash: 'sha256:177d97708ef53e97', title: 'Draft & Publish Workflow › Adding, Removing and Reordering Are Immediate' }
      - { kind: docs, page: /core-concepts/draft-and-publish, anchor: how-it-works, sectionHash: 'sha256:6c755a839217faca', title: 'Draft & Publish Workflow › How It Works' }
    author: llm-draft
