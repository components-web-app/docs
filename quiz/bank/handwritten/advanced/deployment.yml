# Hand-written advanced questions about deploying the template.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: deploy.k8s.php-replicas
    version: 3
    status: live
    level: advanced
    area: deployment
    tags: [kubernetes, http-caching]
    type: multiple-choice
    difficulty: 4
    prompt: Why does the Helm chart keep php at one replica by default?
    why: >-
      With a second php pod, saves in the admin seem to work but some visitors keep seeing old content. The
      template's scaled mode moves the cache to a shared Redis and Mercure to a hub pod.
    options:
      - { id: a, text: FrankenPHP can only run one worker per cluster }
      - { id: b, text: The database accepts one connection per release }
      - { id: c, text: Kubernetes can't balance traffic across php pods }
      - { id: d, text: 'Its HTTP cache and Mercure state live in the pod' }
    answer:
      correct: d
      explanation: >-
        Souin's cache store and Mercure's `bolt` transport are local to the pod. A purge only reaches its own
        pod, so a second pod would keep serving stale responses.
    sources:
      - { kind: docs, page: /deployment/kubernetes, anchor: php-stays-at-one-replica, sectionHash: 'sha256:7aec8b9c572356e4', title: 'Kubernetes & Helm › php stays at one replica' }
    author: llm-draft

  - id: deploy.k8s.nuxt-hpa-target
    version: 3
    status: live
    level: advanced
    area: deployment
    tags: [kubernetes]
    type: multiple-choice
    difficulty: 4
    prompt: The chart's HPA for the Nuxt pods targets 175% CPU utilisation. How can a target be over 100%?
    why: >-
      If you change the Nuxt CPU request and leave the target alone, the HPA either adds pods for ordinary
      traffic or waits until renders queue.
    options:
      - { id: a, text: 'Usage is a share of the pod''s CPU request, not its higher limit' }
      - { id: b, text: The HPA averages CPU across nodes rather than pods }
      - { id: c, text: Kubernetes reads values over 100% as memory targets }
      - { id: d, text: Kubernetes quietly caps the target at 100% whenever it applies it }
    answer:
      correct: a
      explanation: >-
        The target is a share of the 100m CPU request, and the limit is 1000m. At 175% a pod is using about 175m,
        roughly one 150ms render a second, before renders start to queue.
    sources:
      - { kind: docs, page: /deployment/kubernetes, anchor: nuxt-scales-out, sectionHash: 'sha256:a8e538571408aad4', title: 'Kubernetes & Helm › Nuxt scales out' }
    author: llm-draft

  - id: deploy.cicd.purge-after-deploy
    version: 2
    status: live
    level: advanced
    area: deployment
    tags: [deployment, page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Why does every deploy of the template purge the cached page HTML?
    why: >-
      If visitors see unstyled pages straight after a release, suspect a cached page from the previous build
      first.
    options:
      - { id: a, text: Souin can't read pages that an older php image cached on disk }
      - { id: b, text: 'Cached pages link to the old build''s files, which are gone' }
      - { id: c, text: Every release gives the API's resources new IRIs }
      - { id: d, text: The new Nuxt pods need the cache empty to start }
    answer:
      correct: b
      explanation: >-
        A new front-end build renames its JavaScript and CSS files and deletes the old ones. Cached pages would
        point at files that no longer exist, so visitors would get an unstyled page.
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: why-every-deploy-clears-the-page-cache, sectionHash: 'sha256:efa29d03b6a2e05d', title: 'CI/CD › Why every deploy clears the page cache' }
    author: llm-draft

  - id: deploy.cicd.purge-waits-for-rollout
    version: 3
    status: live
    level: advanced
    area: deployment
    tags: [deployment, page-caching]
    type: multiple-choice
    difficulty: 4
    prompt: A deploy purges the cached page HTML only once the new Nuxt pods have replaced the old ones. Why does it wait?
    why: >-
      If you write your own deploy steps, purge only once the rollout has finished, or unstyled pages can come
      back after the purge.
    options:
      - { id: a, text: The purge command runs inside a Nuxt pod }
      - { id: b, text: The purge needs the new pods' build ID }
      - { id: c, text: An old pod could re-cache a page from the old build }
      - { id: d, text: Kubernetes blocks `kubectl exec` during a rollout }
    answer:
      correct: c
      explanation: >-
        While an old pod is still serving, it could render a page that points at the old build and put it back
        in the cache. Only then does the deploy purge the cached pages from the php pod (`purge-rendered-html`).
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: why-every-deploy-clears-the-page-cache, sectionHash: 'sha256:efa29d03b6a2e05d', title: 'CI/CD › Why every deploy clears the page cache' }
    author: llm-draft

  - id: deploy.cloudflare.option-a-rules
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [cloudflare]
    type: multiple-choice
    difficulty: 3
    prompt: With Cloudflare as a proxy only (Option A), which Cache Rules should the zone have?
    why: >-
      Add a rule that caches pages in Option A and edits in the admin stop reaching visitors served from the
      edge, because nothing tells Cloudflare to drop the old page.
    options:
      - { id: a, text: A rule that caches every page for two hours }
      - { id: b, text: A rule that bypasses the cache for everything }
      - { id: c, text: A rule that caches `/_api` responses at the edge }
      - { id: d, text: 'None: the defaults never cache HTML or JSON' }
    answer:
      correct: d
      explanation: >-
        Cloudflare's defaults cache only static files, never HTML, JSON or a `private` response. Purges don't
        reach Cloudflare in Option A, so it must not keep pages.
      optionNotes:
        b: A bypass-everything rule sends every `/_nuxt` request to php.
    sources:
      - { kind: docs, page: /deployment/cloudflare, anchor: leave-cloudflares-cache-alone, sectionHash: 'sha256:a9bd1a1243d606d8', title: 'Cloudflare › Leave Cloudflare''s cache alone' }
    author: llm-draft

  - id: deploy.cloudflare.always-use-https
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [cloudflare, kubernetes]
    type: multiple-choice
    difficulty: 5
    prompt: Why should **Always Use HTTPS** stay off in Cloudflare for a CWA site?
    why: >-
      If a proxied hostname can't get or renew its certificate, check this setting before you dig into
      cert-manager.
    options:
      - { id: a, text: It breaks the Mercure hub's server-sent event stream }
      - { id: b, text: 'It redirects Let''s Encrypt''s HTTP-01 challenge' }
      - { id: c, text: It strips the `Surrogate-Key` header }
      - { id: d, text: It sends every request to php uncached }
    answer:
      correct: b
      explanation: >-
        ingress-nginx already redirects to HTTPS, except for `/.well-known/acme-challenge/`. Cloudflare's
        redirect makes no exception, so while the origin's certificate is missing or expired, the challenge
        fails and no certificate can be issued.
    sources:
      - { kind: docs, page: /deployment/cloudflare, anchor: each-deploy-track, sectionHash: 'sha256:7a1ff302b8717771', title: 'Cloudflare › Each deploy track' }
    author: llm-draft

  - id: deploy.origin.query-allowlist
    version: 2
    status: live
    level: advanced
    area: deployment
    tags: [page-caching, deployment]
    type: multiple-choice
    difficulty: 4
    prompt: A page template filters a collection by `?category=`, read with `useQueryBoundModel('category')`. On the server render, `category` is always empty. What do you change?
    why: >-
      Until you list it, every `?category=` value shares the cached entry for the unfiltered page, so the
      server-rendered HTML ignores the filter.
    options:
      - { id: a, text: Add `category` to `CACHE_QUERY_ALLOWLIST` }
      - { id: b, text: Add `category` to `pageCache` in `nuxt.config` }
      - { id: c, text: Add `cwa_force` to `CACHE_QUERY_ALLOWLIST` }
      - { id: d, text: Set `CACHE_QUERY_ALLOWLIST` to an empty value }
    answer:
      correct: a
      explanation: >-
        The template's Caddyfile keeps only the listed query parameters on cacheable pages, `page search order`
        by default, and drops the rest before the cache and Nuxt see the request.
      optionNotes:
        c: Never add `cwa_force`. Made-up values would all miss the cache.
    sources:
      - { kind: docs, page: /deployment/origin-protection, anchor: query-parameters-on-pages, sectionHash: 'sha256:2d2621d1a7bb717e', title: 'Origin Protection › Query Parameters on Pages' }
    author: llm-draft

  - id: deploy.origin.rate-limit-counts
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Which requests count towards the template's per-visitor rate limit in Caddy?
    why: >-
      When you size `RATE_LIMIT_EVENTS`, think about signed-in editors and visitors sharing an office address,
      because their requests miss the cache. Cached browsing costs nothing.
    options:
      - { id: a, text: 'Every request, cache hits included' }
      - { id: b, text: Only requests from signed-in users }
      - { id: c, text: Only requests that reach php or Nuxt }
      - { id: d, text: Only requests for `/_nuxt/*` files }
    answer:
      correct: c
      explanation: >-
        The limit runs inside the cache, so cache hits are never counted or refused. Over the limit, a visitor
        gets a `429` with `Retry-After`.
    sources:
      - { kind: docs, page: /deployment/origin-protection, anchor: rate-limit-on-cache-misses, sectionHash: 'sha256:1f78ec443fe8a5be', title: 'Origin Protection › Rate Limit on Cache Misses' }
    author: llm-draft
