# Hand-written advanced questions on the principles of running a CWA site in production: why caches,
# real-time updates, secrets, migrations and Cloudflare behave as they do.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  # ---------------------------------------------------------------- API

  - id: api.cache.layout-manifest-purge
    version: 1
    status: live
    family: manifest-purge
    level: advanced
    area: api
    tags: [http-caching, layouts-and-pages]
    type: multiple-choice
    difficulty: 3
    prompt: An editor adds a component to a component group that belongs to the site's shared layout. Which cached resource manifests does the API purge?
    why: >-
      A structural edit in a shared layout sends many pages' manifests back to php at once, while an edit to
      a component's text purges no manifest at all.
    options:
      - { id: a, text: 'Only the manifest of the page the editor was viewing' }
      - { id: b, text: 'None, because a manifest only lists IRIs' }
      - { id: c, text: 'Every manifest on the site, through `cwa-html`' }
      - { id: d, text: 'The manifest of every page that uses that layout' }
    answer:
      correct: d
      explanation: >-
        A write to a component group or position is traced upward to the pages that contain it. A group in a
        shared layout is on every page that uses the layout, so every one of their manifests is purged.
      optionNotes:
        b: That's why editing a component's content purges no manifest. Adding a component changes the structure.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: resource-manifests-are-tagged-per-page, sectionHash: 'sha256:c9b069e644d128b1', title: 'HTTP Caching › Resource Manifests Are Tagged per Page' }
    author: llm-draft

  - id: api.cache.failed-purge
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: An editor saves a component while the shared cache can't be reached. What happens?
    why: >-
      With a long `s-maxage`, a missed purge can leave stale content for a long time, so alert on the purge
      failure in the API's error log.
    options:
      - { id: a, text: 'The save returns an error and the change is rolled back' }
      - { id: b, text: 'The save succeeds, and the API retries the purge until it works' }
      - { id: c, text: 'The save succeeds, and cached responses can stay stale' }
      - { id: d, text: 'The save succeeds, but Mercure holds its update back' }
    answer:
      correct: c
      explanation: >-
        A failed purge doesn't fail the write: the save gets its normal response and Mercure still publishes.
        The failure is logged at error level with the tags, and those responses stay stale until they expire or
        someone purges again.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: cache-tags-and-purging, sectionHash: 'sha256:265b323fb734a064', title: 'HTTP Caching › Cache Tags and Purging' }
    author: llm-draft

  - id: api.cache.direct-database-edit
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching, page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: A developer fixes a typo in a component by running SQL against the production database. Visitors keep seeing the typo. What should the developer do?
    why: >-
      After a direct database edit, a data fix or an import, nothing purges the cache for you, so flush it
      yourself.
    options:
      - { id: a, text: 'Flush the whole HTTP cache with `purge-http-cache`' }
      - { id: b, text: 'Save the site config, so the API purges `cwa-html`' }
      - { id: c, text: 'Run `purge-rendered-html` to drop every cached page' }
      - { id: d, text: 'Wait for the daily orphan scan to notice the change' }
    answer:
      correct: a
      explanation: >-
        Tag purges only follow writes the API sees, and a direct database edit goes around it. A full flush drops
        every cached response, API and page HTML together. Dropping only the pages leaves the API responses
        they are rendered from in the cache.
      optionNotes:
        b: '`cwa-html` drops the rendered pages only. The cached API response for the component still has the typo.'
        c: This drops the pages only, and leaves cached API responses alone.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: flushing-the-whole-http-cache, sectionHash: 'sha256:d6247223c88916af', title: 'HTTP Caching › Flushing the Whole HTTP Cache' }
      - { kind: docs, page: /nuxt-module/page-caching, anchor: purging-all-cached-data, sectionHash: 'sha256:e2845b04299edb08', title: 'Page Caching › Purging All Cached Data' }
    author: llm-draft

  - id: api.cache.route-go-live-all-pages
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching, routes]
    type: multiple-choice
    difficulty: 4
    prompt: One route is scheduled to go live tomorrow at 09:00. Until then, every cached page's lifetime ends at that moment, including pages that never mention the route. Why does the API cap them all?
    why: >-
      While any route is waiting to go live, every page is kept only until then, so expect more cache misses
      on a site that always has a go-live pending.
    options:
      - { id: a, text: 'Souin can hold only one expiry time for its whole store' }
      - { id: b, text: 'A new route can change pages that never mention it, such as a menu' }
      - { id: c, text: 'The route''s IRI is added to every page''s cache tags' }
      - { id: d, text: 'Every page stays a draft until the scheduled route goes live' }
    answer:
      correct: b
      explanation: >-
        Routes, pages, page data and manifests are capped at the soonest future go-live across all routes. A
        route going live can change pages that never mention it, such as a navigation menu, and no cache tag can
        express that. A page then inherits the lowest lifetime of the responses it used.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: scheduled-publication-and-cache-lifetime, sectionHash: 'sha256:1493bbf7a17d8444', title: 'HTTP Caching › Scheduled Publication and Cache Lifetime' }
      - { kind: docs, page: /nuxt-module/page-caching, anchor: how-long-a-page-is-kept, sectionHash: 'sha256:118538e80ad6a936', title: 'Page Caching › How Long a Page Is Kept' }
    author: llm-draft

  - id: api.real-time.failed-publish
    version: 1
    status: live
    level: advanced
    area: api
    tags: [real-time]
    type: multiple-choice
    difficulty: 3
    prompt: Editors' saves still work, but people with the page open have stopped getting live updates. Where do you look first?
    why: >-
      A broken Mercure hub is silent to editors, so monitor the API's error log for failed publishes.
    options:
      - { id: a, text: 'The browser console of the editor who saved' }
      - { id: b, text: 'The Souin purge messages in the php log' }
      - { id: c, text: 'The Nuxt server log, for failed renders' }
      - { id: d, text: 'The API log, for Mercure publishes that failed' }
    answer:
      correct: d
      explanation: >-
        When a publish fails, for example because the hub can't be reached or rejects the token, the bundle logs
        it at error level, with a message containing `could not be published`, and the save still returns its
        normal response. Other open pages miss that update until they next fetch.
    sources:
      - { kind: docs, page: /api/real-time, anchor: when-updates-dont-arrive, sectionHash: 'sha256:4cf5f6932f81ece1', title: 'Real-Time Updates (Mercure) › When Updates Don''t Arrive' }
    author: llm-draft

  - id: api.real-time.secure-subscriptions
    version: 1
    status: live
    level: advanced
    area: api
    tags: [real-time, security]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A resource has `mercure: true` and the security expression `is_granted('ROLE_MEMBER')`.
      `mercure.secure_subscriptions` is left at its default. Who can receive its real-time updates?
    why: >-
      On a site with role-gated resources, leaving this off lets their changes reach visitors over Mercure even
      though the API refuses to serve them.
    options:
      - { id: a, text: 'Only signed-in users with `ROLE_MEMBER`' }
      - { id: b, text: 'Only admins, because the update is private' }
      - { id: c, text: 'Any browser that subscribes to the resource' }
      - { id: d, text: 'Nobody, until its topic is added to the cookie' }
    answer:
      correct: c
      explanation: >-
        By default the subscriber cookie includes every resource topic, whatever the user's access level. With
        `secure_subscriptions: true`, the bundle checks each resource's security expression when it issues the
        cookie and leaves out the topics the user can't access.
    sources:
      - { kind: docs, page: /api/real-time, anchor: secure-subscriptions, sectionHash: 'sha256:a55d9bda5bdb92a1', title: 'Real-Time Updates (Mercure) › Secure Subscriptions' }
    author: llm-draft

  - id: api.orphans.delete-rescan
    version: 1
    status: live
    level: advanced
    area: api
    tags: [admin, components]
    type: multiple-choice
    difficulty: 3
    prompt: An admin deletes three components listed in an orphaned resources report from an hour ago. Since that scan, an editor has placed one of them on a page. What happens?
    why: >-
      You can clean up from an old report without removing content someone has just reused.
    options:
      - { id: a, text: 'The two orphans are deleted, and the placed one is refused' }
      - { id: b, text: 'All three are deleted, because the stored report listed them' }
      - { id: c, text: 'Nothing is deleted, and the whole request returns `422`' }
      - { id: d, text: 'All three are deleted, with the new component position' }
    answer:
      correct: a
      explanation: >-
        The delete endpoint doesn't trust the stored report or the list it's sent. It scans again during the
        request and deletes only what is orphaned now. The placed component comes back in `rejected` as
        `not_orphaned`, and one refusal doesn't stop the rest.
    sources:
      - { kind: docs, page: /api/orphaned-data, anchor: deleting-orphans, sectionHash: 'sha256:3c36d4168713f1dd', title: 'Orphaned Data › Deleting Orphans' }
    author: llm-draft

  # ---------------------------------------------------------------- Nuxt module

  - id: nuxt.page-cache.signed-in-hit
    version: 1
    status: live
    level: advanced
    area: nuxt-module
    tags: [page-caching, auth]
    type: multiple-choice
    difficulty: 3
    prompt: After a Caddyfile edit, the shared cache no longer skips requests that carry the auth cookie. A signed-in admin opens a page that is in the cache. What does the admin get?
    why: >-
      If editors find the admin controls missing on some pages, check that the cache still skips requests with
      the auth cookie.
    options:
      - { id: a, text: 'Another admin''s draft view, stored when they visited' }
      - { id: b, text: 'A private copy that the cache stores for the admin''s cookie' }
      - { id: c, text: 'A fresh render, because the module sends `Vary: Cookie`' }
      - { id: d, text: 'The anonymous page, with no admin controls or drafts' }
    answer:
      correct: d
      explanation: >-
        Signed-in renders are marked `private, no-store`, so a cached page is always an anonymous one, and it
        isn't a leak. The module sends no `Vary: Cookie`, so the cache serves that anonymous copy to the admin,
        who sees no admin controls or draft content.
    sources:
      - { kind: docs, page: /nuxt-module/page-caching, anchor: deployment-requirements, sectionHash: 'sha256:534b41949291678a', title: 'Page Caching › Deployment Requirements' }
    author: llm-draft

  - id: nuxt.page-cache.accept-key
    version: 1
    status: live
    level: advanced
    area: nuxt-module
    tags: [page-caching, http-caching]
    type: multiple-choice
    difficulty: 4
    prompt: The template's cache key includes the `Accept` header for `/_api` requests and leaves it out for pages. Why?
    why: >-
      If you change the Caddyfile's cache key, a page hit rate that collapses, or JSON clients getting HTML,
      points back to this.
    options:
      - { id: a, text: 'Pages are compressed, and `Accept` would split the copies' }
      - { id: b, text: 'API output depends on it, while browsers each send their own' }
      - { id: c, text: 'Nuxt ignores `Accept`, so Souin strips it from pages' }
      - { id: d, text: 'Souin can add `Accept` to the key for JSON responses only' }
    answer:
      correct: b
      explanation: >-
        Each browser sends a different `Accept` for the same HTML, so a page key with it stores one copy per
        browser, and a page cached for one browser misses for the next. API responses do depend on it, and
        Swagger UI's response sends no `Vary: Accept`, so without it a hit could serve HTML to a JSON-LD client.
    sources:
      - { kind: docs, page: /nuxt-module/page-caching, anchor: deployment-requirements, sectionHash: 'sha256:534b41949291678a', title: 'Page Caching › Deployment Requirements' }
    author: llm-draft

  - id: nuxt.page-cache.nitro-route-rules
    version: 1
    status: live
    level: advanced
    area: nuxt-module
    tags: [page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      To speed up the blog, a developer adds a Nuxt `swr: 3600` route rule for `/blog/**`. Editors now say
      their changes take up to an hour to appear there. Why?
    why: >-
      Leave Nitro's `isr`, `swr` and `prerender` rules off CWA pages; the module's page cache is already fast
      and purgeable.
    options:
      - { id: a, text: '`swr` makes the module raise each page''s `s-maxage` to an hour' }
      - { id: b, text: 'Souin waits for the route rule to expire before a purge' }
      - { id: c, text: 'Nitro''s own cache holds the pages, and API purges never reach it' }
      - { id: d, text: 'The route rule turns off cache tags on those pages' }
    answer:
      correct: c
      explanation: >-
        The API purges Souin by tag. Nitro's own cache isn't purged by the API, so edits don't appear until the
        route rule expires. The module warns at build time when both are on.
    sources:
      - { kind: docs, page: /nuxt-module/page-caching, anchor: deployment-requirements, sectionHash: 'sha256:534b41949291678a', title: 'Page Caching › Deployment Requirements' }
    author: llm-draft

  - id: nuxt.page-cache.warm-on-server
    version: 1
    status: live
    level: advanced
    area: nuxt-module
    tags: [page-caching, admin]
    type: multiple-choice
    difficulty: 3
    prompt: Why does **Warm page cache** in site settings run on the Nuxt server, instead of fetching each page from the admin's browser?
    why: >-
      Browsing pages while signed in never fills the cache, so check caching from a private window or with
      curl.
    options:
      - { id: a, text: 'The admin''s requests carry the auth cookie, so none are stored' }
      - { id: b, text: 'A browser can''t read the sitemap that the warm works through' }
      - { id: c, text: 'The browser would download every `/_nuxt` file again' }
      - { id: d, text: 'Only the server can send a `PURGE` before each page' }
    answer:
      correct: a
      explanation: >-
        The shared cache deliberately skips requests with the auth cookie. The server requests each page
        anonymously through the in-cluster origin, with the site's public `Host`, so each page is stored under
        the same key visitors use.
    sources:
      - { kind: docs, page: /nuxt-module/page-caching, anchor: warming-the-cache-from-site-settings, sectionHash: 'sha256:2cfed47cdc82b2e6', title: 'Page Caching › Warming the Cache from Site Settings' }
    author: llm-draft

  - id: nuxt.pwa.network-first
    version: 1
    status: live
    level: advanced
    area: nuxt-module
    tags: [http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Why does the PWA guide cache CWA API responses in the service worker with `NetworkFirst`, rather than `StaleWhileRevalidate`?
    why: >-
      If you adapt the config, a strategy that answers from the cache first serves connected visitors whatever
      the service worker last stored.
    options:
      - { id: a, text: 'Workbox runs `cacheWillUpdate` only with `NetworkFirst`' }
      - { id: b, text: '`StaleWhileRevalidate` can''t be given its own `cacheName`' }
      - { id: c, text: '`StaleWhileRevalidate` would hold the Mercure stream open' }
      - { id: d, text: 'The cache is read only offline, so online visitors get fresh data' }
    answer:
      correct: d
      explanation: >-
        `NetworkFirst` reads the cache only when the network fails, that is, offline. So no connected visitor
        is served a stale or wrongly scoped response from the service worker.
    sources:
      - { kind: docs, page: /nuxt-module/pwa, anchor: tier-2-cwa-api-runtime-cache, sectionHash: 'sha256:9eff887af41250a1', title: 'Progressive Web App & Offline › Tier 2 — CWA API Runtime Cache' }
    author: llm-draft

  - id: nuxt.pwa.url-pattern
    version: 1
    status: live
    level: advanced
    area: nuxt-module
    tags: [real-time, http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: The PWA guide's runtime cache matches only CWA's content paths under `/_api`. What would a pattern matching the whole API origin break?
    why: >-
      If live updates stop after you add or change a service worker, check its runtime caching patterns first.
    options:
      - { id: a, text: 'Uploads, because the cache would replay them as `GET`s' }
      - { id: b, text: 'Sign-in, because the `/me` response would be cached' }
      - { id: c, text: 'Real-time updates, because it would catch the Mercure stream' }
      - { id: d, text: 'The admin, because `/_cwa` pages would be precached' }
    answer:
      correct: c
      explanation: >-
        The pattern is anchored to routes, manifests, pages, layouts, component groups, component positions,
        page data and components. A broad match would intercept the Mercure server-sent events connection and
        stop real-time updates.
    sources:
      - { kind: docs, page: /nuxt-module/pwa, anchor: tier-2-cwa-api-runtime-cache, sectionHash: 'sha256:9eff887af41250a1', title: 'Progressive Web App & Offline › Tier 2 — CWA API Runtime Cache' }
    author: llm-draft

  - id: nuxt.pwa.reconnect
    version: 1
    status: live
    level: advanced
    area: nuxt-module
    tags: [real-time]
    type: multiple-choice
    difficulty: 4
    prompt: A visitor's laptop is offline for an hour while editors publish changes to the page it has open, which uses `cwa-root-layout`. The Mercure hub keeps no event history. What happens when the connection comes back?
    why: >-
      You don't need an event store on the hub for offline gaps, but other pages in the route cache stay old
      until they are fetched again.
    options:
      - { id: a, text: 'The visitor misses the changes until they reload the page' }
      - { id: b, text: 'The module refetches the page''s resources and shows the outdated notice' }
      - { id: c, text: 'The hub replays the missed updates once it reconnects' }
      - { id: d, text: 'The module refetches the page''s resources and shows the new content' }
    answer:
      correct: b
      explanation: >-
        When Mercure reconnects, or the browser fires `online`, the module fetches every resource on the current
        page again. Unchanged copies are discarded. Changed ones are held back, and the visitor sees the
        outdated-content notice with an **Update** button.
      optionNotes:
        d: The module never swaps the content in by itself; the page keeps the old content until the visitor updates.
    sources:
      - { kind: docs, page: /nuxt-module/pwa, anchor: offline-and-real-time-updates, sectionHash: 'sha256:457e0a4756e3d0d4', title: 'Progressive Web App & Offline › Offline and Real-Time Updates' }
    author: llm-draft

  # ---------------------------------------------------------------- Deployment

  - id: deploy.k8s.migration-race
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [kubernetes, deployment]
    type: multiple-choice
    difficulty: 3
    prompt: You run php at three replicas on Kubernetes and keep the chart's entrypoint migrations. What can go wrong on the next deploy that adds a migration?
    why: >-
      Before you scale php beyond one pod, move migrations into a Helm hook Job, as well as sorting out the
      cache and Mercure state.
    options:
      - { id: a, text: 'Only the first pod migrates, and the others refuse to start' }
      - { id: b, text: 'Kubernetes undoes the migration if one pod fails readiness' }
      - { id: c, text: 'Helm skips migrations when more than one replica is set' }
      - { id: d, text: 'Pods that start together can run the same migration at once' }
    answer:
      correct: d
      explanation: >-
        The php entrypoint runs `doctrine:migrations:migrate` on every start. That's safe at the default single
        replica, but several pods can start together and race. Turn off the entrypoint migration and run it in a
        `pre-install,pre-upgrade` Helm hook Job, so it finishes before any new pod gets traffic.
    sources:
      - { kind: docs, page: /deployment/kubernetes, anchor: running-migrations, sectionHash: 'sha256:45306ee5d37ef051', title: 'Kubernetes & Helm › Running Migrations' }
    author: llm-draft

  - id: deploy.k8s.rollback-schema
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [kubernetes, deployment]
    type: multiple-choice
    difficulty: 4
    prompt: Release 2 added a migration that drops a column release 1 reads. Release 2 breaks the site, and you roll back to release 1 with `helm rollback`. What happens to the schema?
    why: >-
      Prefer additive migrations (add, don't rename or drop), so an older build still runs against the newer
      schema after a rollback.
    options:
      - { id: a, text: 'It stays as release 2 left it, so the column is still gone' }
      - { id: b, text: 'Helm runs the migration''s `down()`, which restores the column' }
      - { id: c, text: 'Release 1''s image runs its migrations again and adds the column back' }
      - { id: d, text: 'The rollback waits until you restore a database backup' }
    answer:
      correct: a
      explanation: >-
        The older image runs its own migrations on start, and they're already applied, so the schema stays as
        the newer release left it. Migrations are upward-only: to undo a change, write a new migration that
        reverses it and deploy that.
    sources:
      - { kind: docs, page: /deployment/kubernetes, anchor: rollback, sectionHash: 'sha256:779929d1aca64347', title: 'Kubernetes & Helm › Rollback' }
    author: llm-draft

  - id: deploy.secrets.rotation
    version: 1
    status: live
    family: kept-secrets
    level: advanced
    area: deployment
    tags: [deployment, security]
    type: multiple-choice
    difficulty: 3
    prompt: '`APP_SECRET` is set as a CI variable. To rotate it, a developer deletes the variable and deploys. Which value does the release use?'
    why: >-
      Secrets carry over from deploy to deploy so logins and signed URLs survive a rollout, so rotating one
      means supplying the new value.
    options:
      - { id: a, text: 'A newly generated value, so the secret is rotated' }
      - { id: b, text: 'Symfony''s default value, because the variable is gone' }
      - { id: c, text: 'The value in the release''s live Secret, so nothing changes' }
      - { id: d, text: 'None: the deploy fails because the variable is missing' }
    answer:
      correct: c
      explanation: >-
        For each secret that isn't a CI variable, the deploy reads the value from the release's live Secret, and
        generates one only when the release has none yet. To rotate, set a new value as the CI variable and
        deploy.
    sources:
      - { kind: docs, page: /deployment/variables, anchor: secrets, sectionHash: 'sha256:3a053dabe537216c', title: 'CI/CD Variables › Secrets' }
    author: llm-draft

  - id: deploy.cicd.staging-fixtures
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, fixtures]
    type: multiple-choice
    difficulty: 3
    prompt: Why does the template's pipeline have no fixture job for staging?
    why: >-
      When staging and production share a database, treat anything you run against staging as running against
      production.
    options:
      - { id: a, text: 'Staging copies production''s database on every deploy' }
      - { id: b, text: 'With an external database, staging uses production''s data' }
      - { id: c, text: 'Fixtures can only append to an empty review database' }
      - { id: d, text: 'Staging is uninstalled before a fixture job could run' }
    answer:
      correct: b
      explanation: >-
        Staging runs under the production environment and gets production's variables. With an external
        `DATABASE_URL` it uses production's database, so a fixture load there would write to production.
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: fixtures-on-a-deploy, sectionHash: 'sha256:1599d74ff846a6e1', title: 'CI/CD › Fixtures on a deploy' }
    author: llm-draft

  - id: deploy.cloudflare.api-accept
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [cloudflare, http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Why can't a Cloudflare Cache Rule safely cache `/_api` responses by path alone?
    why: >-
      If you let Cloudflare cache the API, copy the tested API rule with its exact `Accept` condition.
    options:
      - { id: a, text: 'API responses carry no `s-maxage`, so they''d stay for ever' }
      - { id: b, text: 'Cloudflare strips `Surrogate-Key`, so purges never match' }
      - { id: c, text: 'The module''s API requests always carry the auth cookie' }
      - { id: d, text: 'Cloudflare ignores `Vary: Accept`, so formats would mix' }
    answer:
      correct: d
      explanation: >-
        Cloudflare ignores `Vary` apart from `Accept-Encoding`, and keying on headers needs Enterprise. The API
        returns JSON-LD, JSON or the HTML docs depending on `Accept`, so a rule by path could serve the wrong
        format. The optional API rule caches only the exact `Accept` the module sends.
    sources:
      - { kind: docs, page: /deployment/cloudflare, anchor: _api-needs-its-own-rule, sectionHash: 'sha256:0506eff494c572a0', title: 'Cloudflare › /api needs its own rule' }
    author: llm-draft

  - id: deploy.cloudflare.positions-path
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [cloudflare, dynamic-pages]
    type: multiple-choice
    difficulty: 4
    prompt: With a Cloudflare rule caching `/_api`, every page data page built from one template page shows the same body after client-side navigation, while titles and server renders look right. What explains it?
    why: >-
      Without the positions exclusion in the API rule, the wrong body stays at the edge for up to a year.
    options:
      - { id: a, text: 'The pages rule caches the template page once for all of them' }
      - { id: b, text: 'Mercure updates reach only the first page''s open tabs' }
      - { id: c, text: 'Component positions vary by the `path` header, which Cloudflare ignores' }
      - { id: d, text: 'The page data records share one route, so one is cached' }
    answer:
      correct: c
      explanation: >-
        A position bound to a page-data property returns a different component for each page, chosen from the
        `path` request header, and the API sends `Vary: path`. Souin honours it, but Cloudflare ignores `Vary`.
        The API rule must leave out `/_api/_/component_positions/`.
    sources:
      - { kind: docs, page: /deployment/cloudflare, anchor: api-responses-optional, sectionHash: 'sha256:395c2b5cce8c289b', title: 'Cloudflare › API responses (optional)' }
    author: llm-draft

  - id: deploy.cloudflare.edge-ttl-override
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [cloudflare, security]
    type: multiple-choice
    difficulty: 3
    prompt: In Cloudflare's pages Cache Rule, the Edge TTL follows the origin's `Cache-Control` header. What goes wrong if you change it to a fixed TTL that ignores the header?
    why: >-
      A fixed edge TTL is the quickest way to cache a signed-in or error page at Cloudflare for everyone.
    options:
      - { id: a, text: 'Souin stops sending its tag purges to Cloudflare' }
      - { id: b, text: '`private, no-store` is ignored, so personal pages get cached' }
      - { id: c, text: 'Cloudflare starts sending a long `max-age` to browsers' }
      - { id: d, text: 'The rule is refused on any plan below Enterprise' }
    answer:
      correct: b
      explanation: >-
        The override replaces the origin's `Cache-Control`, so `private, no-store` on a personalised response or
        an error page no longer stops Cloudflare caching it. With purges reaching Cloudflare, the origin's
        `s-maxage` is the lifetime you want.
    sources:
      - { kind: docs, page: /deployment/cloudflare, anchor: edge-lifetime, sectionHash: 'sha256:36dac065ef4c0002', title: 'Cloudflare › Edge lifetime' }
    author: llm-draft

  - id: deploy.cloudflare.review-scope
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [cloudflare, deployment]
    type: multiple-choice
    difficulty: 4
    prompt: A review app is given the same `CADDY_CACHE_CDN_CONFIG`, with `provider cloudflare`, as production. What happens each time it deploys?
    why: >-
      Scope the Cloudflare settings to production, or every review deploy sends production's whole edge back to
      the origin.
    options:
      - { id: a, text: 'It purges everything in the zone, emptying production''s edge cache' }
      - { id: b, text: 'Its pages are cached at the edge under production''s hostname' }
      - { id: c, text: 'It fails, because a zone can''t have two purge senders' }
      - { id: d, text: 'Nothing extra: its purges cover the review hostname only' }
    answer:
      correct: a
      explanation: >-
        A deploy with that config ends with a purge of everything in the zone, and so does every fixture load. A
        purge everything can't be limited to one hostname, so production's edge is emptied too.
    sources:
      - { kind: docs, page: /deployment/cloudflare, anchor: secrets, sectionHash: 'sha256:41dd0a664d55b699', title: 'Cloudflare › Secrets' }
    author: llm-draft

  - id: deploy.docker.mercure-not-cached
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [real-time, page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Someone simplifies the HTML branch of the Caddyfile's `@use_cache` matcher and drops its `/.well-known/` exclusion. What do visitors notice?
    why: >-
      Keep the template's cache exclusions when you edit the Caddyfile; each one is there because something
      broke without it.
    options:
      - { id: a, text: 'Live updates arrive twice, once from the cache' }
      - { id: b, text: 'Connections pile up and the site looks down' }
      - { id: c, text: 'Sign-in fails, because the JWT cookie is cached' }
      - { id: d, text: 'Images are served from the previous build' }
    answer:
      correct: b
      explanation: >-
        Mercure uses server-sent events under `/.well-known/mercure`. A cached SSE response never finishes, so
        connections build up and the site looks like it has gone down.
    sources:
      - { kind: docs, page: /deployment/docker, anchor: what-the-page-cache-stores, sectionHash: 'sha256:05b5ea4747c68066', title: 'Docker › What the page cache stores' }
    author: llm-draft
