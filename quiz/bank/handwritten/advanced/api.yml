# Hand-written advanced questions about the API bundle: caching, security and filters.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: api.cache.admin-route-private
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching, draft-and-publish]
    type: multiple-choice
    difficulty: 3
    prompt: 'A signed-in admin''s `GET /_/routes//about-us` comes back `Cache-Control: private, no-store`. Why?'
    why: >-
      When you check caching while signed in, these responses never hit the cache, so test as a signed-out
      visitor to see what the public gets.
    options:
      - { id: a, text: 'Routes are never cached, whoever asks for them' }
      - { id: b, text: The admin's view can hold drafts at the public URL }
      - { id: c, text: 'The auth cookie expired, so the API refused to cache it' }
      - { id: d, text: Admin requests bypass Souin and go straight to php }
    answer:
      correct: b
      explanation: >-
        The API picks the draft or published view from the auth cookie, not the URL. A signed-in user's
        response for a route, manifest, position or publishable resource is marked `private, no-store`, so a
        shared cache only ever holds the published view.
      optionNotes:
        a: An anonymous visitor's route response is publicly cacheable.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: http-cache-safety, sectionHash: 'sha256:f7732bd3730f4608' }
    author: llm-draft

  - id: api.cache.vary-cookie
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching]
    type: multiple-choice
    difficulty: 4
    prompt: 'Why doesn''t the bundle send `Vary: Cookie` on resources that differ for signed-in users?'
    why: >-
      Adding `Vary: Cookie` yourself to be safe would cut the anonymous hit rate and send more requests to
      php, and it would make nothing safer.
    options:
      - { id: a, text: 'Souin ignores `Vary`, so the header would do nothing at all' }
      - { id: b, text: Browsers drop cookies from cached responses anyway }
      - { id: c, text: 'API Platform already sends `Vary: Authorization`' }
      - { id: d, text: 'Cookies churn, so it would wreck the anonymous hit rate' }
    answer:
      correct: d
      explanation: >-
        Varying on the cookie would split the cache for anonymous visitors. It isn't needed either: the
        responses that differ are marked non-cacheable outright, and the anonymous variant carries no cookie.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: http-cache-safety, sectionHash: 'sha256:f7732bd3730f4608' }
    author: llm-draft

  - id: api.cache.component-save-purge
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching]
    type: multiple-choice
    difficulty: 4
    prompt: An editor saves new text in a component on a static page. Which cached responses does the API purge?
    why: >-
      If a page's structure looks stale after an edit, check whether a group, position, page or route was
      written, because a component save alone never refreshes a manifest.
    options:
      - { id: a, text: 'Every response tagged with the component''s IRI, and no manifest' }
      - { id: b, text: 'The manifests of every page that shows the component, and nothing else' }
      - { id: c, text: 'Every rendered page, through the `cwa-html` tag' }
      - { id: d, text: 'Only the component''s own response, not the pages' }
    answer:
      correct: a
      explanation: >-
        The component's IRI is purged, so its response and every cached page tagged with it refresh. A manifest
        only lists IRIs, and that IRI hasn't changed, so no manifest is purged.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: resource-manifests-are-tagged-per-page, sectionHash: 'sha256:c9b069e644d128b1' }
    author: llm-draft

  - id: api.cache.scheduled-publish
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching, draft-and-publish]
    type: multiple-choice
    difficulty: 4
    prompt: Nothing is written when a scheduled publish time arrives. How do shared caches avoid serving the old version after it?
    why: >-
      It's why a long cache lifetime is safe with scheduled content: you don't need a short `s-maxage` or a
      job of your own to make a scheduled publish show on time.
    options:
      - { id: a, text: A scheduled job purges the component at that moment }
      - { id: b, text: Mercure tells Souin to drop the component then }
      - { id: c, text: The API sends `Expires` and caps `s-maxage` at that time }
      - { id: d, text: Souin checks every cached response again each minute }
    answer:
      correct: c
      explanation: >-
        A component with a future `publishedAt` sends `Expires` set to that date, and the bundle lowers
        `s-maxage` and `max-age` to the time left. The cached copy expires on time with no purge.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: scheduled-publication-and-cache-lifetime, sectionHash: 'sha256:302347fe1fa50302' }
    author: llm-draft

  - id: api.cache.site-config-tag
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching, page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: Saving site config changes every page. Which cache tag does the API purge so every rendered page is dropped?
    why: >-
      If you add a resource of your own that changes every page without being rendered on it, list its class
      in `purge_rendered_html_classes`, or cached pages keep the old output until they expire.
    options:
      - { id: a, text: '`site-config`' }
      - { id: b, text: '`/_/pages`' }
      - { id: c, text: '`cwa-pages`' }
      - { id: d, text: '`cwa-html`' }
    answer:
      correct: d
      explanation: >-
        The module tags every page it caches with `cwa-html`, and a write to a class in
        `purge_rendered_html_classes` (site config by default) purges it. Both sides must use the same name.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: purging-every-rendered-page, sectionHash: 'sha256:ef0a84284564cd0d' }
    author: llm-draft

  - id: api.security.unplaced-component
    version: 1
    status: live
    level: advanced
    area: api
    tags: [security]
    type: multiple-choice
    difficulty: 5
    prompt: With `routable_security` set, who can read a component that sits in no group, no page data and no template?
    why: >-
      A component you create ahead of time and haven't placed yet, such as an embargoed announcement, can be
      read by anyone who is sent its IRI.
    options:
      - { id: a, text: Only users who pass `routable_security` }
      - { id: b, text: Anyone who knows its IRI }
      - { id: c, text: 'Nobody, until it is placed' }
      - { id: d, text: Any signed-in user }
    answer:
      correct: b
      explanation: >-
        With no location at all, every check in the component voter abstains, and the voter grants access. Use
        `#[Silverback\Publishable]` or your own security if a component must stay private before it is placed.
    sources:
      - { kind: docs, page: /api/users/access-control, anchor: component-security, sectionHash: 'sha256:6b067b51d04d5855' }
    author: llm-draft

  - id: api.security.unrouted-parent
    version: 1
    status: live
    level: advanced
    area: api
    tags: [security, routes]
    type: multiple-choice
    difficulty: 4
    prompt: A parent page has no route. Its child page has a live route. Can an anonymous visitor read the parent page by its IRI?
    why: >-
      Leaving a page without a route doesn't hide it: once any child page has a live route, the parent and the
      components on it are public.
    options:
      - { id: a, text: 'No: a page without a route is always private' }
      - { id: b, text: 'Only if the parent itself is flagged as public without a route' }
      - { id: c, text: 'Yes: the child''s live route makes its ancestors readable' }
      - { id: d, text: 'Only when `routable_security` is not set' }
    answer:
      correct: c
      explanation: >-
        A resource is public when it is reachable from a live route, and reachability includes every ancestor.
        So the parent renders at its depth on the child's URL. It isn't listed in `GET /_/pages`, which only
        lists records with their own live route.
    sources:
      - { kind: docs, page: /api/users/access-control, anchor: public-access-follows-routes, sectionHash: 'sha256:d1fa4c0f3f1ae8bc' }
      - { kind: docs, page: /api/users/access-control, anchor: routable_security, sectionHash: 'sha256:66074de1539e062c' }
    author: llm-draft

  - id: api.filters.or-where
    version: 1
    status: live
    level: advanced
    area: api
    tags: [security, draft-and-publish]
    type: multiple-choice
    difficulty: 4
    family: safe-filter-and-where
    prompt: In a Doctrine filter of your own, what goes wrong if you add conditions with `orWhere()`?
    why: >-
      The bug is quiet: the search still returns the right matches, plus drafts and scheduled records that
      anonymous visitors should never see.
    options:
      - { id: a, text: API Platform throws an exception for any custom filter that uses it }
      - { id: b, text: 'It ORs past the draft and go-live conditions, so they leak' }
      - { id: c, text: It turns off pagination for the collection }
      - { id: d, text: It stops the response from getting cache tags }
    answer:
      correct: b
      explanation: >-
        The query extensions for drafts, go-live dates and route security run before filters. A top-level OR
        undoes them. Collect the clauses in an `Expr\Orx` and apply it with `andWhere()`.
    sources:
      - { kind: docs, page: /api/components/annotations/publishable, anchor: writing-safe-filters, sectionHash: 'sha256:8488ea99222de51c' }
    author: llm-draft

  - id: api.filters.and-where-code
    version: 1
    status: live
    level: advanced
    area: api
    tags: [security, draft-and-publish]
    type: spot-the-mistake
    difficulty: 4
    family: safe-filter-and-where
    prompt: This is part of a custom search filter on a publishable resource. One line lets drafts into the results. Click it.
    why: >-
      Admins can see drafts anyway, so testing the search while signed in won't show the leak. Try it as a
      signed-out visitor.
    code:
      lang: php
      text: |-
        $orX = $queryBuilder->expr()->orX();
        foreach ($values as $value) {
            $param = $queryNameGenerator->generateParameterName($property);
            $orX->add($queryBuilder->expr()->like("$alias.$property", ':' . $param));
            $queryBuilder->setParameter($param, '%' . $value . '%');
        }
        $queryBuilder->orWhere($orX);
    answer:
      line: 7
      fix: $queryBuilder->andWhere($orX);
      explanation: >-
        `orWhere()` ORs against everything already on the query, including the conditions that hide drafts and
        routes that aren't live. Wrap your OR clauses in one `andWhere()`.
    sources:
      - { kind: docs, page: /api/components/annotations/publishable, anchor: writing-safe-filters, sectionHash: 'sha256:8488ea99222de51c', block: 0, blockHash: 'sha256:4c6a4fbf5379e81e' }
    author: llm-draft

  - id: api.publishable.permission-writes
    version: 1
    status: live
    level: advanced
    area: api
    tags: [draft-and-publish, security]
    type: multiple-choice
    difficulty: 4
    prompt: A user who fails `publishable.permission` sends a `PATCH` to a publishable component. What changes?
    why: >-
      Before you give a role write access, decide whether it should also pass `publishable.permission`, or its
      edits reach visitors with no chance to review them.
    options:
      - { id: a, text: 'Its draft, which an admin must publish' }
      - { id: b, text: 'Nothing: the API answers `403`' }
      - { id: c, text: A new draft twin is created for them }
      - { id: d, text: 'The published version, directly' }
    answer:
      correct: d
      explanation: >-
        Users who don't match `publishable.permission` never see drafts, and their writes skip the draft stage:
        a `POST` is published straight away and a `PATCH` updates the published version.
    sources:
      - { kind: docs, page: /api/components/annotations/publishable, anchor: configuring-who-can-publish, sectionHash: 'sha256:c3230d5afeef2686' }
    author: llm-draft

  - id: api.real-time.protocol-version
    version: 1
    status: live
    level: advanced
    area: api
    tags: [real-time]
    type: pick-the-line
    difficulty: 3
    prompt: Which line makes the bundle talk to the hub with the Mercure 1.0 protocol, whatever mercure-bundle's default?
    why: >-
      Leave it out and the config works on mercure-bundle 0.6, but on 0.5, which the bundle also accepts,
      sign-in and `/me` fail when the bundle builds the Mercure cookie.
    code:
      lang: yaml
      text: |-
        mercure:
            hubs:
                default:
                    url: '%env(MERCURE_URL)%'
                    public_url: '%env(MERCURE_PUBLIC_URL)%'
                    protocol_version: '1.0'
                    cookie_name: '__Secure-mercure_access_token'
                    jwt:
                        secret: '%env(MERCURE_JWT_SECRET)%'
                        publish: '*'
                        claims:
                            iss: 'https://www.example.com'
                            sub: 'api'
                            client_id: 'api'
    answer:
      lines: [6]
      explanation: >-
        mercure-bundle 0.5 defaults to the 0.x protocol and 0.6 to 1.0, so setting `protocol_version: '1.0'`
        keeps the config independent of the bundle's version. 1.0 tokens then need the `iss`, `sub` and
        `client_id` claims.
    sources:
      - { kind: docs, page: /api/real-time, anchor: mercureyaml, sectionHash: 'sha256:d44a2522865ee839', block: 0, blockHash: 'sha256:46bd4d8c83cac316' }
    author: llm-draft

  - id: api.real-time.cookie-name
    version: 1
    status: live
    level: advanced
    area: api
    tags: [real-time, auth]
    type: pick-the-line
    difficulty: 5
    prompt: On mercure-bundle 0.6, admins get no private updates in development unless one line is set. Which line?
    why: >-
      If admins get no live draft updates in development while production works, a mismatched cookie name is
      the likely cause.
    code:
      lang: yaml
      text: |-
        mercure:
            hubs:
                default:
                    url: '%env(MERCURE_URL)%'
                    public_url: '%env(MERCURE_PUBLIC_URL)%'
                    protocol_version: '1.0'
                    cookie_name: '__Secure-mercure_access_token'
                    jwt:
                        secret: '%env(MERCURE_JWT_SECRET)%'
                        publish: '*'
    answer:
      lines: [7]
      explanation: >-
        On 0.6, a hub with no `cookie_name` names the subscriber cookie `mercure_access_token` while
        `kernel.debug` is on, and a hub expecting `__Secure-mercure_access_token` doesn't read it. Pin the name.
    sources:
      - { kind: docs, page: /api/real-time, anchor: mercureyaml, sectionHash: 'sha256:d44a2522865ee839', block: 0, blockHash: 'sha256:46bd4d8c83cac316' }
      - { kind: docs, page: /api/real-time, anchor: the-subscriber-cookie, sectionHash: 'sha256:ea7b06e8040e6ead' }
    author: llm-draft

  - id: api.cache.personalised-classes
    version: 1
    status: live
    level: advanced
    area: api
    tags: [http-caching, security]
    type: pick-the-line
    difficulty: 3
    prompt: Your own resource looks different for each signed-in user. Which line keeps its responses for signed-in users out of shared caches?
    why: >-
      Leave a per-user resource off this list and its responses to signed-in users go out as `public`, which
      tells any shared cache it may store one user's view.
    code:
      lang: yaml
      text: |-
        silverback_api_components:
            http_cache:
                personalised_resource_classes:
                    - 'Silverback\ApiComponentsBundle\Entity\Core\Route'
                    - 'Silverback\ApiComponentsBundle\ApiResource\ResourceManifest'
                    - 'Silverback\ApiComponentsBundle\Entity\Core\ComponentPosition'
                    - 'App\Entity\MyPersonalisedComponent'
    answer:
      lines: [7]
      explanation: >-
        A class in `personalised_resource_classes` gets `private, no-store` on authenticated `GET`s. The first
        three are the defaults; publishable resources are matched without being listed.
    sources:
      - { kind: docs, page: /api/http-caching, anchor: http-cache-safety, sectionHash: 'sha256:f7732bd3730f4608', block: 1, blockHash: 'sha256:4b182f6dadb04642' }
    author: llm-draft

  - id: api.fixtures.link-iri-page-data
    version: 1
    status: live
    level: advanced
    area: api
    tags: [fixtures, dynamic-pages]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      In a scaffold, `->linkIri('featured', pageData: …)` writes a page data record's IRI into a field. What does
      the `pageData:` argument name?
    why: >-
      A generated route is named after the slug of the title, so changing the title in the scaffold renames the
      route. A `linkIri()` that still names the old route then stops the load with a `LogicException`, so give
      linked page data a `routeName:`, or pass its builder instead of a name.
    options:
      - { id: a, text: 'The page data''s class, such as `BlogArticleData`' }
      - { id: b, text: 'The reference of the template page it renders through' }
      - { id: c, text: 'The path of its route, such as `/blog/first-post`' }
      - { id: d, text: 'The name of its route, such as `article-1`' }
    answer:
      correct: d
      explanation: >-
        `pageData()` takes no reference, so `linkIri()` finds page data by the name of its route. It can also take
        the page data's builder. `page:` and `layout:` take a reference, and `route:` a route name.
      optionNotes:
        b: A template page's reference names the page itself, with `linkIri(page:)`. Many records render through one template.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.22' }]
    sources:
      - { kind: docs, page: /api/data-fixtures/writing-a-scaffold, anchor: linking-routes-and-iris, sectionHash: 'sha256:87e67160f8a7aec6' }
      - { kind: docs, page: /api/data-fixtures/writing-a-scaffold, anchor: references-route-names-and-paths, sectionHash: 'sha256:03d81e735ac1b09c' }
    author: llm-draft
