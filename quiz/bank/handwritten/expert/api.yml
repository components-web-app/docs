# Hand-written expert questions from the API bundle's source.
# Each one cites the repo, path, line range and a full commit SHA.
# Each prompt starts from a situation a developer would meet, then asks one plain question.

questions:
  - id: api.internals.next-transition
    version: 2
    status: live
    level: expert
    area: api
    tags: [internals, http-caching]
    type: spot-the-mistake
    difficulty: 4
    docsCoverage: light
    family: api-internals-publication-cap
    prompt: >-
      A page is scheduled to go live at 09:00, but anonymous visitors keep getting the old content from the
      cache until long after 09:00. This function picks the moment a cached response must stop being used.
      One line is wrong. Click it.
    why: >-
      This cap is what lets a scheduled page appear on time with no purge. When a page goes live late
      for visitors but not for you, this is where to look.
    code:
      lang: php
      text: |-
        private function findNextTransition(Response $response, string $resourceClass, \DateTimeImmutable $now): ?\DateTimeInterface
        {
            $transitions = [];

            $expires = $response->getExpires();
            if ($expires && $expires > $now) {
                $transitions[] = $expires;
            }

            if ($this->isScheduledExpiryResource($resourceClass)) {
                $nextLiveAt = $this->routeRepository->findNextLiveAt($now);
                if (null !== $nextLiveAt) {
                    $transitions[] = $nextLiveAt;
                }
            }

            return $transitions ? max($transitions) : null;
        }
    answer:
      line: 17
      fix: '    return $transitions ? min($transitions) : null;'
      explanation: >-
        The cache must stop at the first change to come: the response's own `Expires` or the next route
        going live, whichever is sooner. `max()` picks the later one, so the old page outlives the
        go-live.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/CacheHeadersEventListener.php, lines: [127, 144], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:712348427f1d7d93' }
      - { kind: docs, page: /api/http-caching, anchor: scheduled-publication-and-cache-lifetime, sectionHash: 'sha256:1493bbf7a17d8444', title: 'HTTP Caching › Scheduled Publication and Cache Lifetime' }
    author: llm-draft

  - id: api.internals.unpublished-route-response
    version: 2
    status: live
    level: expert
    area: api
    tags: [internals, routes, http-caching]
    type: multiple-choice
    difficulty: 4
    docsCoverage: light
    prompt: >-
      A page is scheduled to go live tomorrow. Today, an anonymous visitor requests its route
      (`GET /_/routes/{path}`). What does the API send back?
    why: >-
      If that 404 could be cached, one early visitor or crawler would hide the page from everyone after
      it went live, until the cache expired.
    options:
      - { id: a, text: 'A `404`, marked `private, no-store`' }
      - { id: b, text: 'A `404`, with `s-maxage` capped at the go-live' }
      - { id: c, text: 'A `401`, marked `private, no-store`' }
      - { id: d, text: 'A `404`, cached until a purge at go-live' }
    answer:
      correct: a
      explanation: >-
        The denial becomes a `404`, so nobody can tell the page exists yet, and it's marked never to be
        stored.
      optionNotes:
        b: The cap at the next go-live is for responses that can be cached. This one is never stored at all.
        c: On the route and manifest endpoints a `401` or `403` is turned into a `404`, so the route's existence doesn't show.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/UnpublishedRouteExceptionListener.php, lines: [29, 46], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:20efd75041da42d8' }
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/CacheHeadersEventListener.php, lines: [53, 59], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:f6a1991bcec8d6f4' }
    author: llm-draft

  - id: api.internals.persist-before-flush
    version: 2
    status: live
    level: expert
    area: api
    tags: [internals, fixtures]
    type: multiple-choice
    difficulty: 4
    docsCoverage: undocumented
    prompt: >-
      Besides pages, your scaffold needs an ordinary Doctrine entity, such as a category. Early in `load()`,
      before `$cwa->flush()`, you call `$cwa->persist($category)`. When is the category saved?
    why: >-
      Code that expects the entity in the database before `flush()`, such as a query or a lookup by ID,
      finds nothing. And an entity tied to content the load skipped isn't saved; the summary only counts it
      as skipped.
    options:
      - { id: a, text: 'Straight away, before any of the pages' }
      - { id: b, text: 'During `flush()`, after the pages and page data' }
      - { id: c, text: 'Never: `persist()` throws outside a flush' }
      - { id: d, text: 'Never: it is only counted in the summary' }
    answer:
      correct: b
      explanation: >-
        Outside a flush, `persist()` only queues the entity. `flush()` saves the queue after the pages
        and page data, and leaves out an entity that links to content the load skipped.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [316, 332], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:a1c646f503ed0f51' }
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [551, 566], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:6022bee6f7d2bdf2' }
    author: llm-draft

  - id: api.internals.authenticated-layout-headers
    version: 3
    status: live
    level: expert
    area: api
    tags: [internals, http-caching]
    type: multiple-choice
    difficulty: 4
    docsCoverage: light
    prompt: >-
      Signed in as an admin, you check cache headers in the network tab. The page's route response is
      `private, no-store`. The `Layout` class isn't publishable and isn't in `personalised_resource_classes`.
      What does the API do to the cache headers on the layout's response?
    why: >-
      When you check caching while signed in, public headers on a Layout aren't a leak. What must never
      be shared is a response that could carry drafts, and those are the ones marked private.
    options:
      - { id: a, text: 'Marks it `private, no-store`' }
      - { id: b, text: Caps `s-maxage` at the next route go-live }
      - { id: c, text: Removes `s-maxage` but keeps it public }
      - { id: d, text: Leaves them as they are }
    answer:
      correct: d
      explanation: >-
        For a signed-in user, `CacheHeadersEventListener` only marks personalised resources, which can
        show an admin drafts, and then returns. The go-live cap is only for anonymous responses.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/CacheHeadersEventListener.php, lines: [46, 75], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:7237d377c78aeca5' }
    author: llm-draft

  - id: api.internals.layout-empty-ui-component
    version: 2
    status: live
    level: expert
    area: api
    tags: [internals, fixtures]
    type: multiple-choice
    difficulty: 3
    docsCoverage: undocumented
    prompt: >-
      The fixture builder adds `CwaLayout` in front of the UI name you give a layout. A scaffold creates one
      with an empty name, `$cwa->layout('main', '')`. What is stored in the layout's `uiComponent`?
    why: >-
      In a scaffold, an empty name gives a layout with no UI component, not one called `CwaLayout`,
      which no file would match.
    options:
      - { id: a, text: '`CwaLayout`' }
      - { id: b, text: An empty string }
      - { id: c, text: '`null`' }
      - { id: d, text: '`main`' }
    answer:
      correct: c
      explanation: >-
        The prefix is only added to a name that isn't empty. An empty string stores `null`.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [233, 244], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:a54fee8a4eceea95' }
    author: llm-draft

  - id: api.internals.layout-same-ref
    version: 2
    status: live
    level: expert
    area: api
    tags: [internals, fixtures]
    type: multiple-choice
    difficulty: 4
    docsCoverage: light
    prompt: >-
      Near the top of a scaffold you call `$cwa->layout('main', 'Primary')`. Further down, you try to switch
      the same layout with `$cwa->layout('main', 'Landing')`. Which UI component does the layout get?
    why: >-
      A later call that seems to change a layout does nothing and raises no error. To change a layout,
      change the first call that uses its ref.
    options:
      - { id: a, text: '`CwaLayoutPrimary`' }
      - { id: b, text: '`CwaLayoutLanding`' }
      - { id: c, text: 'Two layouts, one for each call' }
      - { id: d, text: 'Neither: the second call throws' }
    answer:
      correct: a
      explanation: >-
        `layout()` makes a builder the first time it sees a ref. Later calls with the same ref return
        that builder unchanged, and their UI name and classes are ignored.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [233, 244], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:a54fee8a4eceea95' }
    author: llm-draft

  - id: api.internals.route-name-conflict
    version: 2
    status: live
    level: expert
    area: api
    tags: [internals, routes]
    type: multiple-choice
    difficulty: 5
    docsCoverage: undocumented
    prompt: >-
      You generate a route for a new page titled "My Post". No route uses the path `/my-post`, but an
      existing route is named `my-post`. Which path does the new page get?
    why: >-
      A new page can get `/my-post-1` although `/my-post` looks free. When a generated URL has a number
      you didn't expect, look for a route with that name.
    options:
      - { id: a, text: '`/my-post`, since only the name clashed' }
      - { id: b, text: '`/my-post-2`, skipping the clashing number' }
      - { id: c, text: 'None: generation fails with a 422' }
      - { id: d, text: '`/my-post-1`, with the name `my-post-1`' }
    answer:
      correct: d
      explanation: >-
        `resolveConflicts()` adds the same `-1`, `-2`… to the name and the path together, until neither
        clashes.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Helper/Route/RouteGenerator.php, lines: [146, 177], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:676ce15209789418' }
      - { kind: code, repo: api-components-bundle, path: src/Helper/Route/RouteGenerator.php, lines: [80, 102], commit: a5faa3ba48f7fa4134ca04807b4da7abf701f1f7, linesHash: 'sha256:903fd398f535e642' }
    author: llm-draft
