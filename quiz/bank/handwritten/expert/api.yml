# Hand-written expert questions from the API bundle's source.
# Each one cites the repo, path, line range and a full commit SHA.

questions:
  - id: api.internals.next-transition
    version: 1
    status: live
    level: expert
    area: api
    tags: [internals, http-caching]
    type: spot-the-mistake
    difficulty: 4
    docsCoverage: light
    family: api-internals-publication-cap
    prompt: >-
      For an anonymous request, the API caps a response's `s-maxage` at the moment returned here. One line
      is wrong. Click it.
    code:
      lang: php
      text: |-
        private function findNextTransition(Response $response, string $resourceClass, \DateTimeImmutable $now): ?\DateTimeInterface
        {
            $transitions = [];

            $expires = $response->getExpires();
            if ($expires && $expires > $now) {
                $transitions[] = $expires;
            }

            if ($this->isScheduledExpiryResource($resourceClass)) {
                $nextLiveAt = $this->routeRepository->findNextLiveAt($now);
                if (null !== $nextLiveAt) {
                    $transitions[] = $nextLiveAt;
                }
            }

            return $transitions ? max($transitions) : null;
        }
    answer:
      line: 17
      fix: '    return $transitions ? min($transitions) : null;'
      explanation: >-
        The cap must be the first change to come: the response's own `Expires`, or the next time a route goes
        live, whichever is sooner. With `max()`, a response could stay cached after a page went live.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/CacheHeadersEventListener.php, lines: [122, 139], commit: dcf8ce9cbe273f0304f6c57f3ec70e97f935e0d4, linesHash: 'sha256:712348427f1d7d93' }
      - { kind: docs, page: /api/http-caching, anchor: scheduled-publication-and-cache-lifetime, sectionHash: 'sha256:302347fe1fa50302' }
    author: llm-draft

  - id: api.internals.unpublished-route-response
    version: 1
    status: live
    level: expert
    area: api
    tags: [internals, routes, http-caching]
    type: multiple-choice
    difficulty: 4
    docsCoverage: light
    prompt: An anonymous visitor asks for `GET /_/routes/{path}` for a route scheduled to go live tomorrow. What response does the API send?
    options:
      - { id: a, text: 'A `404`, marked `private, no-store`' }
      - { id: b, text: 'A `404`, with `s-maxage` capped at the go-live' }
      - { id: c, text: 'A `401`, marked `private, no-store`' }
      - { id: d, text: 'A `404`, cached until a purge at go-live' }
    answer:
      correct: a
      explanation: >-
        The route provider flags the request as an unpublished route. A `401` or `403` on a flagged request
        becomes a `404`, and the cache listener marks it never stored, so no cache keeps the 404 past go-live.
      optionNotes:
        b: The cap at the next go-live is for responses that can be cached. This one is never stored at all.
        c: The denial is turned into a `404` on the route and manifest endpoints, so the route's existence doesn't show.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/UnpublishedRouteExceptionListener.php, lines: [29, 46], commit: dcf8ce9cbe273f0304f6c57f3ec70e97f935e0d4, linesHash: 'sha256:20efd75041da42d8' }
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/CacheHeadersEventListener.php, lines: [63, 69], commit: dcf8ce9cbe273f0304f6c57f3ec70e97f935e0d4, linesHash: 'sha256:f6a1991bcec8d6f4' }
    author: llm-draft

  - id: api.internals.persist-before-flush
    version: 1
    status: live
    level: expert
    area: api
    tags: [internals, fixtures]
    type: multiple-choice
    difficulty: 4
    docsCoverage: undocumented
    prompt: In a scaffold's `load()`, you call `$cwa->persist($entity)` before `$cwa->flush()`. What does that call do?
    options:
      - { id: a, text: 'Persists it with Doctrine at once, ahead of the pages' }
      - { id: b, text: 'Queues it, and the builder persists it during `flush()`' }
      - { id: c, text: 'Throws, because persist is only allowed during a flush' }
      - { id: d, text: 'Records it for the summary line, but never persists it' }
    answer:
      correct: b
      explanation: >-
        Outside a flush, `persist()` only queues the entity. `flush()` persists the queue after the pages and
        page data, and skips an entity that links to content the load skipped.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [290, 306], commit: dcf8ce9cbe273f0304f6c57f3ec70e97f935e0d4, linesHash: 'sha256:a1c646f503ed0f51' }
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [508, 523], commit: dcf8ce9cbe273f0304f6c57f3ec70e97f935e0d4, linesHash: 'sha256:6022bee6f7d2bdf2' }
    author: llm-draft

  - id: api.internals.authenticated-layout-headers
    version: 1
    status: live
    level: expert
    area: api
    tags: [internals, http-caching]
    type: multiple-choice
    difficulty: 4
    docsCoverage: light
    prompt: A signed-in admin requests a Layout, which isn't publishable or in `personalised_resource_classes`. What does `CacheHeadersEventListener` do to the response?
    options:
      - { id: a, text: 'Marks it `private, no-store`' }
      - { id: b, text: Caps `s-maxage` at the next route go-live }
      - { id: c, text: Removes `s-maxage` but keeps it public }
      - { id: d, text: Nothing at all }
    answer:
      correct: d
      explanation: >-
        For an authenticated user, the listener only marks personalised resources and then returns. The cap at
        the next publication change is applied to anonymous responses only.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/EventListener/Api/CacheHeadersEventListener.php, lines: [56, 85], commit: e1db48d5166307cbaac8cee6ba2e6f2718b1d56f, linesHash: 'sha256:7237d377c78aeca5' }
    author: llm-draft

  - id: api.internals.layout-empty-ui-component
    version: 1
    status: live
    level: expert
    area: api
    tags: [internals, fixtures]
    type: multiple-choice
    difficulty: 3
    docsCoverage: undocumented
    prompt: A scaffold calls `$cwa->layout('main', '')`. What does the new layout's `uiComponent` hold?
    options:
      - { id: a, text: '`CwaLayout`' }
      - { id: b, text: An empty string }
      - { id: c, text: '`null`' }
      - { id: d, text: '`main`' }
    answer:
      correct: c
      explanation: >-
        The builder adds the `CwaLayout` prefix only to a non-empty suffix. An empty string stores `null`.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [207, 218], commit: e1db48d5166307cbaac8cee6ba2e6f2718b1d56f, linesHash: 'sha256:a54fee8a4eceea95' }
    author: llm-draft

  - id: api.internals.layout-same-ref
    version: 1
    status: live
    level: expert
    area: api
    tags: [internals, fixtures]
    type: multiple-choice
    difficulty: 4
    docsCoverage: light
    prompt: A scaffold calls `$cwa->layout('main', 'Primary')`, and later `$cwa->layout('main', 'Landing')`. What does the layout store?
    options:
      - { id: a, text: '`CwaLayoutPrimary`' }
      - { id: b, text: '`CwaLayoutLanding`' }
      - { id: c, text: 'Two layouts, one for each call' }
      - { id: d, text: 'Nothing: the second call throws' }
    answer:
      correct: a
      explanation: >-
        `layout()` creates a builder only the first time it sees a ref. Later calls with the same ref return that
        builder unchanged, so their `uiComponent` and classes are ignored.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Fixture/CwaFixtureBuilder.php, lines: [207, 218], commit: e1db48d5166307cbaac8cee6ba2e6f2718b1d56f, linesHash: 'sha256:a54fee8a4eceea95' }
    author: llm-draft

  - id: api.internals.route-name-conflict
    version: 1
    status: live
    level: expert
    area: api
    tags: [internals, routes]
    type: multiple-choice
    difficulty: 5
    docsCoverage: undocumented
    prompt: The route generator makes a route for a page titled "My Post". No route has the path `/my-post`, but one is already named `my-post`. What path does the new route get?
    options:
      - { id: a, text: '`/my-post`, since only the name clashed' }
      - { id: b, text: '`/my-post-2`, skipping the clashing number' }
      - { id: c, text: 'None: generation fails with a 422' }
      - { id: d, text: '`/my-post-1`, with the name `my-post-1`' }
    answer:
      correct: d
      explanation: >-
        `resolveConflicts()` adds the same `-1`, `-2`… suffix to the name and the path together, until neither
        clashes with an existing route.
    sources:
      - { kind: code, repo: api-components-bundle, path: src/Helper/Route/RouteGenerator.php, lines: [146, 177], commit: e1db48d5166307cbaac8cee6ba2e6f2718b1d56f, linesHash: 'sha256:676ce15209789418' }
      - { kind: code, repo: api-components-bundle, path: src/Helper/Route/RouteGenerator.php, lines: [80, 102], commit: e1db48d5166307cbaac8cee6ba2e6f2718b1d56f, linesHash: 'sha256:903fd398f535e642' }
    author: llm-draft
