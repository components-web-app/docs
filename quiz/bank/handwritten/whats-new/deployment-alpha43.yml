# Hand-written What's new questions about deployment: template changes in 2.0.0-alpha.43.
# Each one has a `since` naming the release that brought the change in.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: deploy.db.backup-bucket
    version: 1
    status: live
    level: intermediate
    area: deployment
    tags: [deployment, uploads]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A project turns on `CWA_CI_DATABASE_BACKUP_PRODUCTION`. Which bucket should `CWA_CI_DATABASE_BACKUP_BUCKET`
      name?
    why: >-
      A dump holds every user's email address and password hash, so where it lands decides who can read them.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'The media bucket, `GCLOUD_BUCKET`, under its own prefix' }
      - { id: b, text: 'A private bucket of its own that nobody can read anonymously' }
      - { id: c, text: 'Any bucket, because the dump is encrypted before upload' }
      - { id: d, text: 'None: the backup is kept in the cluster''s volume' }
    answer:
      correct: b
      explanation: >-
        The backup needs a private bucket of its own. The deploy refuses `GCLOUD_BUCKET`, which is public and which
        the daily orphan scan cleans, and after each upload it deletes a dump that it can read without credentials.
    sources:
      - { kind: docs, page: /deployment/migrations-and-backups, anchor: the-backup-bucket, sectionHash: 'sha256:4c00ed94b6c95e7b', title: 'Migrations and Backups › The backup bucket' }
    author: llm-draft

  - id: deploy.db.window-failure
    version: 2
    status: live
    level: advanced
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A production deploy runs with `CWA_CI_MAINTENANCE_DURING_MIGRATIONS="true"`, and the migration Job fails after
      maintenance mode is on. What do visitors see?
    why: >-
      A failed window keeps visitors off a half-migrated site, so someone has to act on the log before the site
      opens again.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'The old release, because the deploy turns maintenance off' }
      - { id: b, text: 'The new release with the old schema' }
      - { id: c, text: 'The maintenance page, until someone acts on the job''s log' }
      - { id: d, text: 'The restored backup, which the deploy loads at once' }
    answer:
      correct: c
      explanation: >-
        Anything that fails after maintenance is on leaves it on. The job's log ends with the backup's path, how to
        restore it, and how to turn maintenance off. The next production deploy also ends the window, with or
        without the variable. A failed migration is rolled back in one transaction, so a restore is rarely needed.
    sources:
      - { kind: docs, page: /deployment/migrations-and-backups, anchor: when-the-window-fails, sectionHash: 'sha256:45499c30eab5cc79', title: 'Migrations and Backups › When the window fails' }
    author: llm-draft

  - id: deploy.db.window-steps
    version: 2
    status: live
    level: advanced
    area: deployment
    tags: [deployment]
    type: select-many
    difficulty: 3
    prompt: >-
      A production deploy with `CWA_CI_MAINTENANCE_DURING_MIGRATIONS="true"` finds migrations pending. Which of these
      does it do while maintenance mode is on? Choose every one.
    why: >-
      Knowing what happens inside the window tells you what a failure at each step leaves behind.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'Migrates in a Job, even with `CWA_CI_MIGRATIONS_JOB_DISABLED="true"`' }
      - { id: b, text: 'Rolls out the new release, then flushes the cache and warms `/_api`' }
      - { id: c, text: 'Backs up, if `CWA_CI_DATABASE_BACKUP_PRODUCTION` is `"true"`' }
      - { id: d, text: 'Deploys staging first, to test the migration against a copy' }
      - { id: e, text: 'Restores the backup automatically when a migration fails' }
    answer:
      correct: [a, b, c]
      explanation: >-
        With maintenance on, it backs up (when the backup switch is on), migrates in a Job, rolls out, flushes and
        warms, then turns maintenance off. Nothing is restored automatically, and staging isn't part of it.
      optionNotes:
        d: 'The window only covers production''s own deploy.'
        e: 'A failure leaves maintenance on and prints how to restore. Restoring is up to you.'
    sources:
      - { kind: docs, page: /deployment/migrations-and-backups, anchor: the-maintenance-window, sectionHash: 'sha256:4fa7217bbd036276', title: 'Migrations and Backups › The maintenance window' }
    author: llm-draft

  - id: deploy.k8s.migration-lock
    version: 2
    status: live
    level: intermediate
    area: deployment
    tags: [kubernetes]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      At 03:00 a deploy starts a new API pod, and at the same moment the nightly orphan scan Job starts its own
      pod. Both run the migrations when they start. What happens on PostgreSQL?
    why: >-
      Two processes running the same migration at once could fail half-way; the lock makes starting together safe.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'Both run the migrations, and the second fails on a duplicate' }
      - { id: b, text: 'The orphan scan is skipped that night' }
      - { id: c, text: 'The deploy waits for 03:30 before it starts the pod' }
      - { id: d, text: 'One migrates under a lock; the other waits, then finds nothing to do' }
    answer:
      correct: d
      explanation: >-
        Migrations and `ANALYZE` run through `app:database:migrate` under a PostgreSQL advisory lock. The other process
        prints that another is migrating, waits up to 600 seconds, then has nothing left to do.
    sources:
      - { kind: docs, page: /deployment/kubernetes, anchor: running-migrations, sectionHash: 'sha256:23300e7354f7b8ec', title: 'Kubernetes & Helm › Running Migrations' }
    author: llm-draft

  - id: deploy.mercure.hub-settings-file
    version: 1
    status: retired
    retired: { reason: "trivia: an upgrade step; the quiz doesn't ask about upgrades (Daniel, 2026-10-20)" }
    level: intermediate
    area: deployment
    tags: [real-time, deployment]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      Upgrading a project, a developer copies the template's new `api/frankenphp/Caddyfile` and nothing else. php
      then won't start. Why?
    why: >-
      The hub's settings now live in a file of their own, so a project's own hub changes belong there too.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'The Caddyfile imports `mercure-hub.caddy`, which wasn''t copied' }
      - { id: b, text: 'The new Caddyfile needs a newer FrankenPHP base image' }
      - { id: c, text: 'The Mercure JWT keys must be generated again for it' }
      - { id: d, text: 'Caddy refuses a Caddyfile that changed after the build' }
    answer:
      correct: a
      explanation: >-
        The template keeps the hub's settings in `api/frankenphp/mercure-hub.caddy`, and its Caddyfile imports them
        into the `mercure` block. Copy it (and `mercure-hub.Caddyfile`) with the Caddyfile, and move any hub settings
        you changed into it.
    sources:
      - { kind: docs, page: /api/real-time, anchor: in-the-template, sectionHash: 'sha256:9a095622be439007', title: 'Real-Time Updates (Mercure) › In the Template' }
    author: llm-draft

  - id: deploy.db.backup-key
    version: 1
    status: live
    level: intermediate
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      A project turns on `CWA_CI_DATABASE_BACKUP_PRODUCTION`. Which credentials upload the backup to the
      backup bucket?
    why: >-
      A key that can reach the backups must never sit in the API pods, which run the site's code and hold the
      media key.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: '`CWA_CI_DATABASE_BACKUP_GCLOUD_JSON`, a key for this project''s folder only' }
      - { id: b, text: '`GCLOUD_JSON`, the same key the API uses to store uploaded media files' }
      - { id: c, text: 'The default service account of the node that the backup Job runs on' }
      - { id: d, text: 'None, because the backup bucket accepts any write from inside the cluster' }
    answer:
      correct: a
      explanation: >-
        Backups use a key of their own, which can only create, get, list and delete objects in the project's
        folder. The deploy refuses a key for the media key's service account, and the Job gets the key in a
        Secret of its own that is deleted when it finishes.
      optionNotes:
        b: 'Before this change the upload used `GCLOUD_JSON`. Now the deploy refuses the same service account.'
    sources:
      - { kind: docs, page: /deployment/migrations-and-backups, anchor: the-backup-bucket, sectionHash: 'sha256:4c00ed94b6c95e7b', title: 'Migrations and Backups › The backup bucket' }

  - id: deploy.cicd.failed-rollout-tag
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, kubernetes]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A production deploy's new API pods never become ready, and after `CWA_CI_DEPLOY_ROLLOUT_TIMEOUT` the
      deploy fails. Which build does the registry's `:production` tag name now?
    why: >-
      The track tag is what the next deploy and a rollback start from, so a failed deploy must not leave it on
      a build that never worked.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'The last build that deployed well, because the tag moves only after a rollout' }
      - { id: b, text: 'The new build, because Helm had already applied the new revision to the release' }
      - { id: c, text: 'No build at all: the tag is removed until a deploy succeeds again' }
      - { id: d, text: 'Whatever `:main` holds, because a failed deploy falls back to it' }
    answer:
      correct: a
      explanation: >-
        The deploy pins `<track tag>@<digest>` for Helm, waits for the Nuxt and API rollouts, and copies the
        build to the track's tag only once the migrations and both rollouts have succeeded. The failed deploy
        stops with `THE cwa ROLLOUT DID NOT FINISH`, while the old pods keep serving.
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: which-build-a-deploy-runs, sectionHash: 'sha256:87e6488d5b8bf578', title: 'CI/CD › Which build a deploy runs' }

  - id: deploy.db.staging-shared-database
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      Staging uses production's database through an external `DATABASE_URL`. A staging deploy finds two
      migrations pending. What happens?
    why: >-
      Staging migrating a shared database first would skip production's backup and maintenance window, and
      change the schema under the live site.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'Staging isn''t deployed; the production deploy runs the migrations' }
      - { id: b, text: 'Staging migrates the shared database, then rolls out its pods' }
      - { id: c, text: 'Staging rolls out its new pods without migrating, so they run on the old schema' }
      - { id: d, text: 'The staging job fails and blocks production''s next deploy' }
    answer:
      correct: a
      explanation: >-
        The deploy sees that staging's database is production's, by host, port and database name. Its pods
        never migrate, and with migrations pending the job succeeds with a warning while the old staging keeps
        running. Production's deploy migrates, with its own plan, backup and window. A canary fails instead.
    sources:
      - { kind: docs, page: /deployment/migrations-and-backups, anchor: a-track-on-productions-database, sectionHash: 'sha256:b9ea13097ff22805', title: 'Migrations and Backups › A track on production''s database' }

  - id: deploy.cicd.retry-ci-only
    version: 1
    status: live
    level: intermediate
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      On GitLab, a production deploy with a maintenance window fails while migrating. Does GitLab run the job
      again by itself?
    why: >-
      Running a failed window again would back up and migrate a second time while the site is in maintenance,
      which is for a person to decide.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'No: it retries only when CI failed, such as a runner or a timeout' }
      - { id: b, text: 'Yes, once, taking another backup and migrating again' }
      - { id: c, text: 'Yes, until the deploy succeeds or the pipeline times out' }
      - { id: d, text: 'Yes, once, skipping the backup that it already took' }
    answer:
      correct: a
      explanation: >-
        The staging and production jobs retry once only for CI failures: a runner or scheduler failure, a GitLab
        API failure or the job's timeout. A failed deploy is never run again by itself.
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: production, sectionHash: 'sha256:face01a6120317be', title: 'CI/CD › Production' }

  - id: deploy.db.window-left-on
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A production deploy's maintenance window failed and left maintenance on. You fix the migration and run a
      normal production deploy, without `CWA_CI_MAINTENANCE_DURING_MIGRATIONS`. What happens to maintenance mode?
    why: >-
      A fix-forward deploy shouldn't need the same switches as the one that failed, or the site stays in
      maintenance until someone remembers them.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'The deploy finds the window''s marker and turns maintenance off after the rollout' }
      - { id: b, text: 'It stays on, because only a deploy with the variable set can end a window' }
      - { id: c, text: 'The deploy refuses to run until someone turns maintenance off by hand' }
      - { id: d, text: 'It turns off at once, before the deploy rolls out the fixed release' }
    answer:
      correct: a
      explanation: >-
        The window marks itself with a ConfigMap, `<fullname>-maintenance-window`. Every production deploy looks
        for it, rolls out, flushes, warms and then turns maintenance off. Maintenance an admin turned on has no
        marker, so a deploy leaves it alone.
      optionNotes:
        b: 'That was true before `abcc4a1`, and still is for a window left on before it, which has no marker.'
    sources:
      - { kind: docs, page: /deployment/migrations-and-backups, anchor: when-the-window-fails, sectionHash: 'sha256:45499c30eab5cc79', title: 'Migrations and Backups › When the window fails' }

  - id: deploy.db.review-production-database
    version: 2
    status: live
    level: intermediate
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      On GitLab, production uses an external database: `DATABASE_URL` points at it, and
      `CWA_CI_POSTGRES_ENABLED` is `"false"`. Both variables are scoped to All environments, so review apps get
      them too. What happens on the next review app deploy?
    why: >-
      A review app migrating production's database would change the live schema from an unreviewed branch, so
      the deploy stops it.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.43' }]
    options:
      - { id: a, text: 'It''s refused with `REVIEW APP NOT DEPLOYED` before Helm runs' }
      - { id: b, text: 'It deploys and migrates production''s database first' }
      - { id: c, text: 'It deploys, but its pods skip migrations as staging''s do' }
      - { id: d, text: 'It deploys with an in-cluster database of its own instead' }
    answer:
      correct: a
      explanation: >-
        Review apps must have their own database. The deploy compares the review's `DATABASE_URL` with
        production's release, looked up as `RELEASE_PRODUCTION` in `KUBE_NAMESPACE_PRODUCTION`, and refuses a match.
        Scope production's database variables to production. If production can't be read, the deploy only warns.
      optionNotes:
        c: 'Skipping migrations is the guard for staging and canary, which share production''s namespace.'
    sources:
      - { kind: docs, page: /deployment/migrations-and-backups, anchor: review-apps, sectionHash: 'sha256:871fbf5bbd5cdda2', title: 'Migrations and Backups › Review apps' }
