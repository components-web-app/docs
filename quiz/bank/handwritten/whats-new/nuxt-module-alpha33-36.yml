# Hand-written What's new questions about the Nuxt module: changes in 2.0.0-alpha.33 to alpha.36.
# Each one has a `since` naming the release that brought the change in.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: nuxt.kit.field-binding
    version: 1
    status: live
    level: intermediate
    area: nuxt-module
    tags: [admin, composables]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      In a component's admin tab, `<CwaUiInput field="title" label="Title" />` sits inside `<CwaUiManagerTab>`.
      What does `field="title"` do?
    why: >-
      Most tabs need no `useCwaResourceModel` of their own, so a tab can be a few lines of template.
    since: [{ repo: cwa-nuxt-module, version: '2.0.0-alpha.33' }]
    options:
      - { id: a, text: 'Only sets the input''s `name` attribute' }
      - { id: b, text: 'Saves `title` on the selected component' }
      - { id: c, text: 'Reads `title` once, and saves it when the tab closes' }
      - { id: d, text: 'Saves `title` on the page, not the component' }
    answer:
      correct: b
      explanation: >-
        `field` creates a `useCwaResourceModel` for the tab's IRI, so the input saves with the debounce and
        shows its save state, presence and co-editing conflicts. Bind each field with exactly one of `field`,
        `:model` or `v-model`.
    sources:
      - { kind: docs, page: /nuxt-module/building-your-ui/creating-components, anchor: binding-a-field, sectionHash: 'sha256:57aae5b3c0aa13e2', title: 'Component Files › Binding a Field' }
    author: llm-draft

  - id: nuxt.config.define-cwa-config-literal
    version: 1
    status: live
    level: intermediate
    area: nuxt-module
    tags: [components]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A component's Vue file has `const config = { name: 'Quote', icon: 'quote' }` and then
      `defineCwaConfig(config)`. What happens when the app builds?
    why: >-
      The module reads the call when the app builds, not when it runs, so it can only read what's written in
      the call itself.
    since: [{ repo: cwa-nuxt-module, version: '2.0.0-alpha.36' }]
    options:
      - { id: a, text: 'It works the same as passing the object directly' }
      - { id: b, text: 'The build fails with a type error' }
      - { id: c, text: 'The build warns and ignores that file''s config' }
      - { id: d, text: 'The config is read when the component first renders' }
    answer:
      correct: c
      explanation: >-
        `defineCwaConfig` takes one object literal in one call. A variable, a spread or a computed key makes the
        build warn and ignore the file's config, so the component appears under its folder name with no icon.
    sources:
      - { kind: docs, page: /nuxt-module/building-your-ui/creating-components, anchor: configuring-a-component, sectionHash: 'sha256:6d348eddd3d4498f', title: 'Component Files › Configuring a Component' }
    author: llm-draft

  - id: nuxt.upload.held-file
    version: 1
    status: live
    level: intermediate
    area: nuxt-module
    tags: [admin, uploads]
    type: multiple-choice
    difficulty: 2
    prompt: >-
      An editor adds an Image component and picks a file in its upload tab before clicking **+ Draft**. What
      happens to the file?
    why: >-
      An image component doesn't need `instantAdd` to take a file in the same step it's added.
    since: [{ repo: cwa-nuxt-module, version: '2.0.0-alpha.33' }]
    options:
      - { id: a, text: 'It''s refused until the component is saved' }
      - { id: b, text: 'It''s held in the browser, then uploaded on save' }
      - { id: c, text: 'It''s uploaded at once to a temporary resource' }
      - { id: d, text: 'It''s lost, and must be picked again' }
    answer:
      correct: b
      explanation: >-
        The upload field holds the file in the browser while the component is unsaved, and uploads it straight
        after the component is created.
    sources:
      - { kind: docs, page: /nuxt-module/component-helpers/images-and-uploads, anchor: admin-upload-tab, sectionHash: 'sha256:650b540ebe25fa7b', title: 'Images & Media › Admin Upload Tab' }
    author: llm-draft
