# Hand-written What's new questions about deploying the template: changes in 2.0.0-alpha.38 and alpha.39.
# Each one has a `since` naming the release that brought the change in.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: deploy.cache.backend-timeout
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      On a template before 2.0.0-alpha.38, after a full flush, the first visitor to a CMS-heavy page gets a `504`,
      which Cloudflare passes on. The page takes about 12 seconds to render cold. What produced the `504`?
    why: >-
      A `504` straight after a flush or a rollout points at Souin giving up on a slow cold render, not at php
      running out of workers. If you raise the timeout, keep it under the ingress and Cloudflare timeouts.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.38' }]
    options:
      - { id: a, text: 'Souin stopped waiting for the render after its default 10 seconds' }
      - { id: b, text: 'FrankenPHP shed the request while it waited for a free worker' }
      - { id: c, text: 'ingress-nginx closed the connection before php had answered' }
      - { id: d, text: 'Cloudflare stopped waiting for the origin to start its response' }
    answer:
      correct: a
      explanation: >-
        Souin's own backend timeout is 10 seconds, so a 12-second cold render became a `504`. From alpha.38 the
        Caddyfile sets 30 seconds, so the page is served and cached, and a render that is really stuck still gets
        Souin's error before ingress-nginx (60 seconds) or Cloudflare (100) give up.
      optionNotes:
        b: Load shedding answers `503` after `FRANKENPHP_MAX_WAIT_TIME`, not `504`.
        c: ingress-nginx waits 60 seconds, far longer than this render.
        d: Cloudflare waits 100 seconds; it only passed on Souin's `504`.
    sources:
      - { kind: docs, page: /deployment/docker, anchor: the-cache-store-and-backend-timeout, sectionHash: 'sha256:6beeddf100757934' }
      - { kind: docs, page: /deployment/troubleshooting, anchor: the-first-visitor-after-a-flush-or-a-rollout-gets-a-504, sectionHash: 'sha256:2b336d6f58332c99' }
    author: llm-draft

  - id: deploy.cache.extra-config-timeout
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, page-caching]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A project sets `CADDY_CACHE_EXTRA_CONFIG` to `timeout { cache 1s }`, and the deploy refuses it. What would
      that block have done to the Caddyfile's `cache` settings?
    why: >-
      Souin accepts the block without an error, so without the deploy's check the 30-second backend timeout would
      be lost silently and slow cold pages would `504` again.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.38' }]
    options:
      - { id: a, text: 'Stopped Caddy from loading, because a second `timeout` block is an error' }
      - { id: b, text: 'Replaced the whole `timeout` block, so the backend timeout fell to 10 seconds' }
      - { id: c, text: 'Made every entry in the otter store expire one second after it was stored' }
      - { id: d, text: 'Been added to the existing block, giving a backend and a cache timeout' }
    answer:
      correct: b
      explanation: >-
        A second `timeout` block replaces the first one whole, so the Caddyfile's `backend` line is lost and Souin
        uses its own 10 seconds. The deploy refuses a `timeout` block or a store there; set
        `CWA_API_CADDY_CACHE_BACKEND_TIMEOUT` instead.
    sources:
      - { kind: docs, page: /deployment/variables, anchor: http-cache, sectionHash: 'sha256:80151c7f434355a2' }
    author: llm-draft

  - id: deploy.cache.extra-config-upgrade
    version: 1
    status: live
    level: intermediate
    area: deployment
    tags: [deployment, page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      You update a project to template 2.0.0-alpha.38. Its `CADDY_CACHE_EXTRA_CONFIG` CI variable is `otter`, the
      name of Souin's in-memory store. What should you do with the variable in that deploy?
    why: >-
      The new deploy fails on an `otter` line in that variable, so a project that kept it can't deploy until it's
      removed.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.38' }]
    options:
      - { id: a, text: 'Move it to the chart''s `php.caddy.storageConfig`' }
      - { id: b, text: 'Rename it to `CWA_API_CADDY_CACHE_EXTRA_CONFIG`' }
      - { id: c, text: 'Keep it, because the store must still be named there' }
      - { id: d, text: 'Delete it, because otter is now the default store' }
    answer:
      correct: d
      explanation: >-
        The store is its own setting now, `CWA_API_CADDY_CACHE_STORAGE`, and defaults to `otter`. The extra config
        is for other Souin directives only, so delete the variable if it only restated the store.
      optionNotes:
        b: '`CADDY_CACHE_EXTRA_CONFIG` is reserved, so the `CWA_API_` form fails the deploy.'
        a: '`php.caddy.storageConfig` is now `php.caddy.extraConfig`, and the chart reads no old name.'
    sources:
      - { kind: docs, page: /deployment/variables, anchor: http-cache, sectionHash: 'sha256:80151c7f434355a2' }
    author: llm-draft

  - id: deploy.review.stop-scripts
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      On GitLab, a branch with a review app is merged with *Delete source branch*, and GitLab runs **stop review**.
      Whose `bin/devops/k8s.sh` and `project.sh` does that job run?
    why: >-
      A change to the stop steps in a branch's `project.sh` doesn't apply to that branch's own stop; it has to be
      on the default branch first.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.38' }]
    options:
      - { id: a, text: 'The copies built into the review app''s API image' }
      - { id: b, text: 'The deleted branch''s, from the commit it last deployed' }
      - { id: c, text: 'The default branch''s, which the job fetches' }
      - { id: d, text: 'The ones from the latest tagged template release' }
    answer:
      correct: c
      explanation: >-
        The job doesn't check out its branch (`GIT_STRATEGY: none`), because the branch may already be deleted. It
        fetches `bin/devops` from the default branch, so the stop runs that branch's scripts.
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: review-apps, sectionHash: 'sha256:fc3b3dcc3c805b43' }
    author: llm-draft

  - id: deploy.review.storage-path
    version: 1
    status: live
    level: intermediate
    area: deployment
    tags: [deployment, uploads]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      Several apps share one bucket, and app A's `GCLOUD_PATH_PREFIX` is `site-a/`. You add a bucket lifecycle
      rule to delete A's review app uploads when a stop review couldn't. Which `matchesPrefix` should the rule
      use?
    why: >-
      A rule on `review/` misses a prefixed app's review uploads, and a rule on the prefix alone deletes
      production's uploads too.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.38' }]
    options:
      - { id: a, text: '`review/`' }
      - { id: b, text: '`site-a/review/`' }
      - { id: c, text: '`review/site-a/`' }
      - { id: d, text: '`site-a/`' }
      - { id: e, text: '`site-a/review/review-`' }
    answer:
      correct: b
      explanation: >-
        A review app stores under `<GCLOUD_PATH_PREFIX>review/<slug>/`, so the bucket needs one rule per prefixed
        app, here `site-a/review/`. Use `review/` only for an app with no prefix.
      optionNotes:
        d: That matches every object of app A, so production's uploads would be deleted too.
    sources:
      - { kind: docs, page: /deployment/variables, anchor: review-app-paths, sectionHash: 'sha256:283ea9d9c4379f7a' }
    author: llm-draft

  - id: deploy.review.lifecycle-age
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, uploads]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A bucket lifecycle rule deletes a project's review app uploads with an `age` of 90 days. One review app
      stays up for four months. What happens to its uploads?
    why: >-
      Pick the rule's age from how long your review apps live, or a long-running one loses its images while
      people are still reviewing it.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.38' }]
    options:
      - { id: a, text: 'They stay, because the database still references each one' }
      - { id: b, text: 'They stay until 90 days after the review app has been stopped' }
      - { id: c, text: 'They stay, because the rule only matches `review/` at the root' }
      - { id: d, text: 'Each is deleted 90 days after it was uploaded, while the app runs' }
    answer:
      correct: d
      explanation: >-
        The age counts from each object's creation, not from when the review app stops, so uploads older than 90
        days are deleted while the app is still running.
    sources:
      - { kind: docs, page: /deployment/variables, anchor: review-app-paths, sectionHash: 'sha256:283ea9d9c4379f7a' }
    author: llm-draft

  - id: deploy.cicd.rewarm-after-flush
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, cloudflare, page-caching]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A site has `provider cloudflare` in `CADDY_CACHE_CDN_CONFIG`. On templates before 2.0.0-alpha.39, the first
      visitor's component requests after a deploy were load-shed. What caused it?
    why: >-
      A deploy that flushes the whole HTTP cache throws away the new pod's start-up warm, so it needs its own warm
      afterwards or the first visitors hit a cold API.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.39' }]
    options:
      - { id: a, text: 'Cloudflare held back every request to the origin until its purge had finished' }
      - { id: b, text: 'The deploy''s full flush emptied the `/_api` cache the new pod had just warmed' }
      - { id: c, text: 'The new pod took traffic before its start-up warm of `/_api` had finished' }
      - { id: d, text: 'The deploy purged only the rendered pages, leaving old API responses cached' }
    answer:
      correct: b
      explanation: >-
        With Cloudflare configured, the deploy runs `purge-http-cache`, which also empties the `/_api` cache the
        php pod warmed when it started. From alpha.39 the deploy warms `/_api` again in the API pod afterwards.
      optionNotes:
        c: Kubernetes starts no probe until the `postStart` hook returns, so the pod isn't ready while it warms.
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: why-every-deploy-clears-the-page-cache, sectionHash: 'sha256:8ce1ee7f40bc4869' }
    author: llm-draft

  - id: deploy.k8s.warm-two-passes
    version: 1
    status: live
    level: advanced
    area: deployment
    tags: [deployment, kubernetes, page-caching]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A new php pod warms its `/_api` cache with `warm-http-cache`, then runs it again with
      `--accept-encoding=br`. Why the second pass?
    why: >-
      Warming only one encoding leaves browsers and Cloudflare missing on every API response, even though
      server-side renders are fast.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.38' }]
    options:
      - { id: a, text: 'A `gzip` entry is served only once its `br` copy has been stored' }
      - { id: b, text: 'The first pass warms only routes, and the second their components' }
      - { id: c, text: 'The cache keeps one entry per encoding, and browsers read the `br` ones' }
      - { id: d, text: 'The second pass refills entries the first pass''s own purge removed' }
    answer:
      correct: c
      explanation: >-
        The first pass warms the `gzip` entries server-side rendering reads. The cache stores one entry per
        encoding, so the `br` pass warms the entries browsers and Cloudflare read.
    sources:
      - { kind: docs, page: /deployment/kubernetes, anchor: warming-the-api-cache-on-start, sectionHash: 'sha256:2332452b7281a251' }
    author: llm-draft
