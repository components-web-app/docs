# Hand-written What's new questions about the API bundle: changes in 2.0.0-alpha.31 to 2.0.0-alpha.33.
# Each one has a `since` naming the release that brought the change in.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: api.groups.move-keeps-position
    version: 1
    status: live
    level: intermediate
    area: api
    tags: [components]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A script sends `POST {component}/move` with `from` a component position and `to` a component group on
      another page. What happens to the position?
    why: >-
      Anything that stored the position's IRI, such as a Mercure subscriber or a cached order, still points
      at the right record after the move.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.32' }]
    options:
      - { id: a, text: 'It is deleted, and a new position is made in the target group' }
      - { id: b, text: 'The same position moves to the group and keeps its IRI' }
      - { id: c, text: 'It stays, and a second position is added for the component' }
      - { id: d, text: 'It is emptied, and the component is copied to the group' }
    answer:
      correct: b
      explanation: >-
        A move from a position to a group moves the same position, placed as a `PATCH` of its `componentGroup`
        with `after` or `before` would place it, so its IRI doesn't change. A new position is created only when
        the component comes out of a page data property.
    sources:
      - { kind: docs, page: /api/components/component-groups, anchor: what-a-move-does, sectionHash: 'sha256:7ebeeb9d88ebd448', title: 'Component Groups & Positions › What a move does' }
    author: llm-draft

  - id: api.groups.move-into-full-property
    version: 1
    status: live
    level: advanced
    area: api
    tags: [components, dynamic-pages]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A move's `to` is a page data property that already holds another component. What does the API do?
    why: >-
      A move never drops a component on the floor: to put one in an occupied property, clear the property
      first, or write it directly with a page data `PATCH`.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.32' }]
    options:
      - { id: a, text: 'Replaces it, and the old component is left unplaced' }
      - { id: b, text: 'Replaces it, and the old component moves to `from`' }
      - { id: c, text: 'Refuses with a `422` on `to.property`, changing nothing' }
      - { id: d, text: 'Adds a position for it on the page data''s template' }
    answer:
      correct: c
      explanation: >-
        A target property that already holds a component is refused rather than replaced: a `422` with the
        violation on `to.property`, and nothing changes.
    sources:
      - { kind: docs, page: /api/components/component-groups, anchor: when-a-move-is-refused, sectionHash: 'sha256:fd69c38d0e229496', title: 'Component Groups & Positions › When a move is refused' }
    author: llm-draft

  - id: api.groups.move-position-into-property
    version: 1
    status: live
    level: advanced
    area: api
    tags: [components, dynamic-pages]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A component's only use is one component position. A move takes it from that position into an empty page
      data property. What happens to the component?
    why: >-
      Unlike deleting the position and posting to the page data yourself, a move can't lose the component
      between the two requests.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.32' }]
    options:
      - { id: a, text: 'The property holds it, and the position is removed' }
      - { id: b, text: 'It is deleted along with its last position' }
      - { id: c, text: 'The property holds a copy with a new IRI' }
      - { id: d, text: 'The position stays, bound to the page data property' }
    answer:
      correct: a
      explanation: >-
        The property is set and the position is removed in one database write. The component isn't deleted,
        even though that position was its only use.
    sources:
      - { kind: docs, page: /api/components/component-groups, anchor: what-a-move-does, sectionHash: 'sha256:7ebeeb9d88ebd448', title: 'Component Groups & Positions › What a move does' }
    author: llm-draft

  - id: api.groups.usage-admin-only
    version: 1
    status: live
    level: intermediate
    area: api
    tags: [components, security]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A signed-in user with `ROLE_USER` only, who can read a component, requests `GET {component}/usage`.
      What do they get?
    why: >-
      The list of places names pages a user may not be allowed to see, so a front end that showed usage counts
      to anyone but admins has to stop.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.32' }]
    options:
      - { id: a, text: 'The counts, without the list of `locations`' }
      - { id: b, text: 'The counts and the locations they can read' }
      - { id: c, text: 'A `401`, the same as an anonymous request' }
      - { id: d, text: 'A `403`: only `ROLE_ADMIN` may read it' }
    answer:
      correct: d
      explanation: >-
        The usage endpoint is `ROLE_ADMIN` only. Any other signed-in user gets a `403`, and an anonymous request a
        `401`. Before bundle 2.0.0-alpha.32 anyone who could read the component got the counts.
    sources:
      - { kind: docs, page: /api/components/component-groups, anchor: who-can-read-it, sectionHash: 'sha256:33a348856ee6bc26', title: 'Component Groups & Positions › Who can read it' }
    author: llm-draft

  - id: api.security.route-pattern-whole-path
    version: 2
    status: live
    level: intermediate
    area: api
    tags: [security, routes]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A `route_security` rule uses the pattern `/admin*`. Which route does it cover?
    why: >-
      A pattern without a leading `*` no longer reaches into the middle of a path, and its letters must match
      the path's exactly, so a rule written to catch a segment anywhere needs `*/admin*`.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.33' }]
    options:
      - { id: a, text: '`/team/admin/settings`' }
      - { id: b, text: '`/administration`' }
      - { id: c, text: '`/blog/admin`' }
      - { id: d, text: '`/Admin`' }
    answer:
      correct: b
      explanation: >-
        A pattern matches the whole path, `*` is the only wildcard, and every other character matches only
        itself, so letters are case-sensitive. `/admin*` is a prefix: it covers `/administration`, but not
        `/Admin` or a path with `/admin` in the middle.
    sources:
      - { kind: docs, page: /api/users/access-control, anchor: how-a-pattern-matches, sectionHash: 'sha256:1d59392459a892e6', title: 'Access Control › How a pattern matches' }
    author: llm-draft

  - id: api.security.route-pattern-select
    version: 2
    status: live
    level: advanced
    area: api
    tags: [security, routes]
    type: select-many
    difficulty: 3
    prompt: >-
      Which of these paths does the `route_security` pattern `/user-area*` match? Choose every one.
    why: >-
      Knowing exactly what a pattern covers is the difference between a protected area and one that leaks a
      similarly named page.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.33' }]
    options:
      - { id: a, text: '`/user-area`' }
      - { id: b, text: '`/user-areas`' }
      - { id: c, text: '`/user-area/profile`' }
      - { id: d, text: '`/User-Area/profile`' }
      - { id: e, text: '`/members/user-area/profile`' }
    answer:
      correct: [a, b, c]
      explanation: >-
        The pattern is a prefix of the whole path, and `*` matches any run of characters, including none and
        `/`. Every other character matches only itself, so the letters' case must match, and the pattern
        doesn't match mid-path.
      optionNotes:
        b: '`*` matches any characters after the prefix, not only a `/` and what follows.'
        d: 'Letters are case-sensitive, from bundle 2.0.0-alpha.33. Add a rule for each spelling you need.'
        e: 'The pattern matches from the start of the path. `*/user-area*` would match this one.'
    sources:
      - { kind: docs, page: /api/users/access-control, anchor: how-a-pattern-matches, sectionHash: 'sha256:1d59392459a892e6', title: 'Access Control › How a pattern matches' }
    author: llm-draft

  - id: api.publishable.draft-reference
    version: 1
    status: live
    level: advanced
    area: api
    tags: [draft-and-publish, components]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A component is published and has a draft. An admin's `POST /_/component_positions` names the draft's IRI
      as `component`. What does the new position store?
    why: >-
      Publishing merges a draft into its published component and deletes the draft, so a position holding the
      draft would be emptied by the next publish.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.31' }]
    options:
      - { id: a, text: 'The draft, until the draft is published' }
      - { id: b, text: 'The published component the draft belongs to' }
      - { id: c, text: 'Nothing: the write is refused with a `422`' }
      - { id: d, text: 'A new copy of the draft, published at once' }
    answer:
      correct: b
      explanation: >-
        A reference never stores the draft of a published component: the published component is stored
        instead. Admins still see the draft through the position. A draft that has never been published is
        stored as it is.
    sources:
      - { kind: docs, page: /api/components/annotations/publishable, anchor: a-reference-to-a-draft-stores-the-published-component, sectionHash: 'sha256:c346c09e9f0b34fe', title: 'Publishable › A Reference to a Draft Stores the Published Component' }
    author: llm-draft

  - id: api.console.maintenance-already-on
    version: 1
    status: live
    level: intermediate
    area: api
    tags: [deployment, page-caching]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      An admin turned maintenance mode on in the site settings. A deploy then runs
      `silverback:api-components:maintenance on`. What does the command do?
    why: >-
      A deploy can run the command without checking the current state first, and still rely on the cached pages
      being gone.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.33' }]
    options:
      - { id: a, text: 'Exits `1`, because maintenance mode is already on' }
      - { id: b, text: 'Writes nothing, still purges the cached pages, exits `0`' }
      - { id: c, text: 'Writes the setting again and purges nothing' }
      - { id: d, text: 'Turns it off, because `on` toggles the setting' }
    answer:
      correct: b
      explanation: >-
        It prints `Maintenance mode is already on` and writes nothing, then purges the rendered pages' `cwa-html` tag
        and the site config's tags as it always does, and exits `0`.
    sources:
      - { kind: docs, page: /api/console-commands, anchor: maintenance, sectionHash: 'sha256:c71b2d3ff0852773', title: 'Console Commands › maintenance' }
    author: llm-draft

  - id: api.console.maintenance-exit-codes
    version: 1
    status: live
    level: advanced
    area: api
    tags: [deployment]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A deploy script runs `silverback:api-components:maintenance on --quiet` before migrating, and the command
      prints nothing. How should the script tell whether it worked?
    why: >-
      A failed purge or database write must stop the deploy before it migrates, and with `--quiet` the exit code is
      the only signal.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.33' }]
    options:
      - { id: a, text: 'Run `status` after it and look for `on`' }
      - { id: b, text: 'Nothing printed means that it worked' }
      - { id: c, text: 'Check its exit code, which is `1` on failure' }
      - { id: d, text: 'Read the error from the API pod''s log' }
    answer:
      correct: c
      explanation: >-
        `--quiet` hides the error messages too. The command exits `1` when the purge fails or the database can't be
        read or written, `2` for an argument other than `on`, `off` or `status`, and `0` when it's done. A
        `status` check can say `on` even when the purge failed.
    sources:
      - { kind: docs, page: /api/console-commands, anchor: maintenance, sectionHash: 'sha256:c71b2d3ff0852773', title: 'Console Commands › maintenance' }
    author: llm-draft

  - id: api.uploads.manifest-no-variants
    version: 1
    status: live
    level: advanced
    area: api
    tags: [uploads]
    type: multiple-choice
    difficulty: 4
    prompt: >-
      A developer adds a new imagine filter and deploys. Which request generates an image's variant for it, if
      nothing generated it ahead of time?
    why: >-
      Building a page's manifest stays fast and has no side effects, so a new filter's variants come from reading
      the resource or from generating them ahead of time.
    since: [{ repo: api-components-bundle, version: '2.0.0-alpha.33' }]
    options:
      - { id: a, text: 'The page''s resource manifest, as the page is built' }
      - { id: b, text: 'Nothing, until the image is uploaded again' }
      - { id: c, text: 'The next fixture load, which regenerates all variants' }
      - { id: d, text: 'Reading the image resource itself, such as `GET` on its IRI' }
    answer:
      correct: d
      explanation: >-
        A variant that isn't stored yet is generated the first time the resource itself is read. Building a resource
        manifest doesn't generate variants or write file info rows, because the manifest's body has no
        `mediaObjects`. `imagine:generate` makes them before visitors ask.
    sources:
      - { kind: docs, page: /api/components/annotations/uploadable, anchor: liipimaginebundle-integration, sectionHash: 'sha256:2dc7bff380211595', title: 'Uploadable › LiipImagineBundle Integration' }
    author: llm-draft
