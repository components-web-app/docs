# Hand-written What's new questions about deployment: template changes in 2.0.0-alpha.41 and 2.0.0-alpha.42.
# Each one has a `since` naming the release that brought the change in.
# Format: quiz/README.md. Run `pnpm quiz:stamp <id>` to fill in or refresh the hashes.

questions:
  - id: deploy.k8s.no-php-hpa
    version: 3
    status: live
    level: intermediate
    area: deployment
    tags: [kubernetes]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      On a cluster running the template's chart with default values, `kubectl get hpa` lists the Nuxt HPA
      only. Why is there none for php?
    why: >-
      An HPA that can never scale only adds noise, such as memory always shown over its target, so a missing
      php HPA is expected, not a failed deploy.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.42' }]
    options:
      - { id: a, text: 'The deploy failed to create it and should be re-run' }
      - { id: b, text: 'php scales by memory, which an HPA can''t measure' }
      - { id: c, text: 'The chart skips it while `autoscaling.maxReplicas` is 1' }
      - { id: d, text: 'php is a StatefulSet, which an HPA can''t target' }
    answer:
      correct: c
      explanation: >-
        While `autoscaling.maxReplicas` is 1, the default, the chart renders no php HPA and the Deployment runs
        `autoscaling.minReplicas` pods. A `maxReplicas` above 1 brings it back, but the API's cache lives in each pod, so
        more than one API pod needs scaled mode, which shares the cache in Redis.
    sources:
      - { kind: docs, page: /deployment/kubernetes, anchor: php-stays-at-one-replica, sectionHash: 'sha256:7aec8b9c572356e4', title: 'Kubernetes & Helm › php stays at one replica' }
    author: llm-draft

  - id: deploy.browser-tests.sitemap-pages
    version: 1
    status: live
    level: intermediate
    area: deployment
    tags: [deployment]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A new project keeps the template's `e2e/` tests unchanged. Its sitemap lists only the home page. What
      happens when the browser tests run?
    why: >-
      The template's tests rely on the admin user and the sitemap, not on sample content, so the sitemap is what
      a project must get right for them to pass.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.42' }]
    options:
      - { id: a, text: 'They pass: the tests use the template''s sample pages' }
      - { id: b, text: 'The loading bar test fails: it needs a second page' }
      - { id: c, text: 'They are skipped until the sitemap has ten pages' }
      - { id: d, text: 'Every test fails, because the admin can''t sign in' }
    answer:
      correct: b
      explanation: >-
        The loading bar test navigates from the first sitemap page to the second, so the sitemap needs at least
        two pages. The tests don't use the template's sample content.
    sources:
      - { kind: docs, page: /deployment/browser-tests, anchor: what-they-check, sectionHash: 'sha256:e646b312ebf31b12', title: 'Browser Tests › What they check' }
    author: llm-draft

  - id: deploy.cicd.warm-after-fixtures
    version: 2
    status: live
    level: advanced
    area: deployment
    tags: [deployment, fixtures, http-caching]
    type: multiple-choice
    difficulty: 3
    prompt: >-
      A deploy loads fixtures. When the load succeeds, the deploy flushes the whole HTTP cache, API responses
      and pages alike. What does it do straight after the flush?
    why: >-
      Without the warm, the first visitors after a fixture load would make every API request a cache miss at
      once.
    since: [{ repo: components-web-app, version: '2.0.0-alpha.42' }]
    options:
      - { id: a, text: 'Nothing: the cache refills as visitors arrive' }
      - { id: b, text: 'Renders every page in the sitemap to warm the HTML' }
      - { id: c, text: 'Warms the `/_api` responses, but not the pages' }
      - { id: d, text: 'Restarts php so its cache starts empty' }
    answer:
      correct: c
      explanation: >-
        After the flush, the deploy runs `warm_api_cache`, the same gzip and br passes of `warm-http-cache` a deploy
        runs after any full flush. Pages aren't warmed, and a failed pass only warns.
    sources:
      - { kind: docs, page: /deployment/ci-cd, anchor: fixtures-on-a-deploy, sectionHash: 'sha256:6cec51b620d64bda', title: 'CI/CD › Fixtures on a deploy' }
    author: llm-draft
